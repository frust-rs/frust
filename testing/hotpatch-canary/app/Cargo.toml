[package]
name = "hotpatch-canary-app"
version = "0.1.0"
edition = "2024"
publish = false

# The template's crate types: the capture must still find this multi-type lib as a lib.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
frust-hotpatch = { path = "../../../crates/frust-hotpatch" }
hotpatch-canary-shared = { path = "../shared" }
serde_json = "1"
