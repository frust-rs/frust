# Standalone workspace, outside the root graph: the hot-patch CI canary run by
# `scripts/ci/hotpatch-canary.sh`. `app` is the patched fixture, `driver` the
# headless builder that fat-builds, edits, thin-builds and applies it.
[workspace]
resolver = "3"
members = ["app", "driver"]

# Debug dependencies at `opt-level = 1`, as the `frust create` template sets them.
[profile.dev.package."*"]
opt-level = 1
