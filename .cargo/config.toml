# Android link flags (cargo, cargo-ndk, Gradle): --pack-dyn-relocs=relr + --use-android-relr-tags (RELR with the Android-private tags, DT_ANDROID_RELR, API 28+, below the floor of 29;
# the standard DT_RELR tags need API 30, do not use until the floor is 30) and --icf=all (no fn-pointer identity compares). Numbers: docs/PERFORMANCE_BASELINES.md "Android link flags".
# Governs nested in-tree workspaces; crates/frust-cli/tests/profile_sync.rs diffs these with the template's; no [build].

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=relr", "-C", "link-arg=-Wl,--use-android-relr-tags", "-C", "link-arg=-Wl,--icf=all"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=relr", "-C", "link-arg=-Wl,--use-android-relr-tags", "-C", "link-arg=-Wl,--icf=all"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=relr", "-C", "link-arg=-Wl,--use-android-relr-tags", "-C", "link-arg=-Wl,--icf=all"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=relr", "-C", "link-arg=-Wl,--use-android-relr-tags", "-C", "link-arg=-Wl,--icf=all"]
