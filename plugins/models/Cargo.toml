[package]
name = "frust-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model store and downloader for on-device AI models in Frust apps"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["hub", "frust-api"]
# `--no-default-features` is the charter-line gate: `cargo tree -p frust-models
# --no-default-features -e normal` must show no `frust-ui`.
frust-api = ["dep:frust"]
hub = ["dep:ureq", "dep:sha2", "dep:rustls", "dep:webpki-roots", "dep:jni", "dep:frust-plugin"]

[[example]]
name = "download_component"
required-features = ["frust-api", "hub"]

[dependencies]
frust-paths = { path = "../../crates/frust-paths", version = "0.6.7" }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `default-features = false`: a library never turns on the facade's defaults; the app decides.
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.7", default-features = false, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
# Dev-only: the facade does not re-export `ReactiveRuntime`, which `spawn_blocking` needs in tests.
frust-reactive = { workspace = true }

# Backup exclusion on iOS and macOS goes through `NSURL` resource values.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSValue",
    "NSObject",
] }

# `jni` and `frust-plugin` (the only `frust-*` crate a platform plugin may reach) give the Hub
# calls the same Looper check as the sibling plugins; Android-only, behind `hub`.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.7", optional = true }
