# `frust-beui`: the beUI design-system catalog plugin — the tier's second
# external-origin design system (ported from beUI v2, not authored here;
# upstream is MIT-licensed, © 2026 Saurabh Chauhan, and the attribution record
# lives in the crate root's docs).
# Production deps are the frust facade plus kurbo/peniko for the geometry/color
# vocabulary its widgets paint with, the same pins frust-widgets carries and the
# same shape frust-glyph/frust-material/frust-cupertino/frust-shadcn carry;
# frust-widgets and frust-core are dev-dependencies only (the sanctioned
# test-fixture/RenderRoot route, shipping nothing).
[package]
name = "frust-beui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
frust = { path = "../../crates/frust", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", features = ["test-support"] }
# Test-only: the catalog's paint/event tests drive a real `RenderRoot` (which
# the facade does not re-export), and `test-support` turns on the
# `PaintCtx::for_test` clock seam — the same dev-dependency shape every other
# design-system plugin carries.
frust-core = { path = "../../crates/frust-core", features = ["test-support"] }
