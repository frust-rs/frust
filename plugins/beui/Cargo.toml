# Ported from beUI v2; upstream MIT, © 2026 Saurabh Chauhan. Vendored licence text:
# LICENSE-beui.md; attribution record in the crate root docs.
[package]
name = "frust-beui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "beUI design-system catalog for Frust: a port of beUI v2 with its tokens, glass recipes, motion layer and bundled Geist fonts."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.5.2", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.5.2", features = ["test-support"] }
# Test-only: paint/event tests drive a real `RenderRoot` (not re-exported by the facade);
# `test-support` enables the `PaintCtx::for_test` clock seam.
frust-core = { path = "../../crates/frust-core", version = "0.5.2", features = ["test-support"] }

[features]
default = []
# Not default: a default build carries no `gpu_fx` module. Reaches `wgpu` only through
# `frust::gpu`, so no `wgpu` edge here (docs/PLUGINS_CODE_STANDARDS.md).
gpu-effects = ["frust/gpu"]
