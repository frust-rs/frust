# `frust-beui`: the beUI design-system catalog plugin — the tier's second
# external-origin design system (ported from beUI v2, not authored here;
# upstream is MIT-licensed, © 2026 Saurabh Chauhan; the vendored licence text is
# LICENSE-beui.md beside this manifest, and the attribution record lives in the
# crate root's docs).
# Production deps are the frust facade plus kurbo/peniko for the geometry/color
# vocabulary its widgets paint with, the same pins frust-widgets carries and the
# same shape frust-glyph/frust-material/frust-cupertino/frust-shadcn carry;
# frust-widgets and frust-core are dev-dependencies only (the sanctioned
# test-fixture/RenderRoot route, shipping nothing).
[package]
name = "frust-beui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
frust = { path = "../../crates/frust", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }
# Optional, off by default, and reachable only through the `gpu-effects`
# feature below: the 3D substrate implements the facade's `ExternalPass`, whose
# `record` is handed the frame's own `wgpu::Device`/`Queue`/`CommandEncoder`,
# and builds its own render pipeline over them. The facade re-exports the GPU
# *types* but not `wgpu` itself, so a caller driving a render pass beside the
# engine names `wgpu` in its own right — the shape `crates/frust/src/lib.rs`'s
# `gpu` module documents. `cargo tree -p frust-beui -e normal` on a default
# build still resolves to frust + kurbo + peniko alone, which is the plugin
# charter line this crate is held to (docs/PLUGINS_CODE_STANDARDS.md).
wgpu = { workspace = true, optional = true }

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", features = ["test-support"] }
# Test-only: the catalog's paint/event tests drive a real `RenderRoot` (which
# the facade does not re-export), and `test-support` turns on the
# `PaintCtx::for_test` clock seam — the same dev-dependency shape every other
# design-system plugin carries.
frust-core = { path = "../../crates/frust-core", features = ["test-support"] }

[features]
default = []
# The GPU-effect substrate (`src/gpu_fx`): real perspective for the catalog's
# 3D component variants, rendered through the facade's GPU seam
# (`frust/gpu` -> `frust::gpu`) into an offscreen target the engine
# composites. Deliberately NOT default — a default build carries no `wgpu`
# edge, no `gpu_fx` module and no behaviour change whatsoever, and every
# component that can use the substrate keeps its 2D path as the one it renders
# when the feature is absent or the GPU is unreachable at runtime.
gpu-effects = ["dep:wgpu", "frust/gpu"]
