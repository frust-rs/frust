[package]
name = "frust-haptics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Haptic feedback plugin for Frust apps: Android Vibrator and iOS feedback generators; a silent no-op on desktop."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Only `frust-*` dependency a platform plugin may carry (platform-plugin charter,
# docs/ARCHITECTURE.md). Unconditional: the crate is inert off Android.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.0" }

# `jni` directly: this crate's own JNI signature calls don't go through
# `frust-plugin`'s re-export alone.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS only, not `target_vendor = "apple"`: the `UI*FeedbackGenerator` classes are UIKit,
# absent on macOS, which shares the unavailable `desktop` backend below.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
# `UIFeedbackGenerator` (shared base class) is required alongside each per-class feature.
# `default-features = false` is not inherited (see `plugins/clipboard/Cargo.toml`).
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIFeedbackGenerator",
    "UISelectionFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UINotificationFeedbackGenerator",
] }
# Main-queue bounce for every generator call (`src/apple.rs`); features repeated, not
# inherited, for the same `default-features` reason as `objc2-ui-kit`.
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2",
] }

# Desktop: no dependency. Unlike `frust-clipboard`, there is no desktop haptics backend
# to link; `src/desktop.rs` is unavailable by design.
