# Standalone workspace, excluded from the root graph (root `[workspace] exclude`,
# docs/DEVELOPMENT.md) with its own Cargo.lock; deps are literal specs and the package
# fields duplicate the root's `[workspace.package]`.
[workspace]

[package]
name = "clean-signals-frust"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/frust-rs/frust"
homepage = "https://frust.dev"
readme = "README.md"
keywords = ["gui", "ui", "mobile", "declarative", "wgpu"]
categories = ["gui"]
description = "Frust integration for clean-signals: component-scoped controllers and failure listeners"

[dependencies]
# Lockstep: identical to the requirement at `examples/huddle` and
# `crates/frust-drive/templates/app/Cargo.toml.clean-signals.tmpl`, so one crate identity
# resolves (docs/DEVELOPMENT.md § Version-Pin Policy). Never enable `effects`.
clean-signals = "0.1"
# Facade package is `frust-ui` (lib name `frust`): https://github.com/lloydmeta/frunk/issues/258
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.0" }

# Headless tests drive `RenderRoot` directly. kurbo/peniko are pinned to Frust's
# rendering-stack versions so geometry/color types unify.
[dev-dependencies]
clean-signals = { version = "0.1", features = ["test-fixtures"] }
frust-core = { path = "../../crates/frust-core" }
frust-reactive = { path = "../../crates/frust-reactive" }
frust-scene = { path = "../../crates/frust-scene" }
frust-text = { path = "../../crates/frust-text" }
reactive_graph = "0.2"
kurbo = "0.13.1"
peniko = "0.6.1"
# Dev-only: `interval.rs`'s test needs a tokio runtime with the time driver; production
# code never spawns one.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
