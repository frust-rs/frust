[package]
name = "frust-shared-preferences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous typed key-value preferences for Frust apps: NSUserDefaults on Apple, SharedPreferences on Android, a JSON file on Linux and Windows."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Only `frust-*` dependency the Android backend needs for its platform handle
# (platform-plugin charter, `frust-plugin` crate doc).
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.0" }
# Second `frust-*` dependency, accepted by the amended platform-plugin charter
# (leaf substrate; docs/ARCHITECTURE.md).
frust-paths = { path = "../../crates/frust-paths", version = "0.6.0" }
thiserror = { workspace = true }
serde_json = { workspace = true }

# `jni` directly: this crate's own JNI signature calls don't go through
# `frust-plugin`'s re-export. Target-gated like `frust-plugin`'s own dep.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# `NSValue` gates `NSNumber` (`encoding`/`as_bool`/`as_i64`/`as_f64` are
# `cfg(feature = "NSValue")` in objc2-foundation 0.3.2); `std` must be explicit once
# `default-features = false`.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { workspace = true }
# Not `{ workspace = true }`: inheritance can't override `default-features`. Version
# hand-synced to the workspace `objc2-foundation` pin (docs/DEVELOPMENT.md § Version-Pin Policy).
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSUserDefaults",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSValue",
] }
