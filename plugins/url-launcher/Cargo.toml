[package]
name = "frust-url-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "URL launcher plugin for Frust apps: opens an http or https URL in the default external handler on Android, iOS, macOS, Linux and Windows."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Only `frust-*` dependency a platform plugin may carry (platform-plugin charter,
# docs/ARCHITECTURE.md). Unconditional: the crate is inert off Android.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }

# `jni` directly: this crate's own JNI signature calls don't go through
# `frust-plugin`'s re-export alone.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS only, not `target_vendor = "apple"`: `UIApplication` is UIKit, absent on macOS.
# macOS shares the `open` desktop backend below (`src/desktop.rs`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
# Full defaults: `objc2-ui-kit`'s `UIApplication` feature already enables the
# NSURL/NSDictionary/NSString sub-features, so narrowing gains nothing.
objc2-foundation = { workspace = true }
# `default-features = false` (inheritance can't set it; see `plugins/clipboard/Cargo.toml`).
# `UIResponder` is `UIApplication`'s superclass; `block2` gates
# `openURL:options:completionHandler:`.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIResponder",
    "UIApplication",
    "block2",
] }
# Main-queue bounce for `openURL` (`src/apple.rs`); features repeated, not inherited,
# for the same `default-features` reason as `objc2-ui-kit`.
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2",
] }

# `ShellExecuteW`, not `cmd /C start` (`src/desktop.rs`); no default features, like the
# workspace's other `windows-sys` consumers.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Desktop (macOS, Linux): no dependency; `std::process::Command` spawns `open`/`xdg-open`.
