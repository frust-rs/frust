# `frust-shadcn`: the shadcn/ui design-system catalog plugin — the tier's first
# external-origin design system (ported from shadcn/ui v4, not authored here;
# upstream is MIT-licensed, © 2023 shadcn — see LICENSE-shadcn-ui.md beside this
# manifest for the vendored license text).
# Production deps are the frust facade plus kurbo/peniko for the geometry/color
# vocabulary its widgets paint with, the same pins frust-widgets carries and the
# same shape frust-glyph/frust-material/frust-cupertino carry; frust-widgets and
# frust-core are dev-dependencies only (the sanctioned test-fixture/RenderRoot
# route, shipping nothing).
[package]
name = "frust-shadcn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "shadcn/ui design-system catalog for Frust: a port of shadcn/ui v4 with its token presets, overlay seam, widgets and bundled Inter and JetBrains Mono."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.5.1", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[features]
default = ["bundled-fonts"]
# Inter + JetBrains Mono, compiled in via `include_bytes!`. An app that ships
# its own fonts or is content with the platform's system sans can turn this
# off to drop the bundled bytes from its binary; `font_data()` returns an
# empty slice and `install()`/`native_typefaces()` register nothing, so the
# type scale's named families fall back to whatever fontique resolves for
# them. Default on: unchanged out-of-the-box behavior.
bundled-fonts = []

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.5.1", features = ["test-support"] }
# Test-only: the catalog's paint/event tests drive a real `RenderRoot` (which
# the facade does not re-export), and `test-support` turns on the
# `PaintCtx::for_test` clock seam — the same dev-dependency shape every other
# design-system plugin carries.
frust-core = { path = "../../crates/frust-core", version = "0.5.1", features = ["test-support"] }
