# Ported from shadcn/ui v4; upstream MIT, © 2023 shadcn. Vendored licence text:
# LICENSE-shadcn-ui.md.
[package]
name = "frust-shadcn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "shadcn/ui design-system catalog for Frust: a port of shadcn/ui v4 with its token presets, overlay seam, widgets and bundled Inter and JetBrains Mono."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.0", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[features]
default = ["bundled-fonts"]
# Inter + JetBrains Mono via `include_bytes!`; off drops them, `font_data()` is empty and
# the type scale falls back to fontique.
bundled-fonts = []

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.6.0", features = ["test-support"] }
# Test-only: paint/event tests drive a real `RenderRoot` (not re-exported by the facade);
# `test-support` enables the `PaintCtx::for_test` clock seam.
frust-core = { path = "../../crates/frust-core", version = "0.6.0", features = ["test-support"] }
