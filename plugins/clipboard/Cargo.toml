[package]
name = "frust-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous plain-text clipboard for Frust apps: Android ClipboardManager, iOS UIPasteboard, and macOS, Linux and Windows through arboard."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Only `frust-*` dependency a platform plugin may carry (platform-plugin charter,
# docs/ARCHITECTURE.md). Unconditional: the crate is inert off Android.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }

# `jni` directly: this crate's own JNI signature calls don't go through
# `frust-plugin`'s re-export alone.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS only, not `target_vendor = "apple"`: `UIPasteboard` is UIKit, absent on macOS,
# so an apple gate fails to link UIKit (`ld: framework 'UIKit' not found`) in a
# macOS preview build. macOS shares the arboard backend below.
[target.'cfg(target_os = "ios")'.dependencies]
# `AnyObject` is named directly, not left transitive (set_text_sensitive's NSDictionary values).
objc2 = { workspace = true }
# Not `{ workspace = true }`: inheritance can't override `default-features`, so the
# objc2 UIKit/Foundation pins repeat the workspace version with minimal features.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
    "NSArray",
    "NSDictionary",
    "NSValue",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIPasteboard",
] }

# macOS shares this arm: arboard's own backend drives `NSPasteboard`, so there is
# nothing macOS-specific to write.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
# `default-features = false` drops `image-data` (unused image/Gdi deps); pinned exact,
# see docs/DEVELOPMENT.md § Version-Pin Policy. After a bump also run the opt-in
# destructive test: `FRUST_CLIPBOARD_TESTS=1 cargo test -p frust-clipboard`.
arboard = { workspace = true }
