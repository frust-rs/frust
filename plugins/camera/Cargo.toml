[package]
name = "frust-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Camera plugin for Frust apps: permission, live preview, still capture, image and barcode streams on Android (CameraX) and iOS (AVFoundation)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# SwiftPM's build output under `platform/ios`: git ignores it, but cargo would
# package the dependency checkouts (each its own git repository) inside it.
exclude = [".build/"]

[dependencies]
thiserror = { workspace = true }
# Logs rather than prints — platform plugins never own stdout/stderr.
log = { workspace = true }

# Unconditional per the platform-plugin charter: no other `frust-*` dependency
# (`docs/CODE_STANDARDS.md` Plugin Conventions).
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.0" }

# Unconditional, unlike the FFI deps below: `barcode` decodes from a frame,
# never a camera backend, so it builds on every target (feature trim: root
# `Cargo.toml`). Named only inside `src/barcode/engine.rs`.
rqrr = { workspace = true }

# The plugin's own JNI exports and Rust->Kotlin calls need `jni` directly.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# Apple (iOS; macOS desktop preview shares this arm). objc2 crates repeat the
# workspace pin literally with `default-features = false`: Cargo forbids a member
# overriding `default-features` unless the root entry sets it, and none does.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
# `NSData`: requested here because `objc2-av-foundation` enables only `alloc`.
# `NSDictionary`/`NSValue`/`objc2-core-foundation`: `videoSettings`' pixel-format
# dictionary (CoreVideo `CFString` key; the toll-free bridge is behind that feature).
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSError",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSNotification",
    "NSValue",
    "objc2-core-foundation",
] }
# Direct dependency: the permission bridge must *construct* a block. Range
# matches what `objc2-av-foundation 0.3.2` requires (`>=0.6.1, <0.8.0`).
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Requires `objc2 >=0.6.2, <0.8.0` (0.7.x permitted). `block2` is required:
# `AVCaptureDevice` names `block2::DynBlock` without its own cfg gate.
# `dispatch2`/`objc2-core-*`/`objc2-quartz-core` switch on its gated methods.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCapturePhotoOutput",
    "AVCaptureVideoDataOutput",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "AVError",
    "bitflags",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
    "objc2-quartz-core",
] }
# `objc2-core-video`: `CMSampleBuffer::image_buffer()` is cfg-gated on it.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "objc2-core-video",
] }
# `CVReturn`: the plane lock/unlock pair is cfg-gated on it.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
# `CALayer` only — `AVCaptureVideoPreviewLayer` lives in `objc2-av-foundation`;
# `CAMediaTiming` matches that crate's own request for this one.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAMediaTiming",
] }
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2",
] }

[dev-dependencies]
# QR fixture synthesis for the desktop barcode tests — no binary image assets.
qrcode = { workspace = true }
