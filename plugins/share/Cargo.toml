[package]
name = "frust-share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Share plugin for Frust apps: opens the platform share sheet for text or a URL (Android chooser, iOS activity sheet, desktop clipboard fallback)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Geometry type of `ShareAnchor` (the iOS popover rect, used from sh-02 on).
kurbo = { workspace = true }
# Only `frust-*` dependency a platform plugin may carry (docs/ARCHITECTURE.md).
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.4" }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS only (UIKit is absent on macOS). Same rows as plugins/url-launcher/Cargo.toml.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
# Literal pin: only a non-workspace row may set `default-features = false`. `UIActivity`
# gates the init, `objc2-core-foundation` the CGRect members, `UIPopoverSupport` arrows,
# `block2` `presentViewController:animated:completion:`; the rest is the presenter walk.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIResponder",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "UIWindowScene",
    "UIView",
    "UIWindow",
    "UIViewController",
    "UIDevice",
    "UIActivity",
    "UIActivityViewController",
    "UIPresentationController",
    "UIPopoverPresentationController",
    "UIPopoverSupport",
] }
# Main-queue bounce (`src/apple.rs`); features repeated for the same `default-features` reason.
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }

# Plugin->plugin edge (docs/PLUGINS_CODE_STANDARDS.md): desktop has no share sheet,
# so the fallback is the clipboard and reimplementing that would duplicate arboard.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
frust-clipboard = { path = "../clipboard", version = "0.6.4" }
