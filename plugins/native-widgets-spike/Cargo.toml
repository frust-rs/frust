# THROWAWAY — native-widgets Phase 0 spike crate (PLAN.md Phase 0, spikes 1/3/4b
# Android arm + spike 2 iOS arm). Never merged as-is; exists to prove the
# round-trip/perf/input mechanisms on device. Standalone (own [workspace]) so it
# stays out of the root workspace's verify gates, exactly like the excluded
# examples.
[package]
name = "frust-native-widgets-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
log = "0.4"
frust-plugin = { path = "../../crates/frust-plugin" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIView",
    "UIButton",
    "UIControl",
    "UILabel",
    "UIResponder",
] }
