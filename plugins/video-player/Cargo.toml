# Leaf platform plugin (`frust-plugin` + FFI crates only); the app-facing half sits behind the
# default-on `frust-api` feature. Each objc2 feature list below is annotated like plugins/camera.
[package]
name = "frust-video-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Video playback for Frust apps over Media3 ExoPlayer on Android and AVFoundation on iOS and macOS, hosted in a native platform view."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["frust-api"]
# `--no-default-features` is the charter-line gate: `cargo tree -p frust-video-player
# --no-default-features -e normal` must show no `frust` facade crate.
frust-api = ["dep:frust"]

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

# Android JNI substrate; the only `frust-*` dependency a platform plugin may have (see
# docs/CODE_STANDARDS.md Plugin Conventions).
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }

# Literal `path`, not `workspace = true`: the root `frust` entry sets no `default-features`, so a
# member cannot override it (same note in plugins/i18n/Cargo.toml).
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.5.2", default-features = false, optional = true }

# Direct `jni` for the plugin's own exports and Rust->Kotlin player calls.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS and macOS share one AVPlayer backend; only the view differs (`ios_view.rs`/`macos_view.rs`).
# objc2 crates repeat the pin literally with explicit features: the workspace entries set no
# `default-features`, so inheritance cannot override it (see plugins/camera/Cargo.toml).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
# `NSGeometry` and `objc2-core-foundation` must both be on: `NSRect`/`NSPoint`/`NSSize` are
# exposed only with both (`CGFloat` lives in the latter).
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSError",
    "NSURL",
    "NSNotification",
    "NSValue",
    "NSDictionary",
    "NSArray",
    "NSKeyValueObserving",
    "NSGeometry",
    "objc2-core-foundation",
] }
# Direct dependency: `block2::RcBlock` is constructed (time observer, seek completion).
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2",
] }
# `AVPlayer` gates `playerLayerWithPlayer:`/`setPlayer:`; `AVAnimation` gates `videoGravity`
# and its statics. The `block2`/`dispatch2`/`objc2-*` features enable its gated methods.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "AVAnimation",
    "AVAsset",
    "AVMediaFormat",
    "AVError",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-quartz-core",
] }
# Direct: the session names `objc2_core_media` types (`CMTime`) itself.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
] }
# `CALayer` only; `AVPlayerLayer` itself lives in `objc2-av-foundation`.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAMediaTiming",
] }

# iOS only: the hosting `UIView` subclass and the audio-session category.
[target.'cfg(target_os = "ios")'.dependencies]
# `objc2-core-foundation` is a type gate: `initWithFrame:` takes a `CGRect` and `CGFloat` lives in
# that crate (plugins/native-widgets/Cargo.toml's row is the model).
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIView",
    "UIResponder",
    "UIColor",
    "objc2-core-foundation",
] }
# Both features required: `AVAudioSessionTypes` gates `setCategory:withOptions:error:`. iOS-only:
# macOS has no `AVAudioSession`.
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
] }

# macOS only: the hosting `NSView` subclass.
[target.'cfg(target_os = "macos")'.dependencies]
# `objc2-quartz-core` is a type gate: `NSView::layer`/`setLayer:` need it for `CALayer`. No
# `NSColor`: the view sets no background, so an uncovered letterbox shows what is beneath.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSView",
    "NSResponder",
    "objc2-quartz-core",
] }
