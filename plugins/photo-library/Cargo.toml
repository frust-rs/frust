[package]
name = "frust-photo-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Photo and video picker for Frust apps: the system photo picker on Android and iOS, a native file dialog on desktop, with picked media delivered as app-readable files."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# Library browsing (albums, paged assets, thumbnails). A code gate only: with it off every
# browsing call returns `PhotoError::FeatureDisabled`.
library = []
# Saving files into the photo library, and exporting an asset's original file. A code gate only:
# with it off `PhotoLibrary::save` returns `PhotoError::FeatureDisabled`. `export_original`
# needs `library` instead.
save = []
# Full-resolution native decode (`PhotoLibrary::decode_file`, and `decode_asset` together with
# `library`). A code gate only: with it off both calls return `PhotoError::FeatureDisabled`.
decode = []

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
frust-paths = { path = "../../crates/frust-paths", version = "0.6.6" }

# Plugin->plugin edge (docs/PLUGINS_CODE_STANDARDS.md): the desktop picker is the native file
# dialog, and folder scans reuse its `FolderGrant` on mobile too. The desktop cfg list is
# `frust-file-dialogs`' own; target-gated so wasm never sees the edge.
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
frust-file-dialogs = { path = "../file-dialogs", version = "0.6.6" }

# `jni` for the plugin's own JNI export; `frust-plugin` (the only other `frust-*` dependency a
# platform plugin may have, docs/PLUGINS_CODE_STANDARDS.md) for `with_jni_env`. Android-only.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.6" }

# iOS arm: PHPicker, item-provider file copies and the main-queue bounce. Literals narrow the
# feature lists of the root rows (only a non-workspace row may set `default-features = false`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSArray",
    "NSError",
    "NSItemProvider",
    "NSFileManager",
    "NSProgress",
    # `mainBundle` and `objectForInfoDictionaryKey:` for the usage-description precheck.
    "NSBundle",
    # The change feed: a persistent change token archived to bytes and back, the change details'
    # identifier sets, and the cloud-identifier mapping dictionary.
    "NSData",
    "NSCoder",
    "NSKeyedArchiver",
    "NSSet",
    "NSEnumerator",
    "NSDictionary",
] }
# Presenter walk (same set as plugins/share); `block2` for `presentViewController:animated:completion:`.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIResponder",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "UIWindowScene",
    "UIView",
    "UIWindow",
    "UIViewController",
    "UIPresentationController",
    # `UIImage::CGImage` is gated on the `objc2-core-graphics` feature, not on `UIImage`.
    "UIImage",
    "objc2-core-graphics",
] }
# PhotosUI binds the PHPicker configuration, filter and result types; the iOS view controller
# (`PHPickerViewController`) is macOS-only in these bindings and is declared by hand in `apple.rs`.
objc2-photos-ui = { version = "0.3", default-features = false, features = ["std", "PHPicker"] }
objc2-photos = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "PHObject",
    "PhotosTypes",
    "PHPhotoLibrary",
    "PHAsset",
    "PHFetchOptions",
    "PHFetchResult",
    "PHCollection",
    "PHImageManager",
    "PHAssetResource",
    "PHAssetResourceManager",
    "PHAssetCreationRequest",
    "PHAssetChangeRequest",
    "PHAssetCollectionChangeRequest",
    # The change feed (iOS 16+ persistent changes) and the cloud-identifier mapping (iOS 15+).
    "PHPersistentChange",
    "PHPersistentChangeFetchResult",
    "PHPersistentChangeToken",
    "PHPersistentObjectChangeDetails",
    "PHCloudIdentifier",
] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }

# Shared by the iOS arm and the ImageIO decoder (iOS and macOS): a bitmap context draws a CGImage
# into straight-alpha RGBA8, and Core Foundation carries the ImageIO options and properties.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { workspace = true }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
    "CGImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFURL",
] }
