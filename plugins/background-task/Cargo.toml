[package]
name = "frust-background-task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Background-work plugin for Frust apps: backs frust::BackgroundTask with an Android short foreground service, so a short write survives the app leaving the screen."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Implements the `BackgroundTaskBackend` seam; a leaf crate, unlike the `frust` facade.
frust-reactive = { path = "../../crates/frust-reactive", version = "0.6.5" }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.5" }
jni = { workspace = true }
