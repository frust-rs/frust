[package]
name = "frust-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous local SQL database for Frust apps, backed by SQLite (default) or the optional turso engine."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Sole `frust-*` dependency (data-dir only); no `frust-plugin`, since both engines reach
# SQLite storage directly (`lib.rs` charter).
frust-paths = { path = "../../crates/frust-paths", version = "0.5.2" }
log = { workspace = true }
# Default engine (`engine-sqlite`); optional so `--no-default-features` is engine-free.
rusqlite = { workspace = true, optional = true }
# Non-default (`engine-turso`): roughly doubles this crate's binary contribution, so an
# app opts in.
turso = { workspace = true, optional = true }
# `rt` only: one current-thread runtime for turso's bridge. Deliberately not
# `rt-multi-thread`/`time`/`net`; `frust-reactive` owns the real runtime.
tokio = { workspace = true, optional = true, features = ["rt"] }

[features]
default = ["engine-sqlite"]
engine-sqlite = ["dep:rusqlite"]
# Strictly additive: with both engines on, `OpenOptions::engine` picks per handle.
engine-turso = ["dep:turso", "dep:tokio"]
# Compiles `src/conformance.rs` outside `cfg(test)` too; off by default.
conformance = []
