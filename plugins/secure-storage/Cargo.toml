[package]
name = "frust-secure-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Secure key-value storage for Frust apps: Keychain on Apple, Keystore on Android, the keyring stack on Linux and Windows, with an optional biometric gate."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }

# Platform-FFI deps are target-gated like `frust-shared-preferences` (platform-plugin
# charter, docs/ARCHITECTURE.md).

# Not `{ workspace = true }`: inheritance can't override `default-features`, so the
# objc2 crates repeat the version literal, hand-synced to `[workspace.dependencies]`
# (docs/DEVELOPMENT.md § Version-Pin Policy).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
    "CFDictionary",
    "CFData",
    "CFError",
    "CFNumber",
] }
objc2-security = { version = "0.3", default-features = false, features = [
    "std",
    "SecBase",
    "SecItem",
    "SecAccessControl",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "LABase",
    "LABiometryType",
    "LAContext",
    "LAError",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
] }

# `frust-plugin` is the only `frust-*` dependency a platform plugin may carry; `jni`
# is named directly for this crate's own JNI signature calls.
[target.'cfg(target_os = "android")'.dependencies]
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }
jni = { workspace = true }

# Storage only: the biometric gate stays `NotAvailable` here. `keyring-core` is the
# shared API; each OS store is its own crate (Linux's is pure-Rust, no libdbus).
# macOS shares the apple arm above.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `rt-async-io-crypto-rust`: async-io runtime + pure-Rust crypto, so no tokio. Not
# `{ workspace = true }`: same `default-features` restriction as the Apple deps.
zbus-secret-service-keyring-store = { version = "1.0", default-features = false, features = [
    "rt-async-io-crypto-rust",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
