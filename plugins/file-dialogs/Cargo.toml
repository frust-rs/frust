[package]
name = "frust-file-dialogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native file dialogs, persistable folder access and file export for Frust apps on Linux, macOS, Windows, Android and iOS."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

# Desktop only: Android, iOS and wasm never compile rfd.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { workspace = true }

# `jni` for the plugin's own JNI export; `frust-plugin` (the only `frust-*` crate a platform
# plugin may reach, docs/PLUGINS_CODE_STANDARDS.md) for `with_jni_env`.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.5" }

# Literals narrow the feature lists of the root rows (only a non-workspace row may set
# `default-features = false`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSData",
    "NSArray",
    "NSError",
    "NSFileManager",
    # `URLsForDirectory:inDomains:` and `createDirectoryAtURL:...` for the app-private copies.
    "NSPathUtilities",
    "NSDictionary",
    "NSEnumerator",
    "NSDate",
    "NSValue",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-uniform-type-identifiers",
    "UIDocumentPickerViewController",
    "UIViewController",
    "UIPresentationController",
    "UIResponder",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "UIWindowScene",
    "UIWindow",
    "UIView",
] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
