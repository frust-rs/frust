[package]
name = "frust-cupertino"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cupertino (iOS-styled) design-system catalog for Frust: nav bar, tab bar, switch, alert dialog, action sheet, button and Liquid Glass recipe."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.0", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.6.0", features = ["test-support"] }
# Test-only: paint/event tests drive a real `RenderRoot`. No `test-support`: nothing here
# reads the `PaintCtx::for_test` clock seam.
frust-core = { path = "../../crates/frust-core", version = "0.6.0" }
