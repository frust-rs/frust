[package]
name = "frust-i18n-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compile-time Fluent message bundle loader proc macro for frust-i18n."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# Compile-time Fluent syntax check, so a malformed message fails the build.
fluent-syntax = { workspace = true }
# Validates locale directory names with the same parser `frust-i18n`'s `Locale` wraps.
unic-langid = { workspace = true }
