[package]
name = "frust-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fluent Project and ICU4X internationalization with compile-time bundle loading, system locale detection, and formatting."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
# Path dependency: a `proc-macro = true` crate cannot export ordinary items. Re-exported at the
# root as `frust_i18n::locales`.
frust-i18n-macros = { path = "macros", version = "0.6.0" }
# Direct dependency: `fluent-templates` is deliberately not used; this crate owns bundle
# construction and caching.
fluent-bundle = { workspace = true }
fluent-langneg = { workspace = true }
unic-langid = { workspace = true }

# Optional `frust-api` glue. Literal `path`, not `workspace = true`: the root `frust` entry sets no
# `default-features`, so a member cannot override it.
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.0", optional = true }

# Pin rationale in the root `Cargo.toml` (`icu_experimental` exact-pinned). Independent of
# `frust-api`.
icu_decimal = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
icu_plurals = { workspace = true, optional = true }
icu_experimental = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
tinystr = { workspace = true, optional = true }
# Named only for its `sync` feature: without it no ICU4X formatter is `Send + Sync`.
icu_provider = { workspace = true, optional = true }

[dev-dependencies]
# Dev-only: asserts the `locales!` macro diagnostics actually fail compilation.
trybuild = { workspace = true }
# Dev-only direct dependency: `frust` does not re-export the reactive internals the headless
# tests need (production code stays on `frust::{...}`).
frust-reactive = { workspace = true }

# `formatting` costs ~+1.09 MB of baked CLDR data (README.md §10); opt out with
# `default-features = false, features = ["frust-api"]`.
[features]
default = ["frust-api", "formatting"]
frust-api = ["dep:frust"]
formatting = [
    "dep:icu_decimal",
    "dep:icu_datetime",
    "dep:icu_plurals",
    "dep:icu_experimental",
    "dep:icu_locale_core",
    "dep:tinystr",
    "dep:icu_provider",
]

# Gated, unlike other plugins' unconditional `frust-plugin`: only `src/detect`'s Android backend
# needs the platform handle, so non-Android graphs stay free of it.
[target.'cfg(target_os = "android")'.dependencies]
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.0" }
jni = { workspace = true }

# `target_vendor = "apple"`, wider than UIKit-only arms: `NSLocale` is plain Foundation. Only iOS
# is expected to use it; macOS reads `sys-locale` via the desktop arm below.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSLocale",
    "NSObject",
    "NSString",
    "NSArray",
] }

# Desktop system-locale read; macOS routes through this arm (`sys-locale`), not the Apple one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sys-locale = { workspace = true }

