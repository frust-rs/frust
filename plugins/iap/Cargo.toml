[package]
name = "frust-iap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-app purchases for Frust apps over Android Play Billing and iOS StoreKit, using the OpenIAP 3.0.1 wire protocol."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# SwiftPM output under `platform/ios/FrustIap`: git ignores it, but cargo would package the
# nested dependency checkouts.
exclude = [".build/"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Android JNI substrate; the only `frust-*` dependency a platform plugin may have (see
# docs/CODE_STANDARDS.md Plugin Conventions). Unconditional: inert off Android.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.6.0" }
log = { workspace = true }

# Direct `jni` for the plugin's own JNI exports and `FrustIapHost` calls.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# `target_os = "ios"`, not `target_vendor = "apple"`: a JSON-string-only bridge onto the Swift
# glue in `platform/ios`, which owns all StoreKit access; there is no macOS arm.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
# `NSString`/`NSError` for the bridge; no StoreKit crate on purpose. Literal repeated: the
# workspace row sets no `default-features` (see plugins/secure-storage/Cargo.toml).
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
] }
# Constructs the Rust->Swift completion block. No `[workspace.dependencies]` row, so the
# `0.6` literal matches camera/haptics.
block2 = { version = "0.6", default-features = false, features = ["std"] }

# Desktop (macOS, Linux, Windows): deliberately no dependencies. Unlike haptics, desktop has
# store APIs (Mac App Store, Microsoft Store), so a backend is a buildable future addition;
# v1 defers it (mobile-first) and returns `NotAvailable(UnsupportedPlatform)` at `src/lib.rs`.
