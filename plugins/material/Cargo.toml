[package]
name = "frust-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not the workspace default: bundles Apache-2.0-only ported code and OFL-1.1 fonts, so no
# MIT-only arm is offerable. Third-party attributions: see NOTICE.
license = "Apache-2.0 AND OFL-1.1"
description = "Material 3 (Expressive) design-system catalog for Frust: HCT seed-color tokens, shape morphing, icons, widgets and bundled Roboto fonts."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.5.2", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }

[features]
default = ["bundled-fonts"]
# Roboto Flex + Roboto Mono via `include_bytes!`; off drops them, `font_data()` is empty
# and the type scale falls back to fontique.
bundled-fonts = []

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.5.2", features = ["test-support"] }
# `test-support` compiles `PaintCtx::for_test` so clock-dependent widgets paint at a
# chosen time without a `RenderRoot`.
frust-core = { path = "../../crates/frust-core", version = "0.5.2", features = ["test-support"] }
