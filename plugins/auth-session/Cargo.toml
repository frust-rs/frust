[package]
name = "frust-auth-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-app browser authentication sessions for Frust apps: Android Custom Tabs, Apple ASWebAuthenticationSession, and a desktop loopback listener."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# `gate/` holds browser fixture pages for the example app, not crate content.
exclude = ["gate"]

[dependencies]
thiserror = { workspace = true }
# Android JNI substrate; the only `frust-*` dependency a platform plugin may have (see
# docs/CODE_STANDARDS.md Plugin Conventions). Unconditional: inert off Android.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }

# Loopback opens the system browser via `frust-url-launcher`: a plugin-to-plugin edge,
# allowed because it is a platform plugin, not a framework crate. Android/iOS never link it.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
frust-url-launcher = { path = "../url-launcher", version = "0.5.2" }

# Depends on `jni` directly for the backend's own JNI exports, like the other Android plugins.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# `target_vendor = "apple"` rather than split by `target_os`: `ASWebAuthenticationSession`
# needs the same Objective-C object graph on iOS and macOS (only the anchor differs).
[target.'cfg(target_vendor = "apple")'.dependencies]
# Default features kept: nothing narrower is needed.
objc2 = { workspace = true }
# Types named explicitly so a future upstream feature narrowing fails here, not silently.
# Not `workspace = true`: the root row sets no `default-features`, so a member cannot override it.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSError",
    "NSSet",
    "NSEnumerator",
    "NSArray",
] }
# Builds the completion handler block. No `[workspace.dependencies]` row, so the literal repeats
# per crate (camera/iap/video-player do the same).
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Main-queue bounce for presenting/resolving the session. Features repeated, not inherited,
# for the same `default-features` reason as `objc2-foundation`.
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2",
] }
# Repeated literal, not `workspace = true`: same `default-features` restriction as
# `objc2-foundation`.
objc2-authentication-services = { version = "0.3", default-features = false, features = [
    "std",
    "ASWebAuthenticationSession",
    "ASFoundation",
    "block2",
] }

# iOS only: the `UIWindow`-backed presentation anchor (macOS anchors on `NSWindow` below).
[target.'cfg(target_os = "ios")'.dependencies]
# `UISceneDefinitions` is for `UIScene.activationState`: the backend prefers a foreground-active
# scene's key window, as a background-scene anchor yields PresentationContextInvalid.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIResponder",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "UIWindowScene",
    "UIView",
    "UIWindow",
] }

# macOS only: the `NSWindow`-backed presentation anchor, mirroring the iOS `objc2-ui-kit` edge.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSApplication",
    "NSWindow",
] }
