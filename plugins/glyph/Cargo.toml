[package]
name = "frust-glyph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "Glyph design-system catalog for Frust: a terminal-native, dark-first, monospace-led widget set with bundled Space Mono and IBM Plex Mono fonts."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "../../crates/frust", version = "0.6.7", default-features = false }
kurbo = { workspace = true }
peniko = { workspace = true }
# `chat` feature only. Markdown parsing for the chat family (MIT, MSRV 1.71.1); no HTML renderer
# and no `getopts` binary dependency, so only the parser is compiled (tables and strikethrough are
# runtime `Options` flags, not cargo features).
pulldown-cmark = { version = "0.13.6", default-features = false, optional = true }
# `chat` feature only. Line diffing for the chat diff view (Apache-2.0, MSRV 1.71); the
# `unified_diff` printer is left off, the view builds its own rows from the hunks.
imara-diff = { version = "0.2.0", default-features = false, optional = true }
# `chat` feature only. The chat components read a monotonic clock; `std::time::Instant::now()`
# panics on wasm32, so they take `web_time::Instant` (the workspace route, as frust-text does).
web-time = { workspace = true, optional = true }

[features]
default = ["bundled-fonts"]
# Space Mono + IBM Plex Mono via `include_bytes!`; off drops them, `font_data()` is empty
# and the type scale falls back to fontique.
bundled-fonts = []
# The `chat` component family (`frust_glyph::chat`): markdown, code/diff blocks, tool calls,
# approvals, composer. Off by default so the base catalog compiles neither parser.
chat = ["dep:pulldown-cmark", "dep:imara-diff", "dep:web-time"]

[dev-dependencies]
frust-widgets = { path = "../../crates/frust-widgets", version = "0.6.7", features = ["test-support"] }
# Test-only: paint/event tests drive a real `RenderRoot` (not re-exported by the facade);
# `test-support` enables the `PaintCtx::for_test` clock seam.
frust-core = { path = "../../crates/frust-core", version = "0.6.7", features = ["test-support"] }
# Test-only: the back tests drive the framework's process-wide back-press counter and
# `handles_back` flag directly (the facade does not re-export them).
frust-reactive = { path = "../../crates/frust-reactive", version = "0.6.7" }
