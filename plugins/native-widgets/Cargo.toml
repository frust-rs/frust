# `frust-native-widgets`: native controls from pure Rust — Android (`jni`),
# iOS (`objc2-ui-kit`) and macOS (`objc2-app-kit`, desktop Mode-A host; no
# Mac Catalyst). Leaf platform plugin (`docs/CODE_STANDARDS.md` Plugin
# Conventions): `frust-plugin` + FFI crates only, never another framework crate.
[package]
name = "frust-native-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Real native controls (Android Views, UIKit, AppKit) for Frust apps, written from pure Rust and hosted as platform views."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Exports/backends log rather than print — platform plugins never own
# stdout/stderr the way `frust-drive` does.
log = { workspace = true }

# The `frust-api` facade glue — all optional and gated by that feature so
# `--no-default-features` keeps the charter line (none of these reach the graph).
# `frust-core` beside `frust`: the builders hand-implement `View<Outer>`, whose
# signatures need `BuildCtx`/`ChangeFlags`. Plugins name `frust-core` directly
# rather than `frust::authoring` — a sanctioned, permanent exemption from the
# app-tier facade-first rule (`docs/CODE_STANDARDS.md` Plugin Conventions).
frust = { workspace = true, optional = true }
frust-core = { workspace = true, optional = true }
# `ClipToSlot` hand-implements `Widget::layout`, which returns a bare `kurbo::Size`.
kurbo = { workspace = true, optional = true }
# Theme ladder L3's `NativeTypefaces`/`FontFace`, named directly so they stay
# reachable independently of the facade's re-export list.
frust-theme = { workspace = true, optional = true }

# Unconditional per the platform-plugin charter; inert (`NotInitialized`) off
# Android, so it is not target-gated.
frust-plugin = { path = "../../crates/frust-plugin", version = "0.5.2" }

# The plugin's own JNI exports and the registry's `Global<JObject>` need `jni` directly.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# iOS only — NOT `target_vendor = "apple"`: this arm is UIKit, which does not
# exist on macOS (AppKit arm below); gating on the vendor makes a macOS build
# fail to link (`ld: framework 'UIKit' not found`).
# objc2-family crates repeat the workspace pin literally with
# `default-features = false`: Cargo forbids a member overriding
# `default-features` unless the root entry sets it, and none does. `objc2`
# keeps its (lighter) defaults like every other plugin's Apple arm.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
# Features this crate names in its own source are requested explicitly even
# when `objc2-ui-kit` enables them transitively. There is NO `NSDateComponents`
# feature — that class is generated under `NSCalendar`.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSData",
    "NSDate",
    "NSCalendar",
    "NSLocale",
    "NSArray",
    "NSSet",
    "NSEnumerator",
    "NSNotification",
] }
# Non-obvious gates: `objc2-core-foundation` is a type gate (`CGFloat`, needed
# by every `CGFloat`-taking constructor); `UIInterface` gates
# `overrideUserInterfaceStyle`; `objc2-core-text` gates the `UIFont`<->`CTFont`
# toll-free bridge; `UIBarItem` gates every `UITabBarItem` member and the
# `UITabBarDelegate` method; `UIDevice` tells iPad from iPhone (an unanchored
# action sheet crashes on iPad); `block2` gates every block-taking member;
# `NSLayoutAnchor`/`NSLayoutConstraint`/`UILayoutGuide` gate the sheet arm's
# Auto Layout. `UITabBar*` is iOS-only (`crate::controls::IOS_ONLY_KINDS`).
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIView",
    "UIButton",
    "UIControl",
    "UILabel",
    "UIResponder",
    "UISwitch",
    "UISlider",
    "UIProgressView",
    "UIImage",
    "UIImageView",
    "UIActivityIndicatorView",
    "UISegmentedControl",
    "UIStepper",
    "UIDatePicker",
    "UITabBar",
    "UITabBarItem",
    "UIBarItem",
    "UITabBarAppearance",
    "UIBarAppearance",
    "UIColor",
    "UIFont",
    "UIAccessibility",
    "UIInterface",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "UIWindowScene",
    "UIWindow",
    "UIViewController",
    "UIAlertController",
    "UIPresentationController",
    "UIPopoverPresentationController",
    "UISheetPresentationController",
    "UIStackView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "UILayoutGuide",
    "UIDevice",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-core-text",
] }
# Theme ladder L2 corner radius (`CALayer.setCornerRadius`, a `CGFloat`
# setter, hence `objc2-core-foundation`); a direct dependency, not transitive.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }
# Theme ladder L3: `CTFontManagerCreateFontDescriptorFromData` builds a
# descriptor from embedded font bytes (no system-wide registration).
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
] }
# `CFData::from_static_bytes`: wraps the `'static` font bytes with no copy.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFData",
] }
# Presentations must *construct* blocks (`block2::RcBlock`), not just name
# them. The root has no `block2` row, so every plugin repeats this literal.
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Main-thread hop for UIKit presentation calls. Repeated rather than inherited:
# the root `dispatch2 = "0.3"` row is a plain string and cannot narrow features.
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
] }

# macOS only: the AppKit arm, resolved by `crates/frust-shell-macos` through
# `frust_plugin::desktop::DesktopViewFactory`. Its own block, not a widened iOS
# gate: the arms share no UI framework. Same literal-pin rule as iOS above.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
# `NSGeometry` + `objc2-core-foundation` are type gates (`NSRect`/`CGFloat`);
# no `NSDateComponents` feature exists (see the iOS row).
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSData",
    "NSDate",
    "NSCalendar",
    "NSLocale",
    "NSGeometry",
    "NSArray",
    "NSEnumerator",
    "NSNotification",
    "objc2-core-foundation",
] }
# objc2-app-kit 0.3.2 gates by SUPERCLASS and by member, not by class name:
# `NSButton` alone needs `NSView`/`NSResponder`/`NSControl`; `NSButtonCell`/
# `NSCell` carry button type/bezel and `controlSize`. `NSAccessibilityProtocols`
# gates `setAccessibilityLabel:`; `objc2-core-foundation` is the `CGFloat` gate.
# `NSDatePickerCell` IS needed (style/mode enums); `NSStepperCell` is not.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSView",
    "NSResponder",
    "NSControl",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSTextField",
    "NSSwitch",
    "NSSlider",
    "NSSliderCell",
    "NSProgressIndicator",
    "NSSegmentedControl",
    "NSSegmentedCell",
    "NSStepper",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSImageView",
    "NSImageCell",
    "NSImage",
    "NSColor",
    "NSFont",
    "NSAppearance",
    "NSGraphics",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSWindow",
    "NSAlert",
    "NSPopover",
    "NSViewController",
    "block2",
    "objc2-quartz-core",
    "objc2-core-text",
    "objc2-core-foundation",
] }
# Theme ladder L2: `CALayer.backgroundColor` takes a `CGColor`.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
# Builds the `CGColor` directly (`CGColor::new_srgb`) rather than enabling
# `objc2-app-kit`'s `objc2-core-graphics` feature, which compiles in every
# CoreGraphics-gated AppKit member for one conversion.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColor",
] }
# Theme ladder L3 and presentations — identical to the iOS block's rows.
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFData",
] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
] }

[dev-dependencies]
# Host tests build/paint and shape widget trees directly; dev-only, so never
# counted against `--no-default-features`.
kurbo = { workspace = true }
peniko = { workspace = true }
frust-text = { workspace = true }
frust-scene = { workspace = true }

[features]
default = ["frust-api"]
# Default-on app-facing builders. `--no-default-features` is the charter-line
# gate (see the `[dependencies]` comment above `frust`/`frust-core`), checked
# with `cargo tree -p frust-native-widgets --no-default-features -e normal`.
frust-api = ["dep:frust", "dep:frust-core", "dep:frust-theme", "dep:kurbo"]
# The demo composite (`src/demo.rs`). Must stay NON-default: a demonstration,
# not product surface. Adds no dependency — it enables `frust-api`, so it never
# reaches the `--no-default-features` tree and the charter line holds.
demo-components = ["frust-api"]
