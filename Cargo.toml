[workspace]
resolver = "2"
# plugins/shared-preferences is an explicit member (the `crates/*` glob
# doesn't cover `plugins/`) — a platform plugin (frust-plugin + FFI crates
# only, no frust-* framework deps), unlike the excluded facade-tier
# plugins/clean-signals-frust below, which stays out of the root graph.
members = ["crates/*", "examples/*", "plugins/shared-preferences"]
# examples/huddle (renamed from its prior directory name, task 09) is the
# sole example (phase 8 examples-convergence: hello/counter/notes/gallery/navdemo/
# catalog/inbox were folded into it and deleted) — standalone (its own
# [workspace] root, own Cargo.lock) for two independent reasons: (1) its
# `clean-signals`/`clean-signals-forgekit` path deps point at a sibling
# `clean-signals-rs` checkout, which must never enter the root workspace
# graph (see docs/DEVELOPMENT.md's Version-Pin Policy); (2) its generated
# Android AND iOS projects (`frust run`/`build` install targets, gained in
# phase 8) need a project-local `target/` dir — the generated iOS Xcode
# build phase resolves `target/<triple>/<profile>/libhuddle.a` relative to
# the project directory, which a root-workspace member's shared `target/`
# would break (the same rationale the now-deleted `catalog` example carried).
# examples/bubblebench (the Flutter-Impeller-issue-#180958 bubble-physics
# benchmark port) is standalone for huddle's reason (2) alone: it is a full
# `frust create` scaffold whose generated Android/iOS projects need a
# project-local `target/` dir, and its generated Cargo.toml carries its own
# `[profile.*]` blocks, which only take effect in a workspace root.
# plugins/clean-signals-frust (Phase 4 facade-tier plugin) is a standalone
# excluded workspace like huddle: its `clean-signals` core dep is a sibling
# path dep that must never enter the root graph (see docs/DEVELOPMENT.md's
# Version-Pin Policy). Excluding a not-yet-migrated dir is harmless.
exclude = ["examples/huddle", "examples/bubblebench", "plugins/clean-signals-frust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# rendering stack — pins are LAW (vello 0.9 requires wgpu 29.0.3; do not bump independently)
#
# Feature trim (phase 7 task 15): the framework only ever drives vello
# through wgpu (no CPU-side vello-only build), so `default-features = false`
# + explicit `features = ["wgpu"]` drops vello's `wgpu_default` default
# feature, which otherwise pulls in plain `wgpu/default` below it. `wgpu`
# itself is trimmed to the backends Frust's three shells can actually
# reach: `wgsl` is vello's own shader frontend (its `wgpu` feature already
# requires it); `vulkan` + `metal` + `dx12` are the per-OS GPU backends,
# unioned additively across every target this workspace builds for (Android:
# vulkan; iOS/macOS: metal; Windows: dx12 — `std/parking_lot` are wgpu's own
# non-backend runtime plumbing, always needed). Deliberately dropped:
# `gles` (no shell ever surfaces a GLES-only device — vello requires compute
# shaders GLES can't provide, so a GLES fallback was never a real path; the
# `cpu-tier` `vello_cpu` feature is the documented CPU fallback story
# instead, see `docs/ARCHITECTURE.md`'s `RenderTier` row) and `webgpu` (wasm
# target only, Frust ships no wasm shell). See task 15's completion
# summary for the `cargo tree -e features` proof these two (and their naga
# frontends/backends) are absent from every target's dependency graph.
vello = { version = "0.9.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "29.0.3", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
] }
winit = "0.30.13"
parley = "0.11.0"
peniko = "0.6.1"
kurbo = "0.13.1"
tree_arena = "0.2.0"
pollster = "0.4"
# image decoding (frust-widgets' Image widget) — pinned exactly: 0.25.10 is
# the only 0.25.x release whose MSRV is exactly the workspace's (1.88), not
# lower (see workflow/plans/.../research/RESEARCH.md §Image); like the
# rendering-stack pins in docs/DEVELOPMENT.md's Version-Pin Policy, do not
# bump this independently without re-verifying the MSRV.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# frust-tui terminal UI (Phase 1) — ratatui 0.30 / crossterm 0.29, pinned to
# minor per the Version-Pin Policy (pre-1.0 ratatui churn). These pins are used
# ONLY by `frust-tui`, which is isolated from the framework render stack (it
# depends on `frust-drive`, never on `frust-core`/`vello`/`wgpu`). `insta` is a
# dev-only snapshot harness for the TUI's TestBackend render tests.
ratatui = "0.30"
crossterm = "0.29"
insta = "1"
# cli
clap = { version = "4.6", features = ["derive"] }
minijinja = "2.21"
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
ctrlc = "3"
# `frust run --watch`'s desktop rebuild-relaunch loop (PLAN.md Phase 9.D step
# 2) — file-watcher backing the loop's change-detection seam. Pinned to
# minor per the Version-Pin Policy; `frust-cli`-only (see its Cargo.toml
# comment for why this is a targeted exception, direct precedent: `ctrlc`
# above).
notify = "8"
log = "0.4"
# android shell (JNI bridge) — target-gated; land in Cargo.lock but only
# compile for `--target *-linux-android` (see frust-shell-android/Cargo.toml)
jni = "0.22"
ndk = "0.9"
ndk-sys = "0.6"
android_logger = "0.15"
# plugin platform-handle storage (frust-plugin, Design Decision 2) — the
# `(JavaVM, application Context)` slot the Android shell writes at
# `nativeInitPlatform` and plugins read via `frust-plugin::android`.
# Target-gated in every consumer (Android only), so it lands in Cargo.lock but
# only compiles for `--target *-linux-android`. Using ndk-context (not a
# private static) also lets third-party crates that read it work inside Frust
# apps for free. Pinned to minor per the Version-Pin Policy; the tripwire for a
# breaking bump is `cargo check --target aarch64-linux-android -p frust-plugin`.
ndk-context = "0.1"
# Apple ObjC runtime bridge for platform plugins — consumed by a later wave-1
# task's Apple backend (frust-plugin's Apple sibling work + the
# shared-preferences NSUserDefaults backend), NOT by anything today. The pins
# land here so this stays the only root-manifest edit of wave 1; being an
# unreferenced workspace dep, neither enters Cargo.lock until that task adds a
# consumer. Pinned to minor per the Version-Pin Policy; that later task adds
# the `cargo check --target aarch64-apple-ios-sim` tripwire.
objc2 = "0.6"
objc2-foundation = "0.3"
# android emulator detection (frust-render) — target-gated; already a
# transitive dep of wgpu-hal on Android, so promoting it to direct adds no
# new crates/size (see frust-render/Cargo.toml)
android_system_properties = "0.1"
# accessibility (frust-core's semantics seam, spec §9 / phase-6c D1) —
# core data crate ONLY (no accesskit_* platform adapters; those are phase 6d).
# Pinned to minor per the Version-Pin Policy (a pure-data, MSRV-compatible,
# Android-compiling vocabulary crate); do not float to a new minor without a
# fresh `cargo tree -d` / Android-compile check.
accesskit = "0.24"
# accessibility platform adapters (phase 6d D3) — each shell's seam onto its
# native a11y API, all unifying on the `accesskit = "0.24"` pin above
# (verified: accesskit_winit 0.33.2 needs accesskit ^0.24.1 + winit ^0.30.5 —
# we're on winit 0.30.13; accesskit_android 0.7.5 and accesskit_ios 0.1.2 both
# need accesskit ^0.24.1 too). Pinned to minor like the `accesskit` line
# above, except accesskit_ios which is pinned exact per PLAN.md D3 (its 0.1.x
# line is younger/less proven and never compiled on this host — see
# docs/DEVELOPMENT.md's Version-Pin Policy).
accesskit_winit = "0.33"
accesskit_android = "0.7"
accesskit_ios = "=0.1.2"
# experimental CPU render-tier fallback (phase 6d D4) — optional, feature-gated
# (`cpu-tier` on frust-render, NOT default), exact-pinned: pre-1.0 with an
# unstable API, isolated behind the encode adapter so a breaking bump never
# reaches the default GPU path.
vello_cpu = "=0.0.9"
# reactive stack (frust-reactive) — do not add reactive_graph's `effects`
# feature anywhere (see docs/DEVELOPMENT.md / phase-5.5 research doc)
reactive_graph = "0.2"
any_spawner = "0.3"
tokio = { version = "1", default-features = false }
# intra-workspace
frust-core = { path = "crates/frust-core" }
frust-scene = { path = "crates/frust-scene" }
frust-render = { path = "crates/frust-render" }
frust-text = { path = "crates/frust-text" }
frust-theme = { path = "crates/frust-theme" }
frust-widgets = { path = "crates/frust-widgets" }
frust-reactive = { path = "crates/frust-reactive" }
frust-plugin = { path = "crates/frust-plugin" }
frust-shell-desktop = { path = "crates/frust-shell-desktop" }
frust-shell-common = { path = "crates/frust-shell-common" }
frust-shell-android = { path = "crates/frust-shell-android" }
frust-shell-ios = { path = "crates/frust-shell-ios" }
frust = { path = "crates/frust" }

# `[profile.dev]` per-package overrides for the render/shader-compile stack
# (6e Finding 5 / 6e-fix-1 task 03): vello/wgpu/naga's shader-pipeline
# translation runs at `opt-level = 0` by default, which is slow enough on a
# physical iOS device that the OS SIGKILLs a debug `frust run` before the
# synchronous, main-thread launch-time shader compile finishes. The app's own
# code stays at the default dev opt-level (fast incremental rebuilds) — only
# these dependencies are bumped. `docs/spec.md` §12.9 documents
# `opt-level = 1` for deps generally; `opt-level = 2` is used here for the
# shader-compile-heavy crates specifically, since 1 measurably helps but a
# thin margin isn't enough headroom against the 6e repro's SIGKILL, and 2's
# extra shader-compile speed only costs incremental-build time on these few
# packages, not the whole dependency graph (`opt-level = 3`'s further gain
# over 2 is marginal for straight-line shader-translation code and not worth
# its added compile-time cost). This is frust's own workspace dev
# workflow (building/testing the crates in this workspace directly); the
# same override lands in `templates/app/Cargo.toml.tmpl` (every generated
# app) and `examples/huddle/Cargo.toml` (the 6e repro vehicle, formerly
# the now-deleted `catalog` example, before phase 8's examples-convergence).
[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dep opt widening (phase 7 task 11): non-workspace-member dependencies
# build at `opt-level = 1` in debug (Cargo's `"*"` package selector excludes
# workspace members and the profile's own package — verified against Cargo's
# profile-override docs); every crate/example in this workspace stays at the
# fast default dev opt-level, and the named shader-stack overrides above
# (opt-level 2) still win over this wildcard since a named package override
# takes precedence over `"*"`. Targets emulator/debug first-frame cost —
# parley/swash/image/kurbo compiled at `opt-level = 0` are part of that cost.
# Hand-synced across `templates/app/Cargo.toml.tmpl` and `examples/huddle/
# Cargo.toml` (phase 8's examples-convergence dropped the other two
# manifests this used to be hand-synced against — the now-deleted `catalog`
# and `inbox` examples' own `Cargo.toml`s — along with the examples
# themselves).
[profile.dev.package."*"]
opt-level = 1

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution (spec §12.2). Previously absent here — examples built
# from the root workspace (`hello`/`counter`/`notes`/`gallery`/`navdemo`)
# silently fell back to Cargo's own release defaults (no LTO, cgu=16,
# opt-level 3, no strip/abort). `lto = "fat"` + `codegen-units = 1`
# (phase 7 task 11, measured 2026-07-18 against the now-deleted `catalog`
# example's release arm64-v8a `.so` via `scripts/size-report.sh` — see
# `workflow/plans/features/frust-phase-7-performance/research/BASELINE.md`):
# fat LTO + cgu=1 alone (opt-level 3, the default — no override needed) shrank the
# prior baseline (lto="thin", no cgu override) from 8.46MB to 7.52MB
# unstripped, an 11.1% win taken unconditionally. `opt-level` "s"/"z" were
# also measured, but only *with* a shader/render-stack (vello/wgpu*/naga)
# carve-out back to `opt-level = 3` — the config that would actually ship,
# since sacrificing encode-path CPU perf isn't acceptable — and under that
# carve-out "s" measured 7.36MB (-2.1% vs the 7.52MB opt-3 config) and "z"
# measured 7.28MB (-3.2%): neither clears the task's ">5% meaningfully wins"
# bar once the carve-out that protects render-path perf is in place, so
# `opt-level` stays at its default (3) and no carve-out is needed. This
# block and the wildcard dev override above are hand-synced across
# `templates/app/Cargo.toml.tmpl` and `examples/huddle/Cargo.toml`
# (docs/DEVELOPMENT.md's Version-Pin Policy hand-sync rule; phase 8's
# examples-convergence dropped the other two manifests this used to be
# hand-synced against — the now-deleted `catalog` and `inbox` examples' own
# `Cargo.toml`s — along with the examples themselves).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
