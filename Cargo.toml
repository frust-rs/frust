[workspace]
resolver = "3"
# Members are `crates/*`, `examples/*` and the explicitly listed `plugins/*` crates: no glob reaches
# `plugins/` (or nested `plugins/i18n/macros`), and `benchmarks/` sits outside every member glob.
members = ["crates/*", "examples/*", "plugins/shared-preferences", "plugins/secure-storage", "plugins/camera", "plugins/native-widgets", "plugins/clipboard", "plugins/haptics", "plugins/url-launcher", "plugins/auth-session", "plugins/oauth-native", "plugins/iap", "plugins/database", "plugins/i18n", "plugins/i18n/macros", "plugins/video-player", "plugins/beui", "plugins/cupertino", "plugins/glyph", "plugins/material", "plugins/shadcn"]
# Standalone workspaces (gate each from its dir). huddle, plugins/clean-signals-frust: keep crates.io clean-signals
# out of the root graph (Version-Pin Policy). shadertoy, glyph-catalog, playground, material3-demo, native-widgets-demo:
# `frust create` scaffolds ([profile.*] needs a root). design-system-sample: facade-only build. web-*: wasm-only.
exclude = ["examples/huddle", "examples/shadertoy", "examples/web-spike", "examples/web-gallery", "examples/glyph-catalog", "examples/playground", "examples/design-system-sample", "examples/material3-demo", "examples/native-widgets-demo", "plugins/clean-signals-frust"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frust-rs/frust"
homepage = "https://frust.dev"
keywords = ["gui", "ui", "mobile", "declarative", "wgpu"]
categories = ["gui"]

[workspace.dependencies]
# wgpu 30.0.1 is LAW (Version-Pin Policy; row owned by docs/RENDER_DEVELOPMENT.md). Per-OS backends are
# added per target in crates/frust-gpu/Cargo.toml: never re-add vulkan/metal/dx12 here (re-unions them
# on every target). gles/webgpu/webgl are deliberately absent from native graphs (RENDER_DEVELOPMENT.md).
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
] }
winit = "0.30.13"
# Exact pin: the hot-patch spike's `dx` is 0.7.10 and runtime/builder must match (spike branch only; not a Version-Pin Policy row).
subsecond = "=0.7.10"

# --- Browser shell (wasm32-unknown-unknown) rows -------------------------------
# Exact pin: must equal the host `wasm-bindgen-cli` (0.2.128). wasm-bindgen-futures/js-sys/web-sys and
# frust-testing's exact `wasm-bindgen-test` move in lockstep with it (docs/SHELLS_DEVELOPMENT.md).
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
web-sys = "0.3.104"
# `std::time::Instant` panics on wasm32; `web-time` is the drop-in winit 0.30 itself uses.
web-time = "1.1.0"
# stderr is a silent no-op in a browser: these route `log` and panics to the JS console.
console_log = "1.0.0"
console_error_panic_hook = "0.1.7"
parley = "0.11.1"
peniko = "0.6.1"
kurbo = "0.13.1"
tree_arena = "0.2.0"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
# Exact pin: 0.25.10 is the only 0.25.x release whose MSRV is exactly the workspace's 1.88;
# re-verify the MSRV before any bump.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# frust-tui only (never the render stack); pinned to minor for pre-1.0 churn (docs/TUI_DEVELOPMENT.md).
ratatui = "0.30"
crossterm = "0.29"
# Tied to the ratatui 0.30 line (builds on `ratatui-core`); default simd/zero-copy features unused.
ansi-to-tui = { version = "8.0.1", default-features = false }
insta = "1"
toml_edit = "0.25"
# cli
clap = { version = "4.6", features = ["derive"] }
minijinja = "2.21"
include_dir = "0.7.4"
icns = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
ctrlc = "3"
notify = "8"
log = "0.4"
# Android-only rows (target-gated in every consumer): present in Cargo.lock on every host, which is
# expected, not drift.
jni = "0.22"
ndk = "0.9"
ndk-sys = "0.6"
# Default `regex` feature dropped: frust-shell-android never parses a filter spec.
android_logger = { version = "0.15", default-features = false }
# Render-thread priority self-boost in the Android/iOS shells (target-gated); deliberately unpinned 0.2.
libc = "0.2"
# Its gtk/libxdo defaults are Linux/BSD-gated upstream; frust-shell-linux must never depend on it.
muda = "0.19"
# 0.61 matches muda 0.19's `>=0.60, <=0.61` requirement. Declares NO features here: each consuming
# shell selects its own feature list in its own manifest.
windows-sys = "0.61"
ndk-context = "0.1"
# objc2* rows stay plain version strings (no `default-features`): Cargo only lets a member set
# `default-features = false` + its own minimal features when the workspace entry leaves it unset.
objc2 = "0.6"
objc2-foundation = "0.3"
# Unifies with arboard's 0.3.2. The 0.2.2 (accesskit_macos/winit) vs 0.3.2 duplicate is a known
# residual: do not try to fix it here (docs/DEVELOPMENT.md § Version-Pin Policy).
objc2-app-kit = "0.3"
android_system_properties = "0.1"
accesskit = "0.24"
accesskit_winit = "0.33"
accesskit_android = "0.7"
# Exact pin: the 0.1.x line is younger/less proven than the other adapters (Version-Pin Policy).
accesskit_ios = "=0.1.2"
# frust-engine's sparse-strip core, exact-pinned (pre-1.0): the only `vello_common`/`glifo` identities,
# guarded by crates/frust-testing/tests/dup_identities.rs.
vello_common = { version = "=0.2.0", default-features = false, features = ["std"] }
glifo = { version = "=0.3.0", default-features = false, features = ["std"] }
# Dev-only CPU oracle for frust-testing, on the same core as the engine (moves in lockstep with the two
# rows above). `u8_pipeline` is mandatory: vello_cpu 0.2.0 fails to compile without a pipeline, and u8 is
# what the engine rasterizes with. Keep `png`/`multithreading` off.
vello_cpu_oracle = { package = "vello_cpu", version = "=0.2.0", default-features = false, features = [
    "std",
    "text",
    "u8_pipeline",
] }
objc2-security = "0.3"
objc2-local-authentication = "0.3"
objc2-authentication-services = "0.3"
keyring-core = "1.0"
zbus-secret-service-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-quartz-core = "0.3"
dispatch2 = "0.3"
# Default `img`/`image` feature off: the exact-pinned `image` crate is not wanted here (the `LumaView`
# seam feeds greyscale directly). License `(MIT OR Apache-2.0) AND ISC`, compatible with the workspace.
rqrr = { version = "0.10.1", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
objc2-ui-kit = "0.3"
# Exact pin (young API surface); `wayland-data-control` deliberately off. In-process risk: frust-shell-desktop's
# `frust-clipboard` worker thread holds one long-lived instance while plugins/clipboard makes per-call ones;
# both alive at once is observed to crash arboard's macOS backend (frust-tui, a separate process, is unaffected).
arboard = { version = "=3.6.1", default-features = false }
# Exact pin: pre-1.0 API churn; the tripwire is frust-database's cross-engine conformance suite.
# `bundled` compiles SQLite from source, so no target needs a system libsqlite3.
rusqlite = { version = "=0.40.1", default-features = false, features = [
    "bundled",
] }
# Exact pin: a pre-1.0 rewrite whose API moves between minors (conformance suite, `--features engine-turso`).
# Default `mimalloc` (an allocator choice not ours to make) and `fts` (unused) stay off.
turso = { version = "=0.7.2", default-features = false }
# `fluent-templates` is deliberately not used: frust-i18n owns bundle construction/caching itself.
fluent-bundle = "0.16"
fluent-langneg = "0.13"
unic-langid = "0.9"
fluent-syntax = "0.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
trybuild = "1"
# ICU4X formatting (frust-i18n `formatting`): held on the 2.2.x line frust-text's shaping stack already
# resolves, so no duplicate ICU4X major enters (tripwire: `cargo tree -p frust-i18n --features formatting -d`).
icu_decimal = "2.2"
icu_datetime = "2.2"
icu_plurals = "2.2"
# Exact pin: an explicitly unstable pre-1.0 crate; 0.5.0 still resolves to the 2.2.x components
# above (0.6.0 would pull 2.3.x).
icu_experimental = "=0.5.0"
# Named directly (no component above re-exports it); 2.3 is the line already locked via icu_provider,
# so a 2.2 pin here would fork the graph.
icu_locale_core = "2.3"
# Needed to construct icu_experimental's `CurrencyCode`; already locked, adds no crate. Retires with
# icu_experimental.
tinystr = "0.8"
# Declared for its `sync` feature alone: `Arc` payloads make built formatters `Send + Sync` for
# frust-i18n's process-wide cache (unification reaches frust-text's ICU4X crates too).
icu_provider = { version = "2.3", default-features = false, features = ["sync"] }
# Exact pin: a small, young surface with no minor-version stability record.
sys-locale = "=0.3.2"
# reactive stack (frust-reactive) — do not add reactive_graph's `effects`
# feature anywhere (see docs/DEVELOPMENT.md's Version-Pin Policy)
reactive_graph = "0.2"
any_spawner = "0.3"
tokio = { version = "1", default-features = false }
# 2.2: 2.0.0 is the first release fixing the Streamable-HTTP session-table leak (GHSA-9pj6-vhgr-3mwh);
# 3.x is the sessionless protocol rewrite. The server binds loopback only (docs/CLI_ARCHITECTURE.md).
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "macros",
] }
axum = "0.8"
base64 = "0.22"
tokio-util = "0.7"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
percent-encoding = "2"
criterion = "0.8.2"
# `fork`/`timeout` stay off: every suite is pure-CPU or mutex-serialized, so they would only add
# rusty-fork/tempfile/wait-timeout to the lockfile.
proptest = { version = "1.11.0", default-features = false, features = [
    "std",
    "bit-set",
] }
# intra-workspace
frust-core = { path = "crates/frust-core", version = "0.6.0" }
frust-scene = { path = "crates/frust-scene", version = "0.6.0" }
frust-render = { path = "crates/frust-render", version = "0.6.0" }
frust-text = { path = "crates/frust-text", version = "0.6.0" }
frust-gpu = { path = "crates/frust-gpu", version = "0.6.0" }
frust-engine = { path = "crates/frust-engine", version = "0.6.0" }
frust-theme = { path = "crates/frust-theme", version = "0.6.0" }
frust-widgets = { path = "crates/frust-widgets", version = "0.6.0" }
frust-reactive = { path = "crates/frust-reactive", version = "0.6.0" }
frust-plugin = { path = "crates/frust-plugin", version = "0.6.0" }
frust-paths = { path = "crates/frust-paths", version = "0.6.0" }
frust-shell-desktop = { path = "crates/frust-shell-desktop", version = "0.6.0" }
frust-shell-common = { path = "crates/frust-shell-common", version = "0.6.0" }
frust-shell-android = { path = "crates/frust-shell-android", version = "0.6.0" }
frust-shell-ios = { path = "crates/frust-shell-ios", version = "0.6.0" }
frust-shell-macos = { path = "crates/frust-shell-macos", version = "0.6.0" }
frust-shell-windows = { path = "crates/frust-shell-windows", version = "0.6.0" }
frust-shell-linux = { path = "crates/frust-shell-linux", version = "0.6.0" }
frust-shell-web = { path = "crates/frust-shell-web", version = "0.6.0" }
# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
frust = { package = "frust-ui", path = "crates/frust", version = "0.6.0" }

# Shader-stack dev overrides: at opt-level 0 the synchronous launch-time shader compile is slow enough
# for iOS to SIGKILL a debug `frust run`; app code stays at the dev default. Hand-synced (with the
# wildcard below) across the five manifests crates/frust-cli/tests/profile_sync.rs lists.
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.vello_common]
opt-level = 2

[profile.dev.package.glifo]
opt-level = 2

[profile.dev.package.fearless_simd]
opt-level = 2

# Non-member dependencies build at opt-level 1 in debug (debug first-frame cost); workspace members
# keep the dev default, and the named shader-stack overrides above win over `"*"`.
[profile.dev.package."*"]
opt-level = 1

# Fat LTO + codegen-units = 1, global opt-level left at 3 (numbers: docs/PERFORMANCE_BASELINES.md "Release-profile
# hardening"). Hand-synced across the ten manifests crates/frust-cli/tests/profile_sync.rs lists.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# BEGIN release cold-set opt-level overrides (generated: keep hand-synced)
# "z" only for crates cold on the per-frame path (numbers: docs/PERFORMANCE_BASELINES.md). Kept at 3 by design:
# frust-{engine,gpu,render,text}, harfrust, skrifa, read-fonts, zune-jpeg, parley, wgpu-{core,types,hal},
# tokio, accesskit*, jni. Hand-synced across the nine manifests crates/frust-cli/tests/profile_sync.rs lists.

[profile.release.package.naga]
opt-level = "z"

[profile.release.package.codespan-reporting]
opt-level = "z"

[profile.release.package.ash]
opt-level = "z"

[profile.release.package.gpu-allocator]
opt-level = "z"

[profile.release.package.serde_json]
opt-level = "z"

[profile.release.package.roxmltree]
opt-level = "z"

[profile.release.package.fontique]
opt-level = "z"

[profile.release.package.mio]
opt-level = "z"

[profile.release.package.image]
opt-level = "z"

[profile.release.package.png]
opt-level = "z"
# END release cold-set opt-level overrides
