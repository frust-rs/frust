[workspace]
resolver = "2"
# plugins/shared-preferences is an explicit member (the `crates/*` glob
# doesn't cover `plugins/`) — a platform plugin (frust-plugin + FFI crates
# only, no frust-* framework deps), unlike the excluded facade-tier
# plugins/clean-signals-frust below, which stays out of the root graph.
# plugins/i18n/macros is the tier's first nested crate (a proc-macro sibling
# of plugins/i18n, the `locales!` compile-time Fluent-bundle loader) — listed
# explicitly like every other `plugins/*` member above; no glob in this list
# reaches two directory levels deep.
members = ["crates/*", "examples/*", "plugins/shared-preferences", "plugins/secure-storage", "plugins/camera", "plugins/native-widgets", "plugins/clipboard", "plugins/haptics", "plugins/iap", "plugins/database", "plugins/i18n", "plugins/i18n/macros", "plugins/cupertino", "plugins/glyph", "plugins/material", "plugins/shadcn"]
# plugins/{cupertino,glyph,material,shadcn} are the design-system plugin tier
# (listed alphabetically): the three catalogs that used to live in-tree behind
# `frust-widgets` cargo features, plus `shadcn` — the tier's first
# external-origin catalog, ported rather than authored here. They are ordinary
# root-workspace members — a `--workspace` run builds and tests all four —
# because catalogs-out is now the only state there is: `frust` has no default
# features and no catalog feature to unify, so the standalone catalog-off
# compile guard this list used to carry (examples/no-catalogs) has nothing left
# to guard.
# examples/huddle (renamed from its prior directory name) is the
# sole example (examples-convergence: hello/counter/notes/gallery/navdemo/
# catalog/inbox were folded into it and deleted) — standalone (its own
# [workspace] root, own Cargo.lock) for two independent reasons: (1) its
# `clean-signals` dependency is git+rev-pinned to a repo outside this one,
# which must never enter the root workspace
# graph (see docs/DEVELOPMENT.md's Version-Pin Policy); (2) its generated
# Android AND iOS projects (`frust run`/`build` install targets) need a
# project-local `target/` dir — the generated iOS Xcode
# build phase resolves `target/<triple>/<profile>/libhuddle.a` relative to
# the project directory, which a root-workspace member's shared `target/`
# would break (the same rationale the now-deleted `catalog` example carried).
# examples/shadertoy (the shader showcase) is standalone for huddle's reason
# (2) alone: it is a full `frust create` scaffold whose generated Android/iOS
# projects need a project-local `target/` dir, and its generated Cargo.toml
# carries its own `[profile.*]` blocks, which only take effect in a
# workspace root.
# examples/glyph-catalog (the Glyph design-system catalog) is standalone for
# the same reason as shadertoy: a full `frust create` scaffold with its own
# project-local `target/` dir and hand-synced `[profile.*]` blocks (its
# generated Android/iOS projects need a project-local `target/`).
# examples/playground (the plugin/native-capability testing ground) is
# standalone for glyph-catalog's reason: a full `frust create` scaffold whose
# generated Android/iOS projects need a project-local `target/` dir, plus
# hand-synced `[profile.*]` blocks that only take effect in a workspace root.
# examples/design-system-sample (the out-of-tree design-system proof) is
# standalone for a historical reason plus a live one. Historically it had to
# be: its `frust` edge sets `default-features = false`, and as a root member
# that would have been feature-unified with plugins/native-widgets'
# legitimately catalogs-ON one, silently evaporating the proof. That hazard is
# gone (`frust` has no catalog features left to unify), but the exclusion
# stays on its own merits — the sample exists to prove a design system builds
# from OUTSIDE this workspace, against the facade alone, and a root member
# would prove nothing of the sort; it also keeps its own `target/`. Gate it
# from its own directory (see its README).
# examples/material3-demo (the Material 3 Expressive catalog gallery) is
# standalone for glyph-catalog's reason, arrived at later: it started as a
# root-workspace member while it was desktop-only, and became a full `frust
# create` scaffold once it had to run on Android and iOS devices — its
# generated projects need a project-local `target/` dir (the iOS Xcode build
# phase resolves `target/<triple>/<profile>/libmaterial3demo.a` relative to
# the project directory), and its `[profile.*]` blocks only take effect in a
# workspace root. Gate it from its own directory (see its README).
# plugins/clean-signals-frust (a facade-tier plugin) is a standalone
# excluded workspace like huddle: its `clean-signals` core dep is a sibling
# path dep that must never enter the root graph (see docs/DEVELOPMENT.md's
# Version-Pin Policy). Excluding a not-yet-migrated dir is harmless.
exclude = ["examples/huddle", "examples/shadertoy", "examples/glyph-catalog", "examples/playground", "examples/design-system-sample", "examples/material3-demo", "plugins/clean-signals-frust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# rendering stack — pins are LAW (do not bump independently)
#
# Feature trim: `wgpu` is trimmed to the backends Frust's three shells can
# actually reach: `wgsl` is the shader frontend `frust-engine`'s pipelines are
# written in; `vulkan` + `metal` + `dx12` are the per-OS GPU backends, unioned
# additively across every target this workspace builds for (Android: vulkan;
# iOS/macOS: metal; Windows: dx12 — `std/parking_lot` are wgpu's own
# non-backend runtime plumbing, always needed). Deliberately dropped: `gles`
# (no shell surfaces a GLES-only device today — the engine tier's own
# downlevel design already covers the WebGL2/GLES3.0 ceiling without a
# separate `gles` wgpu backend, see `docs/ARCHITECTURE.md`'s `RenderTier` row)
# and `webgpu` (wasm target only, Frust ships no wasm shell). Confirmed via
# `cargo tree -e features`: these two (and their naga frontends/backends) are
# absent from every target's dependency graph.
wgpu = { version = "29.0.3", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
] }
winit = "0.30.13"
parley = "0.11.0"
peniko = "0.6.1"
kurbo = "0.13.1"
tree_arena = "0.2.0"
pollster = "0.4"
# frust-gpu's plain-old-data GPU vertex/uniform types (`Pod`/`Zeroable`
# derives) — the engine plan's foundation crate above wgpu. `derive` is the
# only feature this workspace needs (no `extern_crate_alias`/`min_const_generics`
# opt-ins).
bytemuck = { version = "1.25", features = ["derive"] }
# image decoding (frust-widgets' Image widget) — pinned exactly: 0.25.10 is
# the only 0.25.x release whose MSRV is exactly the workspace's (1.88), not
# lower; like the rendering-stack pins in docs/DEVELOPMENT.md's Version-Pin
# Policy, do not bump this independently without re-verifying the MSRV.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# frust-tui terminal UI — ratatui 0.30 / crossterm 0.29, pinned to
# minor per the Version-Pin Policy (pre-1.0 ratatui churn). These pins are used
# ONLY by `frust-tui`, which is isolated from the framework render stack (it
# depends on `frust-drive`, never on `frust-core`/`frust-render`/`wgpu`). `insta` is a
# dev-only snapshot harness for the TUI's TestBackend render tests.
ratatui = "0.30"
crossterm = "0.29"
# ANSI-colored log parsing for the TUI session log view: converts a
# process's raw ANSI/SGR output into styled `ratatui::text::Text`. Pinned to a
# known-good release tied to the ratatui-0.30 line (it builds on `ratatui-core`,
# the same split-out core ratatui 0.30 re-exports); `cargo test -p frust-tui` is
# the tripwire, alongside the `ratatui`/`crossterm` pins above. Default features
# (`simd`/`zero-copy`) dropped — the owned `into_text()` path is all the log
# view uses, keeping the dependency graph lean.
ansi-to-tui = { version = "8.0.1", default-features = false }
insta = "1"
# Format-preserving TOML editing for `frust-tui`'s recent-projects store
# (`~/.config/frust/tui.toml`, the project switcher) — a document
# edit (not a deserialize-mutate-reserialize round trip) so a user's
# hand-added comments/keys in the file survive a save. Pinned to minor per
# the Version-Pin Policy (pre-1.0, alongside the ratatui/crossterm pins
# above); `cargo test -p frust-tui`/`-p frust-drive` is the tripwire. Shared by
# `frust-tui`'s recent-projects store and `frust-drive::plugin`'s idempotent
# Cargo.toml dependency inserts — the plain `toml = "1"` pin below (frust-cli's
# `frust.toml`/scaffold templates) needs no format preservation and stays
# untouched.
toml_edit = "0.25"
# cli
clap = { version = "4.6", features = ["derive"] }
minijinja = "2.21"
include_dir = "0.7.4"
# frust-drive's icon pipeline (`icons::generate_icns`) — PNG-to-.icns
# packing, the same crate `cargo-bundle` uses for the identical job. Pinned
# to minor per the Version-Pin Policy (pre-1.0); `cargo test -p frust-drive`
# is the tripwire. `frust-drive/Cargo.toml`'s own comment records the
# `default-features = false` + `pngio`-only feature trim (drops the default
# `jp2io` JPEG-2000 codec this PNG-only pipeline never needs).
icns = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
ctrlc = "3"
# `frust run --watch`'s desktop rebuild-relaunch loop — file-watcher backing
# the loop's change-detection seam. Pinned to
# minor per the Version-Pin Policy; `frust-cli`-only (see its Cargo.toml
# comment for why this is a targeted exception, direct precedent: `ctrlc`
# above).
notify = "8"
log = "0.4"
# android shell (JNI bridge) — target-gated; land in Cargo.lock but only
# compile for `--target *-linux-android` (see frust-shell-android/Cargo.toml)
jni = "0.22"
ndk = "0.9"
ndk-sys = "0.6"
android_logger = "0.15"
# Platform priority self-boost for the render-thread split:
# `frust-shell-android` calls `setpriority(THREAD_PRIORITY_DISPLAY)` and
# `frust-shell-ios` calls `pthread_set_qos_class_self_np(USER_INTERACTIVE)` at
# the top of their render loops. Target-gated in both shells (only compiles for
# `--target *-linux-android` / `*-apple-ios*`), so — like the JNI deps above —
# it lands in Cargo.lock but never builds on the host. Already resolved
# transitively (via ndk/wgpu-hal/objc2), so adding this edge bumps no version.
# Floats on 0.2 minor: a ubiquitous, stable platform-binding crate, no pin.
libc = "0.2"
# frust-shell-macos/-windows native menu-bar bindings — `muda` builds a
# native NSMenu/HMENU tree from `DesktopConfig::menu_spec`
# (`docs/ARCHITECTURE.md`'s SHELLS unit). Its own manifest gates its default
# `gtk`/`libxdo` features behind a Linux/BSD-only target table internally
# (verified against its published manifest), so declaring this pin adds no
# GTK dependency to the macOS/Windows resolution the two consuming shells
# actually target — `frust-shell-linux` deliberately never depends on it (see
# its own Cargo.toml). Pinned to minor per the Version-Pin Policy; the
# tripwire is `cargo tree -d` (no new duplicate beyond the pre-existing
# `objc2-app-kit` residual noted by the `objc2-app-kit` row below).
muda = "0.19"
# frust-shell-windows's native Win32 bindings (window/menu/shell
# integration). Pinned to the 0.61 minor: muda 0.19.3's own
# `windows-sys = ">=0.60, <=0.61"` requirement resolves to 0.61.2 (verified
# via a scratch `muda = "0.19"` dependency), matching the minor most of this
# lockfile's other `windows-sys` consumers (`tokio`, `ctrlc`, `mio`, …) are
# already on. No features declared at this workspace level — a consuming
# shell selects its own feature list (`frust-shell-windows/Cargo.toml`'s
# `Win32_UI_Shell`; a later task may extend that list in the SAME file
# without touching this one). Pinned to minor per the Version-Pin Policy.
windows-sys = "0.61"
# plugin platform-handle storage (frust-plugin) — the
# `(JavaVM, application Context)` slot the Android shell writes at
# `nativeInitPlatform` and plugins read via `frust-plugin::android`.
# Target-gated in every consumer (Android only), so it lands in Cargo.lock but
# only compiles for `--target *-linux-android`. Using ndk-context (not a
# private static) also lets third-party crates that read it work inside Frust
# apps for free. Pinned to minor per the Version-Pin Policy; the tripwire for a
# breaking bump is `cargo check --target aarch64-linux-android -p frust-plugin`.
ndk-context = "0.1"
# Apple ObjC runtime bridge for platform plugins — consumed by
# `frust-shared-preferences`'s NSUserDefaults backend, `frust-secure-storage`'s
# Keychain backend, and `frust-camera`'s AVFoundation backend, each via
# `{ workspace = true }`. Pinned to minor per the Version-Pin Policy; see
# `docs/DEVELOPMENT.md`'s Version-Pin Policy table for the full list of
# dependent mobile compile gates.
# Also consumed by `frust-haptics`'s iOS-only backend for `MainThreadMarker`/
# `MainThreadOnly` (constructing the three `UI*FeedbackGenerator` classes,
# `target_os = "ios"` — not `target_vendor = "apple"`, matching
# `frust-clipboard`'s own split); the tripwire for that arm is `cargo check
# --target aarch64-apple-ios -p frust-haptics`. No version change.
objc2 = "0.6"
objc2-foundation = "0.3"
# frust-shell-macos's native menu-bar host — `muda`'s macOS backend depends
# on this crate directly (`objc2-app-kit = "0.3.0"`, its manifest's exact
# requirement), and `frust-shell-macos/Cargo.toml` names it too, for the
# `NSApplication`/`NSMenu`/`NSWindow` calls a follow-on task adds. Same
# plain-version-string shape as `objc2`/`objc2-foundation` above. Pinned to
# minor per the Version-Pin Policy: this unifies with the pre-existing
# `arboard`-resolved `objc2-app-kit 0.3.2` already in this lockfile rather
# than adding a THIRD version — the lockfile's existing `objc2-app-kit 0.2.2`
# (via `accesskit_macos`/`winit`) vs `0.3.2` (via `arboard`) duplication is a
# known, pre-existing residual this pin does not widen (do not try to fix it
# here — see `docs/DEVELOPMENT.md`'s Version-Pin Policy). The tripwire is
# `cargo tree -d`: no NEW duplicate major/minor beyond that residual.
objc2-app-kit = "0.3"
# android emulator detection (frust-render) — target-gated; already a
# transitive dep of wgpu-hal on Android, so promoting it to direct adds no
# new crates/size (see frust-render/Cargo.toml)
android_system_properties = "0.1"
# accessibility (frust-core's semantics seam) —
# core data crate ONLY (no accesskit_* platform adapters; those ship as
# separate per-shell adapters below).
# Pinned to minor per the Version-Pin Policy (a pure-data, MSRV-compatible,
# Android-compiling vocabulary crate); do not float to a new minor without a
# fresh `cargo tree -d` / Android-compile check.
accesskit = "0.24"
# accessibility platform adapters — each shell's seam onto its
# native a11y API, all unifying on the `accesskit = "0.24"` pin above
# (verified: accesskit_winit 0.33.2 needs accesskit ^0.24.1 + winit ^0.30.5 —
# we're on winit 0.30.13; accesskit_android 0.7.5 and accesskit_ios 0.1.2 both
# need accesskit ^0.24.1 too). Pinned to minor like the `accesskit` line
# above, except accesskit_ios which is pinned exact (its 0.1.x
# line is younger/less proven and never compiled on this host — see
# docs/DEVELOPMENT.md's Version-Pin Policy).
accesskit_winit = "0.33"
accesskit_android = "0.7"
accesskit_ios = "=0.1.2"
# frust-engine's own sparse-strip core (`engine-tier` feature on
# frust-render), exact-pinned (pre-1.0 experimental), NOT default build. The
# only `vello_common`/`glifo` identity now — the legacy `vello_cpu =0.0.9`
# CPU-tier fallback pin (and its own `vello_common 0.0.9`/`glifo 0.1.1`
# identities) was retired alongside `frust-render`'s `cpu-tier` feature.
vello_common = { version = "=0.2.0", default-features = false, features = ["std"] }
glifo = { version = "=0.3.0", default-features = false, features = ["std"] }
# Dev-only oracle for `frust-testing`: the SAME engine core the engine
# tier is built on (vello_common 0.2.0 + glifo 0.3.0), rasterized on the CPU
# with no GPU in the loop, so a golden test compares the engine against its own
# reference implementation rather than against a different renderer's. Renamed
# (`vello_cpu_oracle`, package `vello_cpu`) from the era when the retired
# `cpu-tier` fallback's own `vello_cpu =0.0.9` row also lived here — the name
# stays even now that it is the sole `vello_cpu` identity, since every use
# site already spells it and `crates/frust-testing/tests/dup_identities.rs`
# is the guard that pins the single `vello_common`/`glifo` identity this
# pin resolves to.
# Exact-pinned like every other pre-1.0 render-stack row (docs/DEVELOPMENT.md's
# Version-Pin Policy). Feature trim: `std` + `text` (glyph runs) + exactly one
# rasterization pipeline. `u8_pipeline` is NOT optional decoration — vello_cpu
# 0.2.0 carries `compile_error!("vello_cpu must have at least one of the u8 or
# f32 pipelines enabled")`, so `default-features = false` without one of them
# does not build; u8 (not `f32_pipeline`) because it is the default the engine
# tier itself rasterizes with, and an oracle that used the f32 pipeline would
# differ from the engine in rounding rather than in geometry. Everything else
# the default set would drag in (`png`, and `multithreading`, which is not
# default but would make rasterization thread-count dependent) stays off.
vello_cpu_oracle = { package = "vello_cpu", version = "=0.2.0", default-features = false, features = [
    "std",
    "text",
    "u8_pipeline",
] }
# frust-secure-storage's Apple Keychain + LocalAuthentication bindings —
# same rationale/precedent as `objc2`/
# `objc2-foundation` above: plain version strings (no `default-features`
# set) so a member can pick its own minimal feature list and
# `default-features = false` without Cargo's workspace-inheritance
# restriction tripping (see `plugins/secure-storage/Cargo.toml`'s comment).
# Pinned to minor per the Version-Pin Policy, matching `objc2`/
# `objc2-foundation`'s existing rows; the tripwire is
# `cargo check --target aarch64-apple-ios-sim -p frust-secure-storage`
# (verified buildable against a scratch crate — objc2-security
# 0.3.2, objc2-local-authentication 0.3.2, both actively maintained).
objc2-security = "0.3"
objc2-local-authentication = "0.3"
# frust-secure-storage's desktop (Linux/Windows) secret-store backend —
# `keyring` 4.x's re-architecture fronts `keyring-core`
# + separate opt-in per-platform store crates.
# Linux's zbus-based secret-service store is pure Rust (no libdbus to
# vendor); Windows' wraps Credential Manager. Pinned to minor per the
# Version-Pin Policy; the tripwire is `cargo check -p frust-secure-storage`
# for `keyring-core` (every target) and a Linux/Windows host build for the
# platform-specific store crates (not available on this macOS host — see
# DEVELOPMENT.md's Test section note on that gate).
keyring-core = "1.0"
zbus-secret-service-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
# frust-camera's Apple AVFoundation bindings
# (see plugins/camera/Cargo.toml's comment): the same plain-version-string
# shape as `objc2`/`objc2-foundation` above (Cargo's workspace-dependency
# inheritance forbids a member from overriding `default-features` unless the
# workspace-level entry already sets it), so `plugins/camera/Cargo.toml`
# repeats each version literal with its own `default-features = false` +
# minimal feature list rather than inheriting. `objc2-av-foundation 0.3.2`
# requires `objc2 >=0.6.2, <0.8.0` (narrower than
# 0.3.0's `^0.6.0`, but do not write "requires objc2 ^0.6" anywhere; 0.7.x is
# permitted). `objc2-quartz-core` is pinned here for `CALayer` only —
# `AVCaptureVideoPreviewLayer` itself lives in `objc2-av-foundation`, not
# `objc2-quartz-core`.
# `dispatch2` backs the serial dispatch queue the video-data-output sample
# delegate runs on. Pinned to minor per the Version-Pin
# Policy; the tripwire is
# `cargo check --target aarch64-apple-ios-sim -p frust-camera`. Also
# consumed by `frust-haptics`'s iOS-only backend (the async main-queue bounce
# every `UI*FeedbackGenerator` call goes through — see
# `plugins/haptics/src/apple.rs`'s module doc); the tripwire for that arm is
# `cargo check --target aarch64-apple-ios -p frust-haptics`. No version
# change from either consumer.
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-quartz-core = "0.3"
dispatch2 = "0.3"
# frust-camera's QR barcode decode stack (`plugins/camera/src/barcode`) —
# platform-independent, unlike the AVFoundation pins above. `rqrr` is the
# sole v1 decode engine, reached only through the crate's own private engine
# seam (`barcode::engine`) so a future swap never touches the public API.
# `default-features = false` drops its default `img`/`image` feature (the
# `image` crate is version-pinned exactly elsewhere — see this file's
# `image` row above — and unneeded here: the crate's own `LumaView` seam
# feeds `rqrr::PreparedImage::prepare_from_greyscale` a stride-aware closure
# directly, never a packed `image::GrayImage`); with it off, `rqrr`'s own
# dependency graph is just `g2p` + `lru` (verified via `cargo tree -p
# frust-camera`), both pure Rust with no build script. License `(MIT OR
# Apache-2.0) AND ISC`, compatible with this workspace's `MIT OR Apache-2.0`.
rqrr = { version = "0.10.1", default-features = false }
# Dev-only QR fixture synthesis for `barcode`'s conformance tests
# (`plugins/camera/src/barcode/conformance.rs`) — encodes a payload into its
# module matrix so a test can scale/rotate/stride it into a synthetic luma
# buffer, with no binary image assets and no `image` crate dependency.
# `default-features = false` drops rendering-only features (`image`/`svg`/
# `pic`) this crate never uses (only `QrCode::to_colors()`/`width()`, the
# raw module matrix). 0.14.1 is the current pure-Rust release.
qrcode = { version = "0.14.1", default-features = false }
# frust-native-widgets's Apple control surface —
# `UIView`/`UIButton`/etc. bindings for the plugin's Rust-built native
# controls. Plain version string (no `default-features` set), matching
# `objc2`/`objc2-foundation`'s shape above, so the member crate can pick its
# own minimal feature list without Cargo's workspace-inheritance
# restriction tripping. Pinned to minor per the Version-Pin Policy; the
# tripwire is `cargo check --target aarch64-apple-ios-sim -p
# frust-native-widgets`. Also consumed by `frust-clipboard`'s iOS-only
# backend (`UIPasteboard`, `target_os = "ios"` — not `target_vendor =
# "apple"`, since UIKit doesn't exist on macOS); the tripwire for that arm is
# `cargo check --target aarch64-apple-ios -p frust-clipboard`. No version
# change from either consumer. Also consumed by `frust-haptics`'s iOS-only
# backend (the three `UI*FeedbackGenerator` classes, same `target_os = "ios"`
# split); the tripwire for that arm is `cargo check --target
# aarch64-apple-ios -p frust-haptics`. No version change from any consumer.
objc2-ui-kit = "0.3"
# frust-clipboard's desktop (macOS/Linux/Windows) text-clipboard backend —
# a sync, 1Password-maintained clipboard crate. `default-features = false`
# (set here, not just on the member) so `plugins/clipboard/Cargo.toml` can
# inherit it via `{ workspace = true }` without repeating the version
# literal — Cargo's workspace-dependency inheritance only forbids a member
# from *overriding* `default-features` when the workspace entry doesn't
# already set it explicitly (see `objc2-foundation`'s comment above for the
# case where it does), and here the default is already what this crate
# wants (arboard's default `image-data` feature pulls in `image`/
# `objc2-core-graphics`/`windows-sys` Gdi bindings this crate never uses).
# Pinned exact per the Version-Pin Policy (a young surface, no minor-version
# API-stability track record yet); MSRV 1.71, well under this workspace's
# 1.88 floor. `wl-clipboard-rs`'s native-Wayland `wayland-data-control`
# feature is deliberately NOT enabled (see `plugins/clipboard/src/desktop.rs`'s
# module doc) — the tripwire is `cargo check -p frust-clipboard`.
arboard = { version = "=3.6.1", default-features = false }
# frust-database's default (`engine-sqlite`) backend — rusqlite's `bundled`
# feature compiles SQLite 3.53.2 from source via `cc` rather than linking a
# system libsqlite3, so the crate builds identically across every host and
# mobile target this workspace targets, with no `pkg-config`/dev-package
# prerequisite. Exact-pinned per the Version-Pin Policy: a pre-1.0 public
# surface (`rusqlite`'s own `Connection`/`Statement` API still churns across
# minor releases), so a bump is a deliberate, reviewed step rather than a
# float. `default-features = false` drops rusqlite's own default `cache`
# (statement-cache) and `ffi-sqlite-wasm-rs` features, neither of which this
# crate's v1 API surface (no prepared-statement cache, no wasm shell) uses.
# The tripwire is this crate's own cross-engine conformance suite
# (`cargo test -p frust-database`), plus `cargo check -p frust-database
# --no-default-features` to confirm the engine-optional skeleton still
# compiles with this dependency off.
rusqlite = { version = "=0.40.1", default-features = false, features = [
    "bundled",
] }
# frust-database's non-default (`engine-turso`) backend — the Turso rewrite of
# SQLite, an async pure-Rust engine bridged onto that crate's synchronous API
# by a crate-owned current-thread runtime (see `plugins/database/src/turso.rs`).
# Exact-pinned per the Version-Pin Policy, and more strictly than most: this is
# a pre-1.0 ground-up rewrite whose public API still moves between minor
# releases, so a bump is a deliberate, reviewed step rather than a float. The
# backend uses only `Builder::new_local`/`connect`/`execute`/`query`/`Rows`
# — never turso's own `transaction()`/`prepare_cached`/`execute_batch`, which
# have no counterpart in the sqlite backend and would split the two engines'
# code paths (`frust-database`'s v1 surface has no statement cache, and drives
# transactions as plain SQL through the shared engine seam).
# `default-features = false` drops turso's own `mimalloc` (a bundled allocator
# this workspace does not want chosen for it) and `fts` (full-text search)
# defaults — together ~4 MB of binary, unused by this crate's v1 SQL surface;
# revisit the `fts` half only when an app actually needs FTS. The tripwire is
# this crate's own cross-engine conformance suite run against this engine
# (`cargo test -p frust-database --features engine-turso`), plus `cargo check
# -p frust-database` to confirm the default (sqlite-only) build stays clean.
turso = { version = "=0.7.2", default-features = false }
# frust-i18n's Fluent Project message-bundle engine (`plugins/i18n`) —
# parses/resolves `.ftl` message files per requested locale. A direct
# dependency: `fluent-templates` is deliberately NOT used (plan D6) — this
# crate owns bundle construction/caching itself rather than delegating to
# that crate's `Loader` abstraction. Pinned to minor per the Version-Pin
# Policy (a pre-1.0 public surface); the tripwire is `cargo test -p
# frust-i18n`.
fluent-bundle = "0.16"
# frust-i18n's locale negotiation (`fluent_langneg::negotiate_languages`),
# resolving a requested locale list against this crate's compiled-in
# available locales. Pinned to minor per the Version-Pin Policy.
fluent-langneg = "0.13"
# frust-i18n's/frust-i18n-macros' BCP-47 Unicode Language Identifier type —
# `frust_i18n::Locale` wraps `unic_langid::LanguageIdentifier`, and the
# macros crate's own `locales!` implementation validates each discovered
# locale-directory name against the same parser. Pinned to minor per the
# Version-Pin Policy.
unic-langid = "0.9"
# frust-i18n-macros' compile-time `.ftl` syntax check for the `locales!`
# macro — parses each discovered locale directory's Fluent files at macro
# expansion time so a malformed message fails the build, not runtime.
# Pinned to minor per the Version-Pin Policy, matching `fluent-bundle`
# above (same upstream `fluent-rs` repo, same pre-1.0 churn risk).
fluent-syntax = "0.12"
# frust-i18n-macros' minimal proc-macro toolchain (`locales!`) — no special
# version-pin rationale beyond "current major", unlike the exact/minor pins
# elsewhere in this list.
proc-macro2 = "1"
quote = "1"
syn = "2"
# frust-i18n's dev-only compile-fail harness for `locales!`'s diagnostics —
# the only way to assert that a malformed `.ftl` (or a non-BCP-47 locale
# directory, or a typo'd generated key) actually fails compilation with the
# message it promises. Dev-dependency of `frust-i18n` alone, so it never
# reaches a shipped dependency graph; "current major" like the proc-macro
# toolchain above.
trybuild = "1"
# frust-i18n's optional `formatting` feature (`icu_decimal`/`icu_datetime`/
# `icu_plurals`/`icu_experimental`) — ICU4X locale-aware number/date/plural
# formatting, layered underneath Fluent's own argument-substitution hooks.
# Pinned to the 2.2.x line this lockfile already resolves for
# `icu_collator`/`icu_locale`/`icu_normalizer`/`icu_properties`/
# `icu_segmenter` (pulled transitively by `frust-text`'s shaping stack), so
# no duplicate ICU4X major enters the graph — verified via a scratch
# resolve: `icu_experimental =0.5.0` itself requires exactly this 2.2.0 line
# for `icu_decimal`/`icu_datetime`/`icu_plurals`, so the unpinned `"2.2"`
# caret below on those three converges on the same versions rather than
# floating past them. The tripwire is `cargo tree -p frust-i18n --features
# formatting -d` (no duplicate icu_* majors) plus `cargo test -p
# frust-i18n --features formatting`.
icu_decimal = "2.2"
icu_datetime = "2.2"
icu_plurals = "2.2"
# Exact-pinned per the Version-Pin Policy: an explicitly experimental,
# pre-1.0 ICU4X crate (its own crate doc: "all code in this crate is
# unstable"). 0.5.0 is the release whose own dependency line still resolves
# to this workspace's already-present ICU4X 2.2.x components — 0.6.0 would
# pull 2.3.x instead, a duplicate-major risk against the icu_collator/
# icu_normalizer/icu_properties/icu_segmenter versions already resolved
# above.
icu_experimental = "=0.5.0"
# The locale type every ICU4X formatter's `*Preferences` bag is built from
# (`DecimalFormatterPreferences: From<&icu_locale_core::LanguageIdentifier>`),
# and `frust-i18n`'s `fmt::bridge` route out of `unic_langid`. None of the
# four ICU4X crates above re-exports it (they re-export only the `-u-nu`/
# `-u-ca`/`-u-hc` keyword enums), so a crate constructing a locale-aware
# formatter must name it directly. Already resolved in this lockfile at
# 2.3.0 via `icu_provider`, so declaring it changes no resolution; pinned to
# minor per the Version-Pin Policy, and to the SAME line the transitive
# resolve already picked — a 2.2 pin here would fork the graph. Tripwire:
# `cargo tree -p frust-i18n --features formatting -d`.
icu_locale_core = "2.3"
# `icu_experimental::dimension::currency::CurrencyCode` is a newtype over
# `tinystr::TinyAsciiStr<3>` with no string constructor of its own, so a
# caller building one has to name `tinystr`. Same shape as the row above:
# already in this lockfile at 0.8.4 through the whole ICU4X stack, so the
# declaration adds no crate and moves no version. Pinned to minor per the
# Version-Pin Policy; it retires together with `icu_experimental` when the
# currency component graduates. Tripwire: `cargo test -p frust-i18n
# --features formatting`.
tinystr = "0.8"
# Declared for ONE feature, not for its API: `icu_provider`'s `sync` swaps
# the `Rc` inside every ICU4X `DataPayload` for an `Arc`, which is what makes
# a built formatter `Send + Sync` and therefore cacheable in `frust-i18n`'s
# process-wide formatter cache (`src/fmt/bridge.rs`). None of the four
# components above exposes that switch, and no crate here names an
# `icu_provider` type. Feature unification means the swap reaches the ICU4X
# crates `frust-text`'s shaping stack pulls in as well — an `Arc` in place of
# an `Rc` on a data payload, no API change either way — and only in a build
# that compiles `frust-i18n`'s `formatting` feature at all. Same version line
# and same tripwire as the two rows above.
icu_provider = { version = "2.3", default-features = false, features = ["sync"] }
# frust-i18n's desktop (macOS/Linux/Windows) system-locale detection — see
# `plugins/i18n/Cargo.toml`'s own comment for how this arm and the Apple
# (`objc2`/`objc2-foundation`) arm above both reach macOS, and which one its
# real backend is expected to route through there. Exact-pinned per the
# Version-Pin Policy: a small, young surface with no minor-version
# API-stability track record yet.
sys-locale = "=0.3.2"
# reactive stack (frust-reactive) — do not add reactive_graph's `effects`
# feature anywhere (see docs/DEVELOPMENT.md's Version-Pin Policy)
reactive_graph = "0.2"
any_spawner = "0.3"
tokio = { version = "1", default-features = false }
# frust-mcp: rmcp Streamable-HTTP MCP server, bound to loopback only
# (docs/CLI_ARCHITECTURE.md's frust-mcp section). `default-features = false`
# trims rmcp's client/reqwest/auth/elicitation surface this tool-only server
# never uses; `server` + `transport-streamable-http-server` are the
# transport it runs; `macros` pulls in the `#[tool_router]`/`#[tool]`/
# `#[tool_handler]` attribute macros the crate's tools are built from.
# Pinned to the 1.7 minor per the Version-Pin Policy; the lockfile resolves
# 1.8.0. Tripwire: `cargo test -p frust-mcp`.
rmcp = { version = "1.7", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "macros",
] }
# frust-mcp's HTTP layer — the transport rmcp's `StreamableHttpService`
# nests into.
axum = "0.8"
# frust-mcp: binary-payload encoding (e.g. devtools screenshots, a later
# tool family) for MCP tool results.
base64 = "0.22"
# frust-mcp: the `CancellationToken` graceful-shutdown seam wired to ctrl-c.
tokio-util = "0.7"
# frust-engine's diagnostic microbenches (harness = false) — pinned to the
# current release (0.8.2); never a compile or test gate.
criterion = "0.8.2"
# Property/fuzz generator behind the scene/engine invariant suites
# (`frust-scene`'s `proptest_commands`, `frust-engine`'s `proptest_strips`,
# `frust-testing`'s `fuzz`) — pinned to the current release (1.11.0) per the
# Version-Pin Policy; the tripwire is those three test targets. `fork` and
# `timeout` are dropped from the default set: both exist to run each case in a
# forked child so a hang or an abort is survivable, and every suite here is
# either a pure-CPU call or a GPU render already serialized behind a mutex, so
# keeping them would add `rusty-fork`/`tempfile`/`wait-timeout` to the lockfile
# for machinery nothing uses. `std` (the `Config`/`TestRunner` host surface) and
# `bit-set` (the collection shrinker's own index set) are what the strategies
# actually need.
proptest = { version = "1.11.0", default-features = false, features = [
    "std",
    "bit-set",
] }
# intra-workspace
frust-core = { path = "crates/frust-core" }
frust-scene = { path = "crates/frust-scene" }
frust-render = { path = "crates/frust-render" }
frust-text = { path = "crates/frust-text" }
# The engine plan's foundation crate above wgpu, and the engine crate built on
# it. `crates/frust-engine` does not exist yet at this SHA (a later task adds
# it) — declaring the row ahead of the crate is harmless: Cargo only resolves
# a `[workspace.dependencies]` path when some member's manifest references it
# via `{ workspace = true }`, and none does yet.
frust-gpu = { path = "crates/frust-gpu" }
frust-engine = { path = "crates/frust-engine" }
# Neither edge carries `default-features = false` any more: both crates now
# declare no default features at all. `frust-theme` is pure token
# infrastructure (no design-language module, no bundled fonts) and
# `frust-widgets` is the baseline widget set plus the `authoring` toolkit —
# a design system, in-tree plugin or third-party, composes over both from its
# own crate.
frust-theme = { path = "crates/frust-theme" }
frust-widgets = { path = "crates/frust-widgets" }
frust-reactive = { path = "crates/frust-reactive" }
frust-plugin = { path = "crates/frust-plugin" }
frust-paths = { path = "crates/frust-paths" }
frust-shell-desktop = { path = "crates/frust-shell-desktop" }
frust-shell-common = { path = "crates/frust-shell-common" }
frust-shell-android = { path = "crates/frust-shell-android" }
frust-shell-ios = { path = "crates/frust-shell-ios" }
frust-shell-macos = { path = "crates/frust-shell-macos" }
frust-shell-windows = { path = "crates/frust-shell-windows" }
frust-shell-linux = { path = "crates/frust-shell-linux" }
frust = { path = "crates/frust" }

# `[profile.dev]` per-package overrides for the render/shader-compile stack:
# wgpu/naga's shader-pipeline
# translation runs at `opt-level = 0` by default, which is slow enough on a
# physical iOS device that the OS SIGKILLs a debug `frust run` before the
# synchronous, main-thread launch-time shader compile finishes. The app's own
# code stays at the default dev opt-level (fast incremental rebuilds) — only
# these dependencies are bumped. Workspace-wide dev builds otherwise default
# deps to `opt-level = 1` (see the wildcard override below); `opt-level = 2`
# is used here for the shader-compile-heavy crates specifically, since 1
# measurably helps but a thin margin isn't enough headroom against the
# SIGKILL, and 2's extra shader-compile speed only costs incremental-build
# time on these few packages, not the whole dependency graph (`opt-level =
# 3`'s further gain over 2 is marginal for straight-line shader-translation
# code and not worth its added compile-time cost). This is frust's own
# workspace dev workflow (building/testing the crates in this workspace
# directly); the same override lands in `templates/app/Cargo.toml.tmpl`
# (every generated app) and `examples/huddle/Cargo.toml`.
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.vello_common]
opt-level = 2

[profile.dev.package.glifo]
opt-level = 2

[profile.dev.package.fearless_simd]
opt-level = 2

# Debug dep opt widening: non-workspace-member dependencies
# build at `opt-level = 1` in debug (Cargo's `"*"` package selector excludes
# workspace members and the profile's own package — verified against Cargo's
# profile-override docs); every crate/example in this workspace stays at the
# fast default dev opt-level, and the named shader-stack overrides above
# (opt-level 2) still win over this wildcard since a named package override
# takes precedence over `"*"`. Targets emulator/debug first-frame cost —
# parley/swash/image/kurbo compiled at `opt-level = 0` are part of that cost.
# Hand-synced across `templates/app/Cargo.toml.tmpl` and `examples/huddle/
# Cargo.toml` (examples-convergence dropped the other two
# manifests this used to be hand-synced against — the now-deleted `catalog`
# and `inbox` examples' own `Cargo.toml`s — along with the examples
# themselves).
[profile.dev.package."*"]
opt-level = 1

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution. Previously absent here — examples built
# from the root workspace (`hello`/`counter`/`notes`/`gallery`/`navdemo`)
# silently fell back to Cargo's own release defaults (no LTO, cgu=16,
# opt-level 3, no strip/abort). `lto = "fat"` + `codegen-units = 1`
# (measured 2026-07-18 against the now-deleted `catalog`
# example's release arm64-v8a `.so` via `scripts/size-report.sh`):
# fat LTO + cgu=1 alone (opt-level 3, the default — no override needed) shrank the
# prior baseline (lto="thin", no cgu override) from 8.46MB to 7.52MB
# unstripped, an 11.1% win taken unconditionally. `opt-level` "s"/"z" were
# also measured, but only *with* a shader/render-stack (wgpu*/naga)
# carve-out back to `opt-level = 3` — the config that would actually ship,
# since sacrificing encode-path CPU perf isn't acceptable — and under that
# carve-out "s" measured 7.36MB (-2.1% vs the 7.52MB opt-3 config) and "z"
# measured 7.28MB (-3.2%): neither clears the >5% meaningfully-wins
# bar once the carve-out that protects render-path perf is in place, so
# `opt-level` stays at its default (3) and no carve-out is needed. This
# block and the wildcard dev override above are hand-synced across
# `templates/app/Cargo.toml.tmpl` and `examples/huddle/Cargo.toml`
# (docs/DEVELOPMENT.md's Version-Pin Policy hand-sync rule;
# examples-convergence dropped the other two manifests this used to be
# hand-synced against — the now-deleted `catalog` and `inbox` examples' own
# `Cargo.toml`s — along with the examples themselves).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
