[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
# examples/inbox is a standalone package (its own [workspace] root, own
# Cargo.lock) so its git+rev clean-signals dependency never enters the root
# workspace graph — `exclude` beats the `examples/*` members glob (see
# docs/DEVELOPMENT.md's Version-Pin Policy).
# examples/team-demo is likewise standalone (its own [workspace] root, own
# Cargo.lock) — a `forgekit create`-generated project embedded verbatim to
# gate the Android build pipeline end-to-end (see
# workflow/plans/features/team-demo-android).
# examples/catalog is likewise standalone (own [workspace] root, own
# Cargo.lock) — converted in phase 6e so `forgekit run`/`build` can install it
# on real devices: the generated iOS Xcode build phase resolves
# `target/<triple>/<profile>/libcatalog.a` relative to the project directory,
# which a root-workspace member's shared `target/` would break.
exclude = ["examples/inbox", "examples/team-demo", "examples/catalog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# rendering stack — pins are LAW (vello 0.9 requires wgpu 29.0.3; do not bump independently)
vello = "0.9.0"
wgpu = "29.0.3"
winit = "0.30.13"
parley = "0.11.0"
peniko = "0.6.1"
kurbo = "0.13.1"
tree_arena = "0.2.0"
pollster = "0.4"
# image decoding (forgekit-widgets' Image widget) — pinned exactly: 0.25.10 is
# the only 0.25.x release whose MSRV is exactly the workspace's (1.88), not
# lower (see workflow/plans/.../research/RESEARCH.md §Image); like the
# rendering-stack pins in docs/DEVELOPMENT.md's Version-Pin Policy, do not
# bump this independently without re-verifying the MSRV.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# cli
clap = { version = "4.6", features = ["derive"] }
minijinja = "2.21"
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
ctrlc = "3"
log = "0.4"
# android shell (JNI bridge) — target-gated; land in Cargo.lock but only
# compile for `--target *-linux-android` (see forgekit-shell-android/Cargo.toml)
jni = "0.22"
ndk = "0.9"
ndk-sys = "0.6"
android_logger = "0.15"
# android emulator detection (forgekit-render) — target-gated; already a
# transitive dep of wgpu-hal on Android, so promoting it to direct adds no
# new crates/size (see forgekit-render/Cargo.toml)
android_system_properties = "0.1"
# accessibility (forgekit-core's semantics seam, spec §9 / phase-6c D1) —
# core data crate ONLY (no accesskit_* platform adapters; those are phase 6d).
# Pinned to minor per the Version-Pin Policy (a pure-data, MSRV-compatible,
# Android-compiling vocabulary crate); do not float to a new minor without a
# fresh `cargo tree -d` / Android-compile check.
accesskit = "0.24"
# accessibility platform adapters (phase 6d D3) — each shell's seam onto its
# native a11y API, all unifying on the `accesskit = "0.24"` pin above
# (verified: accesskit_winit 0.33.2 needs accesskit ^0.24.1 + winit ^0.30.5 —
# we're on winit 0.30.13; accesskit_android 0.7.5 and accesskit_ios 0.1.2 both
# need accesskit ^0.24.1 too). Pinned to minor like the `accesskit` line
# above, except accesskit_ios which is pinned exact per PLAN.md D3 (its 0.1.x
# line is younger/less proven and never compiled on this host — see
# docs/DEVELOPMENT.md's Version-Pin Policy).
accesskit_winit = "0.33"
accesskit_android = "0.7"
accesskit_ios = "=0.1.2"
# experimental CPU render-tier fallback (phase 6d D4) — optional, feature-gated
# (`cpu-tier` on forgekit-render, NOT default), exact-pinned: pre-1.0 with an
# unstable API, isolated behind the encode adapter so a breaking bump never
# reaches the default GPU path.
vello_cpu = "=0.0.9"
# reactive stack (forgekit-reactive) — do not add reactive_graph's `effects`
# feature anywhere (see docs/DEVELOPMENT.md / phase-5.5 research doc)
reactive_graph = "0.2"
any_spawner = "0.3"
tokio = { version = "1", default-features = false }
# intra-workspace
forgekit-core = { path = "crates/forgekit-core" }
forgekit-scene = { path = "crates/forgekit-scene" }
forgekit-render = { path = "crates/forgekit-render" }
forgekit-text = { path = "crates/forgekit-text" }
forgekit-theme = { path = "crates/forgekit-theme" }
forgekit-widgets = { path = "crates/forgekit-widgets" }
forgekit-reactive = { path = "crates/forgekit-reactive" }
forgekit-shell-desktop = { path = "crates/forgekit-shell-desktop" }
forgekit-shell-common = { path = "crates/forgekit-shell-common" }
forgekit-shell-android = { path = "crates/forgekit-shell-android" }
forgekit-shell-ios = { path = "crates/forgekit-shell-ios" }
forgekit = { path = "crates/forgekit" }

# `[profile.dev]` per-package overrides for the render/shader-compile stack
# (6e Finding 5 / 6e-fix-1 task 03): vello/wgpu/naga's shader-pipeline
# translation runs at `opt-level = 0` by default, which is slow enough on a
# physical iOS device that the OS SIGKILLs a debug `forgekit run` before the
# synchronous, main-thread launch-time shader compile finishes. The app's own
# code stays at the default dev opt-level (fast incremental rebuilds) — only
# these dependencies are bumped. `docs/spec.md` §12.9 documents
# `opt-level = 1` for deps generally; `opt-level = 2` is used here for the
# shader-compile-heavy crates specifically, since 1 measurably helps but a
# thin margin isn't enough headroom against the 6e repro's SIGKILL, and 2's
# extra shader-compile speed only costs incremental-build time on these few
# packages, not the whole dependency graph (`opt-level = 3`'s further gain
# over 2 is marginal for straight-line shader-translation code and not worth
# its added compile-time cost). This is forgekit's own workspace dev
# workflow (`cargo run -p hello`, etc.); the same override lands in
# `templates/app/Cargo.toml.tmpl` (every generated app) and
# `examples/catalog/Cargo.toml` (the 6e repro vehicle).
[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dep opt widening (phase 7 task 11): non-workspace-member dependencies
# build at `opt-level = 1` in debug (Cargo's `"*"` package selector excludes
# workspace members and the profile's own package — verified against Cargo's
# profile-override docs); every crate/example in this workspace stays at the
# fast default dev opt-level, and the named shader-stack overrides above
# (opt-level 2) still win over this wildcard since a named package override
# takes precedence over `"*"`. Targets emulator/debug first-frame cost —
# parley/swash/image/kurbo compiled at `opt-level = 0` are part of that cost.
# Hand-synced across `templates/app/Cargo.toml.tmpl`, `examples/catalog/
# Cargo.toml`, `examples/team-demo/Cargo.toml`, and `examples/inbox/
# Cargo.toml` (the last two for consistency — neither has a shader-stack
# override list to keep in sync).
[profile.dev.package."*"]
opt-level = 1

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution (spec §12.2). Previously absent here — examples built
# from the root workspace (`hello`/`counter`/`notes`/`gallery`/`navdemo`)
# silently fell back to Cargo's own release defaults (no LTO, cgu=16,
# opt-level 3, no strip/abort). `lto = "fat"` + `codegen-units = 1`
# (phase 7 task 11, measured 2026-07-18 against `examples/catalog`'s release
# arm64-v8a `.so` via `scripts/size-report.sh` — see `workflow/plans/
# features/forgekit-phase-7-performance/research/BASELINE.md`): fat LTO +
# cgu=1 alone (opt-level 3, the default — no override needed) shrank the
# prior baseline (lto="thin", no cgu override) from 8.46MB to 7.52MB
# unstripped, an 11.1% win taken unconditionally. `opt-level` "s"/"z" were
# also measured, but only *with* a shader/render-stack (vello/wgpu*/naga)
# carve-out back to `opt-level = 3` — the config that would actually ship,
# since sacrificing encode-path CPU perf isn't acceptable — and under that
# carve-out "s" measured 7.36MB (-2.1% vs the 7.52MB opt-3 config) and "z"
# measured 7.28MB (-3.2%): neither clears the task's ">5% meaningfully wins"
# bar once the carve-out that protects render-path perf is in place, so
# `opt-level` stays at its default (3) and no carve-out is needed. This
# block and the wildcard dev override above are hand-synced across
# `templates/app/Cargo.toml.tmpl`, `examples/catalog/Cargo.toml`,
# `examples/team-demo/Cargo.toml`, and `examples/inbox/Cargo.toml`
# (docs/DEVELOPMENT.md's Version-Pin Policy hand-sync rule).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
