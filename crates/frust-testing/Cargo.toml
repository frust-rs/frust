[package]
name = "frust-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Dev-only test infrastructure: every consumer takes it as a [dev-dependencies] edge only
# (enforced by tests/deps.rs's guard), so it never ships in an app's graph.
publish = false

# The website's widget-preview generator: lives here because it needs only this crate's own API
# (frame recorder, `CpuOracle`, bundled fonts). Declared explicitly so the target is visible.
[[bin]]
name = "widget-snapshots"
path = "src/bin/widget-snapshots.rs"

[dependencies]
# The case registry `widget-snapshots` renders (dev-only, `publish = false`, no edge back). NORMAL,
# not dev: `src/snapshot.rs` exposes `Case`/`Variant` and a `[[bin]]` cannot see `[dev-dependencies]`.
frust-gallery = { path = "../../examples/gallery" }
# The only render input a golden case may record through (`corpus::unit`'s `SceneBuilder`-only rule).
frust-scene = { workspace = true }
# `fonts::register_test_fonts`: bundled faces only, never a host font (docs/TESTING.md's Deterministic Inputs).
frust-text = { workspace = true }
# Imported for the `FRUST_GOLDEN_EXPECT_ADAPTER`/`_BACKEND` names `oracle_engine` enforces: one
# operator contract across every GPU run, not a second spelling of the same strings.
frust-render = { workspace = true, features = [] }
# Backs `frame.rs`'s GPU-free widget-frame capture through a real retained widget tree.
frust-core = { workspace = true }
# `test-support` for the `Leaf`/`SwapLeaf`/`Probe` fixtures `corpus::widget` pins container geometry with.
frust-widgets = { workspace = true, features = ["test-support"] }
# `frame::pin_type_scale`: the theme is a deterministic golden input (docs/TESTING.md's Deterministic Inputs).
frust-theme = { workspace = true }
# Real catalog pages for `corpus::page`, by path (no plugin `workspace.dependencies` rows).
# `examples/material3-demo` is an excluded workspace, so it runs its own `tests/page_goldens.rs`.
frust-material = { path = "../../plugins/material" }
frust-cupertino = { path = "../../plugins/cupertino" }
frust-glyph = { path = "../../plugins/glyph" }
frust-shadcn = { path = "../../plugins/shadcn" }
kurbo = { workspace = true }
peniko = { workspace = true }
# Exact workspace pin (docs/DEVELOPMENT.md's Version-Pin Policy).
image = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
# The per-golden JSON metadata contract (`meta::GoldenMeta`, `diff::DiffReport`), written by `golden.rs`.
serde = { workspace = true }
serde_json = { workspace = true }
# The CPU oracle arm (`vello_cpu` 0.2.0, renamed at the workspace level). NORMAL, not dev: `CpuOracle`
# is public API. CPU-only, so it runs on a GPU-less machine.
vello_cpu_oracle = { workspace = true }
# `oracle_engine::EngineOracle`, the GPU arm (public API, so NORMAL). Allowed here: tests/pins_and_deps.rs's
# G7 rule forbids engine/GPU edges only from `frust-core`/`frust-widgets`/`frust`/`plugins/*`.
frust-engine = { workspace = true }
frust-gpu = { workspace = true }
# vello_cpu's own filter vocabulary for `corpus::filters`' CPU arm: the same `=0.2.0` identity the
# oracle and engine resolve (tests/dup_identities.rs guards against a third).
vello_common = { workspace = true }
# The engine seam is spelled in wgpu types; confined to `oracle_engine` internals, never public API
# (docs/CODE_STANDARDS.md's "Leaking `vello`/`wgpu` types outside `frust-render`").
wgpu = { workspace = true }
# Blocks on wgpu's adapter/device futures behind the sync `SceneRenderer`.
pollster = { workspace = true }
# `widget-snapshots`' CLI on the workspace clap pin; NORMAL because a `[[bin]]` cannot see dev-deps.
clap = { workspace = true }
# Exact pin to the 0.10.9 Cargo.lock already resolves transitively (no workspace row): a caret could fork
# a second identity. Bump only with whatever pulls it (docs/DEVELOPMENT.md's Version-Pin Policy).
sha2 = "=0.10.9"

[dev-dependencies]
toml = { workspace = true }

# Native-only: `proptest` reaches getrandom 0.3, which fails to compile on wasm32-unknown-unknown, and
# Cargo builds every dev-dep per target — so a browser run must name its `--test` targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# tests/fuzz.rs's cross-oracle differential (the generator lives in the test target, hence dev).
proptest = { workspace = true }

# --- Browser (wasm32-unknown-unknown) test harness -----------------------------
# Only for `tests/wasm_goldens.rs`/`tests/wasm_binary_invariants.rs`, both `cfg(all(target_arch = "wasm32", feature = "webgl"))`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Exact: paired with the root `wasm-bindgen = "=0.2.128"` pin and the installed wasm-bindgen-cli, whose
# test runner refuses a schema-hash mismatch. Bump all three together, never alone
# (docs/DEVELOPMENT.md's Version-Pin Policy).
wasm-bindgen-test = "=0.3.78"
# Takes the root's exact pin: one wasm-bindgen identity in the browser graph.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# Exactly the features the two targets use. The canvas is required (wasm32 GL enumerates no adapter
# without a canvas `compatible_surface`); `console` because `println!` is a no-op on wasm32.
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "Node",
    "Response",
    "Window",
] }

[features]
default = []
# Opts the two browser test targets in; inert natively. Adds NO wgpu backend: `crates/frust-gpu/Cargo.toml`'s
# wasm32 row is the single choke point for wasm backends, so the suite matches the shell's backend set.
webgl = []
