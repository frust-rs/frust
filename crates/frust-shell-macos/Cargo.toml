[package]
name = "frust-shell-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS desktop shell for Frust: native AppKit menu bar and platform integration on top of frust-shell-desktop."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# DesktopExtensions trait + winit core; unconditional since `frust-shell-desktop` compiles on every non-mobile host.
frust-shell-desktop = { workspace = true }
# `MacosExtensions::pump` reports menu activations via `push_menu_event`.
frust-reactive = { workspace = true }
# Names `ViewCommand` (payload of `on_platform_view_commands`); unconditional since the hook signature exists on every target.
frust-shell-common = { workspace = true }
# Desktop platform-view factory registry. The second shell -> `frust-plugin` edge (first: `frust-shell-android`); `frust-plugin`
# stays a leaf, so the edge only points this way. Not target-gated: the OS-neutral host logic is tested on every host
# against a fake factory (a `winit::Window` needs a live event loop).
frust-plugin = { workspace = true }
winit = { workspace = true }
kurbo = { workspace = true }
log = { workspace = true }

# AppKit half (`muda` menu bar, app-activation observer for Dock reopen) compiles only on macOS; elsewhere `MacosExtensions`
# still compiles (the `frust-shell-android` inert-off-target precedent).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
# `NSGeometry` + `objc2-core-foundation` gate `NSRect`/`NSPoint`/`NSSize`; both ride the default set today, spelled out so a
# future narrowing fails loudly here. Features are added to the workspace row (default-features may not be overridden).
objc2-foundation = { workspace = true, features = [
    "NSGeometry",
    "objc2-core-foundation",
] }
# Short explicit list, not the large default set: `NSApplication` (did-become-active; winit 0.30 has no reopen event), `NSResponder`,
# `NSView`, `NSGraphics` (`NSWindowOrderingMode`). `NSWindow` absent: the host uses winit's raw-window-handle `NSView`.
# Version literal repeated: Cargo forbids overriding a workspace dep's `default-features` unless the workspace sets it; keep in step with the root pin.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSGraphics",
] }

# docs.rs builds x86_64 Linux by default; a target-specific crate would document as empty.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
