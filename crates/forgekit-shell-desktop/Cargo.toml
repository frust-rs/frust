[package]
name = "forgekit-shell-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forgekit-core = { workspace = true }
forgekit-scene = { workspace = true }
forgekit-render = { workspace = true }
forgekit-text = { workspace = true }
forgekit-reactive = { workspace = true }
# Load-bearing: the shell owns the active Theme, boxes it into RenderRoot's
# type-erased slot, and re-pushes it on WindowEvent::ThemeChanged — see
# docs/ARCHITECTURE.md's Theme delivery.
forgekit-theme = { workspace = true }
# Load-bearing (task 6c-04): the app-facing theme override watcher
# (`ThemeOverrideWatcher`/`effective_brightness_for_platform_change`) this
# shell polls once per frame — see `forgekit_shell_common::theme_override`'s
# module docs.
forgekit-shell-common = { workspace = true }
winit = { workspace = true }
# Desktop accesskit adapter (phase 6d D3, wired in task 03) — winit
# event-loop integration for the semantics tree; compiles unconditionally
# like `winit` above (this crate is only ever included in the dependency
# graph for non-Android builds, via `forgekit`'s
# `cfg(not(target_os = "android"))` gate — see docs/ARCHITECTURE.md).
accesskit_winit = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
# Perf instrumentation (task 10): the desktop shell installs its own stderr
# `log::Log` sink (see `logger.rs`) so `forgekit-shell-common::perf`'s
# `log::info!` startup-span/frame-stats lines are actually visible — mirrors
# `forgekit-shell-ios`'s own `StderrLogger` (zero new transitive deps, `log`
# is already pulled in via `forgekit-shell-common`).
log = { workspace = true }
