[package]
name = "frust-shell-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The browser shell tier. Unlike the three per-OS desktop crates, this one does
# NOT depend on `frust-shell-desktop`: that crate's winit core is entangled with
# `accesskit_winit`, `pollster::block_on` surface bring-up, a render thread and
# `frust-paths` cache I/O, none of which exist on `wasm32-unknown-unknown`. The
# winit-GENERIC halves of it (input mapping, the reactive-owner event wrap, the
# window-metrics publish, brightness-follow) are ported here instead, so this
# crate sits directly on `frust-shell-common` the way the two mobile shells do.
# See docs/SHELLS_ARCHITECTURE.md for the unit's shape.
[dependencies]
# The retained tree this shell drives: `RenderRoot`, the `InputEvent`
# vocabulary every mapping below produces, `WindowInsets`, and the
# `WindowMetrics` context type.
frust-core = { workspace = true }
# The shell owns the active `Theme` and boxes it into `RenderRoot`'s
# type-erased slot, exactly as the other shells do — see
# docs/SHELLS_ARCHITECTURE.md's Theme delivery.
frust-theme = { workspace = true }
# The reactive root `Owner` the event pass and both app-facing
# `provide_context` publishes run under (`ReactiveRuntime::with_owner`). Its
# own `wasm32` arm (`Executor::init_wasm_bindgen`) is what makes this edge
# buildable for the browser at all — see that crate's `src/runtime.rs`.
frust-reactive = { workspace = true }
# The platform-free plumbing this shell is built on: `WindowMetricsPublisher`
# (the change-guarded window-shape publish), the app-facing theme override
# watcher, and the seeded-default theme slot.
frust-shell-common = { workspace = true }
# The event source. winit 0.30 carries a first-class web backend (canvas-hosted
# event loop, `requestAnimationFrame` redraws, `devicePixelRatio` scale factor,
# `prefers-color-scheme` theme reporting), so this shell shares the desktop
# tier's winit vocabulary rather than binding the DOM itself. Rides the single
# workspace `winit` pin — a second winit identity between the two shell tiers
# would be a resolution hazard, not a convenience.
winit = { workspace = true }
# `Point`, the logical-pixel pointer coordinate every mapping here produces.
kurbo = { workspace = true }
# The gap-reporting sink: the no-op seams below log at `debug` through the
# `log` facade rather than failing silently, so a browser console (once a
# `log` sink is installed) shows which host signal is unsupported.
log = { workspace = true }
# The frame path's payload and its consumer: the painted display list this
# shell builds each frame (`Scene`/`SceneBuilder`) and the GPU backend that
# encodes and presents it (`RenderContext`/`SurfaceRenderer` plus the
# `EncodeOutcome`/`AcquireOutcome`/`FrameOutcome` vocabulary the loop branches
# on). `frust-render` is buildable for `wasm32-unknown-unknown` through
# `frust-gpu`'s own target-gated `wgpu` row (`webgpu` + `webgl`); nothing is
# selected or overridden here — `frust-engine` is the only renderer this tier
# contains.
frust-scene = { workspace = true }
frust-render = { workspace = true }
# The shell-owned `TextContext` the layout pass shapes through, handed to
# `RenderRoot::layout_with_text` type-erased.
frust-text = { workspace = true }
# `Color`: the live theme's surface colour, which rides with each frame as the
# clear colour it was painted for.
peniko = { workspace = true }
# Every instant in this crate. `std::time::Instant::now()` PANICS on
# `wasm32-unknown-unknown` (no clock syscall on that target), and `web-time` is
# the drop-in winit 0.30 itself already uses internally — so on wasm this is
# `performance.now()` and on every other target it is a plain re-export of
# `std::time`, which is what lets the pacing arithmetic be unit-tested on the
# build host. Using anything else here would also mistype
# `ControlFlow::WaitUntil`, which winit declares over `web_time::Instant` on
# this target.
web-time = { workspace = true }

# Browser-only rows: reached exclusively by the `target_arch = "wasm32"` frame
# loop in `src/app_handler.rs` and the surface-bring-up retry in
# `src/render.rs`, so a native build of this crate resolves none of them and
# behaves identically with or without them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Not imported by a single `use` in this crate, and not removable either: it is
# the row that pins the *whole graph's* `wasm-bindgen` identity. The crate and
# the `wasm-bindgen-cli` that post-processes the build must carry the identical
# schema version — a stricter contract than semver, failing at glue-generation
# time rather than at `cargo check` — and this host's CLI is 0.2.128 while the
# version `winit`/`web-sys` resolve on their own is 0.2.127, which the CLI
# refuses. The workspace row is an exact `=0.2.128` for exactly that reason,
# and an exact pin only takes effect where something depends on it: this crate
# is the browser tier's only entry point, so it is where the pin is anchored.
# The three rows below then move to their lockstep partners (`js-sys`/`web-sys`
# 0.3.105, `wasm-bindgen-futures` 0.4.78 — each declares an exact
# `wasm-bindgen` requirement of its own, so this is forced, not chosen), which
# the workspace's caret rows already permit.
wasm-bindgen = { workspace = true }
# `spawn_local`: `SurfaceRenderer::on_surface_created` is `async` and a browser
# has no blocking executor to drive it with (the desktop shell's
# `pollster::block_on` is not an option on a thread that must not block), so
# surface bring-up runs on the browser's own microtask queue. Also supplies the
# `JsFuture` half of the bring-up retry's wait.
wasm-bindgen-futures = { workspace = true }
# One type, one reason: `js_sys::Promise`, the object a `setTimeout` callback
# resolves so the bring-up retry's wait is awaitable. There is no
# `std::thread::sleep` on this target and nothing else in the graph carries a
# timer future.
js-sys = { workspace = true }
# The two places this crate talks to the browser directly: `window.setTimeout`
# (the bring-up retry's wait, `src/render.rs`) and the hidden-input IME overlay
# (`src/ime.rs`), which winit has no seam for at all. The list names exactly
# what those two call and nothing else — winit still owns the canvas, the
# pointer/keyboard handlers and the animation-frame registration, and no
# `console` row appears here because logging goes through `src/logging.rs`.
#
# Features only: the `web-sys` VERSION is untouched, and it stays the same
# lockstep partner of the `=0.2.128` `wasm-bindgen` pin above that it already
# was (see that row's derivation). Rows are one-per-line and grouped by what
# needs them, since a bare alphabetical list says nothing about why any of
# them is here.
web-sys = { workspace = true, features = [
    # `window.setTimeout`, and `window.document()` for the overlay element.
    "Window",
    # Creating the overlay `<input>`, reaching `<body>` to host it, and the
    # `Node`/`Element`/`EventTarget`/`HtmlElement` ladder that append, attribute,
    # style, focus and remove calls hang off.
    "Document",
    "Node",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    # The element's inline geometry (`position: fixed`, and the caret box
    # written on every reposition).
    "CssStyleDeclaration",
    # The canvas: its viewport origin (`getBoundingClientRect`) converts the
    # widget's logical caret box into the overlay's CSS placement, and it is the
    # element winit's own keyboard listeners sit on, so it is also where the
    # overlay re-dispatches a keystroke it received.
    "HtmlCanvasElement",
    "DomRect",
    # The composition bridge itself: the base `Event` every listener takes, the
    # composition/`input` events carrying the marked and committed text, and the
    # keyboard event plus its init dictionary for that re-dispatch.
    "Event",
    "CompositionEvent",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
] }
# stderr is a silent no-op in a browser: `console_log` routes the `log` facade
# to `console.*` and `console_error_panic_hook` routes panics to
# `console.error` (the facade's `web_app!` bootstrap installs both; the shell's
# own `logging` module owns the sink's shape and level). Workspace rows.
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }
