[package]
name = "frust-shell-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not the workspace expression: `src/fonts.rs` embeds `fonts/InterVariable.ttf` (SIL OFL 1.1, `fonts/OFL.txt`).
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "Browser shell for Frust: runs a Frust app on a canvas in the browser via winit and WebAssembly."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Browser shell tier. Does NOT depend on `frust-shell-desktop`: its winit core is entangled with `accesskit_winit`, `pollster::block_on`,
# a render thread and `frust-paths` cache I/O, none of which exist on `wasm32-unknown-unknown`. Winit-generic halves are ported here, so this
# crate sits directly on `frust-shell-common` (docs/SHELLS_ARCHITECTURE.md).
[dependencies]
frust-core = { workspace = true }
frust-theme = { workspace = true }
# Reactive root `Owner` for the event pass and context publishes; its `wasm32` arm (`Executor::init_wasm_bindgen`) is what
# makes this buildable for the browser.
frust-reactive = { workspace = true }
frust-shell-common = { workspace = true }
# winit 0.30 has a first-class web backend, so this shell shares the desktop winit vocabulary. Rides the single workspace
# `winit` pin; a second winit identity between the shell tiers would be a resolution hazard.
winit = { workspace = true }
kurbo = { workspace = true }
# No-op seams log at `debug` through `log`, so a browser console shows which host signal is unsupported.
log = { workspace = true }
# `frust-render` builds for `wasm32-unknown-unknown` through `frust-gpu`'s target-gated `wgpu` row (`webgpu` + `webgl`);
# nothing is selected here: `frust-engine` is the only renderer this tier contains.
frust-scene = { workspace = true }
frust-render = { workspace = true }
frust-text = { workspace = true }
peniko = { workspace = true }
# Every instant in this crate: `std::time::Instant::now()` PANICS on `wasm32-unknown-unknown`; `web-time` is what winit 0.30
# uses, and it re-exports `std::time` elsewhere (so pacing is host-testable) and matches `ControlFlow::WaitUntil`'s type.
web-time = { workspace = true }

# Browser-only rows, reached solely by the `wasm32` frame loop (`src/app_handler.rs`) and bring-up retry (`src/render.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Imported by no `use`, yet not removable: it anchors the whole graph's `wasm-bindgen` identity, which must match `wasm-bindgen-cli` (0.2.128;
# winit/web-sys alone resolve 0.2.127). The exact workspace pin binds only where something depends on it. `js-sys`/`web-sys`/
# `wasm-bindgen-futures` are lockstep partners (each requires an exact `wasm-bindgen`).
wasm-bindgen = { workspace = true }
# `spawn_local`: surface bring-up is `async` and a browser has no blocking executor; also the `JsFuture` for the retry wait.
wasm-bindgen-futures = { workspace = true }
# `js_sys::Promise` for the `setTimeout`-based bring-up retry wait (no `std::thread::sleep` on this target).
js-sys = { workspace = true }
# Features cover exactly the two direct browser calls: `window.setTimeout` (`src/render.rs`) and the hidden-input IME overlay
# (`src/ime.rs`); winit owns the canvas and input handlers. No `console` row: logging goes through `src/logging.rs`.
# `web-sys` stays the lockstep partner of the `=0.2.128` `wasm-bindgen` pin above.
web-sys = { workspace = true, features = [
    # `Window`/`Document`/`Node` ladder: `setTimeout` and the overlay `<input>`.
    "Window",
    "Document",
    "Node",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    # Inline geometry for the overlay.
    "CssStyleDeclaration",
    # Canvas viewport origin maps the logical caret box to CSS; the overlay re-dispatches keystrokes onto it.
    "HtmlCanvasElement",
    "DomRect",
    # Composition bridge: events carrying marked/committed text, and the keyboard re-dispatch.
    "Event",
    "CompositionEvent",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    # Clipboard, DOM half: `paste`/`copy`/`cut` listeners; a copy/cut must write synchronously (Safari).
    "ClipboardEvent",
    "DataTransfer",
    # Clipboard, async half, for slots with no DOM event behind them (toolbar tap, app-driven copy).
    "Clipboard",
    "Navigator",
] }
# stderr is a no-op in a browser: `console_log` routes `log` to `console.*` and `console_error_panic_hook` routes panics to
# `console.error` (installed by the facade's `web_app!`; the `logging` module owns the sink's shape and level).
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }

# docs.rs builds x86_64 Linux by default; a target-specific crate would document as empty.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
