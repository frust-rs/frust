[package]
name = "frust-reactive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# reactive_graph has no default features, so no `features`/`default-features`
# needed here. Do NOT add the `effects` feature (see docs/DEVELOPMENT.md's
# Version-Pin Policy): the frame path is a custom subscriber, not `RenderEffect`.
reactive_graph = { workspace = true }
any_spawner = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
# Not yet a workspace dependency; pinned directly here for future use.
futures = "0.3"
