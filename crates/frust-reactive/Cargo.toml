[package]
name = "frust-reactive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reactive substrate for Frust: process-wide runtime, async executor, frame waker and shell event sources."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Do NOT add the `effects` feature (docs/DEVELOPMENT.md's Version-Pin Policy): the frame path is a
# custom subscriber, not `RenderEffect`.
reactive_graph = { workspace = true }
any_spawner = { workspace = true }
futures = "0.3"

# wasm32 has no OS threads or mio reactor, so these tokio features fail to compile there (see
# `src/runtime.rs` for the wasm arm and what it cannot do yet).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `net` is the smallest feature satisfying `enable_io()`, the IO driver `frust::spawn`'s tasks need.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# `rt` alone is the only set that compiles for wasm32; `executor.rs`/`task.rs` name its handle types.
tokio = { workspace = true, features = ["rt"] }
# Kept although `runtime.rs` installs its own `CustomExecutor`: any_spawner's wasm-bindgen-futures dep hangs off it.
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
# Direct: the wasm `CustomExecutor` in `runtime.rs` calls `wasm_bindgen_futures::spawn_local` itself.
wasm-bindgen-futures = "0.4.50"
