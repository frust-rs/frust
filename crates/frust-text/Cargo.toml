[package]
name = "frust-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Text pipeline for Frust: font matching, shaping and layout over the font oracle and parley_engine, with renderer-agnostic styles and glyph runs."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# `std::time::Instant::now()` panics on wasm32; `web-time` is the drop-in winit 0.30 itself uses (std's `Instant` elsewhere).
web-time = { workspace = true }
parlance.workspace = true
# The font oracle's shaping engine and its font-data types (`src/oracle/` names neither: the
# adapter over the oracle lives outside it). `std` only — `complex-scripts` stays off.
parley_engine = { workspace = true, features = ["std"] }
fontique = { workspace = true, features = ["std"] }
read-fonts.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
# The oracle's persistent fallback cache directory (a CORE leaf crate: no cycle).
frust-paths.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

# Oracle backends (`src/oracle/{apple,android,dwrite,fontconfig}.rs`). The objc2* rows are direct
# `version` rows with minimal features, as frust-engine's (Cargo refuses `default-features = false`
# on an inherited objc2* row); `CFLocale` + `CFArray` read the preferred languages for the Han face.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFURL", "CFNumber", "CFDictionary", "CFArray", "CFLocale"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontTraits"] }

# `api-level-29`: the NDK system-font API (`ASystemFontIterator`/`AFontMatcher`) is API 29.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { workspace = true, features = ["api-level-29"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation"] }
windows-link.workspace = true

# `dlopen`: no link-time libfontconfig requirement (a system without it simply gets no answers).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
yeslogic-fontconfig-sys = { workspace = true, features = ["dlopen"] }
