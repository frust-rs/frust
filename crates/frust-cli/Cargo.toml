[package]
name = "frust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "frust"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
# The shared drive logic (process/devices/doctor/build_info/scaffold +
# android/ios run/build pipelines) now lives in `frust-drive`; `frust-cli`
# is the thin clap front-end over it. All non-clap CLI deps (serde, toml,
# minijinja, include_dir, ctrlc, thiserror) followed their modules there.
frust-drive = { path = "../frust-drive" }
frust-tui = { path = "../frust-tui" }
# Tokio runtime for executing `frust tui`'s async entry point.
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
# The command-handler tests drive their `run_in` cores with
# `frust_drive::process::FakeProcessRunner`, exposed behind frust-drive's
# `test-util` feature (off in the shipped binary).
frust-drive = { path = "../frust-drive", features = ["test-util"] }
