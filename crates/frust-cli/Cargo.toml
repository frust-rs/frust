[package]
name = "frust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `frust` command-line tool: scaffold, run, build and diagnose Frust apps on desktop, Android and iOS, or open the terminal workbench."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "frust"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
# Shared drive logic; thin clap front-end over it.
frust-drive = { path = "../frust-drive", version = "0.6.0" }
frust-tui = { path = "../frust-tui", version = "0.6.0" }
# Tokio runtime for frust tui async entry point.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Watch loop filesystem detection; CLI-orchestration over spawn_streaming seam.
notify.workspace = true
# Ctrl-C handler for watch loop group-kill (child process management).
ctrlc.workspace = true

[dev-dependencies]
frust-drive = { path = "../frust-drive", version = "0.6.0", features = ["test-util"] }
# Test-only TOML parsing for profile_sync.rs.
toml.workspace = true
