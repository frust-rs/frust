[package]
name = "frust-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Substrate for Frust plugins: Android platform handles and the desktop native-view factory registry."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Unconditional so the error types exist on every target; the desktop registry (src/desktop.rs) needs
# only std, so this crate stays a leaf.
thiserror = { workspace = true }

# Android only: `android` is an inert stub module elsewhere (gated like the Android shell's own `jni`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
ndk-context = { workspace = true }
