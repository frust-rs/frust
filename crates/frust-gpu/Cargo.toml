[package]
name = "frust-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wgpu adapter, device and surface foundation for Frust: capability probing, surface lifecycle and pooled GPU resources."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
kurbo.workspace = true
peniko.workspace = true
anyhow.workspace = true
log.workspace = true

[features]
default = []
perf-trace = []

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

# --- Per-target wgpu backend features ---
# Backends are added HERE only (the root `wgpu` row is backend-free); every crate naming `wgpu` depends
# on `frust-gpu` unconditionally, so this is the single choke point (verify with `cargo tree -i wgpu`).
# Routing: apple -> metal; other unix (Linux, Android) -> vulkan; windows -> dx12 + vulkan; browser
# wasm32 -> webgpu + webgl. `gles` is in no row: no shipping shell surfaces a GLES-only device.
# wasm32-unknown-emscripten is both `unix` and `wasm32`, so Cargo would union both rows; the wasm row
# excludes it, leaving only the inert vulkan feature there. wasm32-wasip1 is unverified.
# Why per-target, and its measured size effect: docs/RENDER_DEVELOPMENT.md.

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

# Both on purpose: these tables set what is COMPILED IN; `src/context.rs` still requests
# `Backends::from_env()` (default: all) at runtime. Do not trim to the default adapter's backend.
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

# `fragile-send-sync-non-atomic-wasm`: `pipeline.rs`'s threaded warm-up needs `Send + Sync` handles. Sound
# on wasm32-unknown-unknown (no threads; inert under `atomics`); a failed spawn falls back inline.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
