[package]
name = "frust-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wgpu adapter, device and surface foundation for Frust: capability probing, surface lifecycle and pooled GPU resources."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# The root `wgpu` row is backend-free: backends are added only in the per-target tables below, and every
# crate naming `wgpu` depends on frust-gpu, so this is the single choke point (`cargo tree -i wgpu`).
wgpu.workspace = true
bytemuck.workspace = true
kurbo.workspace = true
peniko.workspace = true
anyhow.workspace = true
log.workspace = true

[features]
default = []
perf-trace = []

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true
# Zero-copy AHardwareBuffer import (`src/import/android.rs`): raw Vulkan through the same `ash` wgpu-hal uses.
ash.workspace = true
ndk-sys.workspace = true

# --- Per-target wgpu backends (why per-target, size effect: docs/RENDER_DEVELOPMENT.md) ---
# `gles` is in no row: no shipping shell surfaces a GLES-only device.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
# Zero-copy CVPixelBuffer import (`src/import/apple.rs`): CVMetalTextureCache -> MTLTexture -> wgpu. Minimal
# feature lists; the import card may widen them (feature changes do not touch the lockfiles).
objc2.workspace = true
objc2-core-foundation = { workspace = true }
# Direct `version` rows (like plugins/camera): Cargo refuses `default-features = false` on a workspace-inherited objc2* row.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "CVMetalTexture",
    "CVMetalTextureCache",
    "objc2-metal",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLResource",
    "MTLTexture",
    "MTLPixelFormat",
] }

# Linux, Android -> vulkan. wasm32-unknown-emscripten is both `unix` and `wasm32`, so Cargo would union
# this row with the wasm one, but the wasm row excludes emscripten: only the inert vulkan feature applies.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

# Both on purpose: these tables set what is COMPILED IN; `src/context.rs` still requests
# `Backends::from_env()` (default: all) at runtime. Do not trim to the default adapter's backend.
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

# Browser wasm32 only (wasip1 unverified). `fragile-send-sync-...`: `pipeline.rs` warm-up needs `Send + Sync`
# handles; sound on wasm32-unknown-unknown (no threads; inert under `atomics`); failed spawn falls back inline.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
