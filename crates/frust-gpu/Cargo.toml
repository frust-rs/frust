[package]
name = "frust-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
kurbo.workspace = true
peniko.workspace = true
anyhow.workspace = true
log.workspace = true

[features]
default = []
perf-trace = []

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

# --- Per-target wgpu backend features ------------------------------------
#
# `wgpu`'s workspace row (root `Cargo.toml`) carries only the
# target-independent base (`std`/`parking_lot`/`wgsl`); the GPU backends are
# added HERE, per target, and nowhere else. This crate is the single choke
# point that makes that safe: every crate in the workspace that names `wgpu`
# directly — `frust-engine`, `frust-render`, `frust-testing`, and `frust`
# under its `gpu` feature — depends on `frust-gpu` unconditionally, so the
# backend a target needs is unioned in through this manifest whatever the
# build's entry point. Verify with `cargo tree -i wgpu` before assuming a new
# wgpu edge is covered.
#
# Why per-target rather than the one unioned row this used to be: cargo
# features are additive across a build graph, so a single row listing all
# three backends compiled every backend's *feature* into every target, even
# where `wgpu-hal` cfg-gates the backend code itself out. The feature is what
# drags naga's shader writers in, and those are pure code size on a target
# that can never run them. Measured on 30.0.1 with
# `cargo tree -e features --target <triple>`, backends route through
# platform-scoped shim crates (`wgpu-core-deps-apple`,
# `wgpu-core-deps-windows-linux-android`), which makes the waste asymmetric:
#
#   * Android got `dx12` -> `wgpu-core-deps-windows-linux-android/dx12` ->
#     `naga/hlsl-out`: an HLSL writer no Android device can ever use. (It did
#     NOT get `msl-out` — `metal` routes through the apple shim, which is not
#     a dependency on Android at all, so that feature was inert there.)
#   * Linux got the same stray `hlsl-out`.
#   * Apple targets got neither `spv-out` nor `hlsl-out` — `vulkan`/`dx12`
#     route through the windows-linux-android shim, absent on apple — so the
#     unioned row was already metal-only there by accident. These tables make
#     that a property of the manifest instead of an accident of wgpu's
#     internal shim layout, which is not part of wgpu's public contract.
#
# Windows deliberately keeps BOTH `dx12` and `vulkan`: the desktop shell
# enumerates both there and `frust_gpu::RenderContext` asks for
# `Backends::all()` at runtime (see `src/context.rs`) — these tables change
# what is COMPILED IN, never what is requested. Do not "simplify" a target to
# one backend to match its default adapter.
#
# wasm gets no arm on purpose: it is neither `unix` nor `windows`, so it
# resolves to zero backends, which is right — Frust ships no wasm shell, and
# the browser arm would be `webgpu`, deliberately dropped in the workspace row.

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

# Linux, Android and any other non-apple unix.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
