[package]
name = "frust-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Baseline widget set for Frust: text, buttons, images, flex, stack and scroll containers, and the authoring helpers for custom widgets."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-text = { workspace = true }
# Widgets resolve theme tokens at layout/paint time via `Theme::from_layout_ctx`/`from_paint_ctx`
# (docs/CODE_STANDARDS.md's Theming & Animation Conventions).
frust-theme = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# Turns on frust-core's clock seam (`PaintCtx::for_test`) for this crate's own
# widget tests — the only sanctioned way to paint at a chosen FrameTime.
frust-core = { workspace = true, features = ["test-support"] }
# The shared default-locale slot lock (`frust_text::locale::test_support`) for this crate's tests.
frust-text = { workspace = true, features = ["test-support"] }

[features]
# Compiles the GPU-free container fixtures and the shared locale-slot lock (`test_support`) so an
# out-of-tree design system can test against them. Off by default; on in this crate's own tests.
test-support = ["frust-text/test-support"]
