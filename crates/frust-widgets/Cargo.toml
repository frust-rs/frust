[package]
name = "frust-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-text = { workspace = true }
# Load-bearing: widgets resolve theme tokens (default colors/type/shape) at
# layout/paint time via Theme::from_layout_ctx/from_paint_ctx — see
# docs/CODE_STANDARDS.md's Theming & Animation Conventions.
frust-theme = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
image = { workspace = true }

[features]
# Forwards into frust-theme's own `glyph-fonts` (gf2 opt-out chain, mirroring
# the perf-trace chain's shape) — the root workspace edge above no longer
# requests frust-theme's defaults, so this is one of the re-enabling edges
# the facade's default-on `glyph-fonts` feature turns on.
glyph-fonts = ["frust-theme/glyph-fonts"]
