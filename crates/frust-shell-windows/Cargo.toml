[package]
name = "frust-shell-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows desktop shell for Frust: native Win32 menu bar, window icons and app identity on top of frust-shell-desktop."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# DesktopExtensions trait + winit core; unconditional since `frust-shell-desktop` compiles on every non-mobile host.
frust-shell-desktop = { workspace = true }
# Carried ahead of native menu handling (`push_menu_event`) so that work never touches this manifest.
frust-reactive = { workspace = true }
# `on_theme_brightness_changed` is typed in `frust_theme::Brightness`, which `frust-shell-desktop` does not re-export.
frust-theme = { workspace = true }
winit = { workspace = true }
log = { workspace = true }

# Win32-native half (`muda` menu bar, accelerator hook); inert off Windows so `cargo check --workspace` stays green.
[target.'cfg(target_os = "windows")'.dependencies]
muda = { workspace = true }
# Features are exactly what `win32_glue` calls (Version-Pin Policy: no workspace-level features, see root `windows-sys` row):
# `Win32_UI_Shell` for AppUserModelID, `Win32_UI_WindowsAndMessaging` for MSG/HACCEL/TranslateAcceleratorW.
windows-sys = { workspace = true, features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# docs.rs builds x86_64 Linux by default; a target-specific crate would document as empty.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
