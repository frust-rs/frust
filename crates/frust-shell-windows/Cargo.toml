[package]
name = "frust-shell-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The DesktopExtensions trait this crate implements, plus the winit core it
# plugs into. Unconditional (not target-gated): `frust-shell-desktop` itself
# already compiles on every non-mobile host.
frust-shell-desktop = { workspace = true }
# `WindowsExtensions`'s hooks will report menu activations through
# `frust_reactive::push_menu_event` once native menu handling lands (see
# `DesktopExtensions::pump`'s docs) — carried now so that follow-on task
# never touches this manifest.
frust-reactive = { workspace = true }
winit = { workspace = true }
log = { workspace = true }

# The Win32-native half — a native menu bar (`muda`), and the
# `EventLoopBuilderExtWindows::with_msg_hook` menu-accelerator wiring a
# follow-on task adds — only ever compiles for a Windows target; on every
# other host this crate is (almost) empty but the `WindowsExtensions` stub
# above still compiles, so `cargo check --workspace` stays green (the
# `frust-shell-android` inert-off-target precedent — see its own Cargo.toml).
[target.'cfg(target_os = "windows")'.dependencies]
muda = { workspace = true }
# `Win32_UI_Shell` is this crate's own feature ask (AppUserModelID/taskbar
# identity, see `DesktopConfig::app_id`'s docs); task 04 may extend this list
# further as its own manifest change, per the Version-Pin Policy's "declare
# no features at the workspace level" contract for this pin (see the root
# Cargo.toml's `windows-sys` row).
windows-sys = { workspace = true, features = ["Win32_UI_Shell"] }
