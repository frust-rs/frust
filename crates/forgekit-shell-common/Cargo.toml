[package]
name = "forgekit-shell-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Platform-agnostic shell plumbing: no jni/ndk/winit here, so the whole crate
# compiles on every target (host and `*-linux-android`/iOS) with no cfg
# gymnastics — it contains no FFI. `AppTree` drives a `RenderRoot` and paints
# into a `PaintScene` (both `forgekit-core`), threading text/scene resources
# through type-erased seams; `forgekit-scene`/`forgekit-text` are the layers a
# concrete shell composes on top of this, kept as deps so the shared erasure and
# the shells that consume it agree on the same versioned types.
forgekit-core = { workspace = true }
forgekit-scene = { workspace = true }
forgekit-text = { workspace = true }
# Load-bearing (task 6c-04): the app-facing theme override slot
# (`theme_override`) holds/hands back a `forgekit_theme::Theme`. A narrow,
# deliberate addition — see `theme_override`'s module docs' Layering choice —
# not a general theme dependency creeping into every shared-plumbing crate.
forgekit-theme = { workspace = true }
kurbo = { workspace = true }
# `guard` logs a caught panic through the `log` facade only (no android_logger),
# so it stays platform-free and host-testable.
log = { workspace = true }

# DEV-ONLY: the shipped crate stays reactive-free (see docs/ARCHITECTURE.md's
# Layer Dependencies). `reactive_graph` is a dev-dependency solely for the
# root-owner regression test below — it drives a root `Component` under an
# `Owner::with` (the way the shells now wrap `new_boxed_app_with`) and asserts a
# root-provided context resolves in a nested component. It never enters the
# crate's own dependency graph for consumers.
[dev-dependencies]
reactive_graph = { workspace = true }
