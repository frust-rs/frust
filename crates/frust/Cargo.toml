[package]
name = "frust-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Frust: a Rust-native, mobile-first declarative UI framework; the facade crate application code depends on."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Published as frust-ui, imported as frust: crates.io `frust` belongs to another project (https://github.com/lloydmeta/frunk/issues/258).
[lib]
name = "frust"

[dependencies]
frust-core = { workspace = true }
# No design-system catalog rides this edge: catalogs ship as sibling plugin crates an app depends
# on beside the facade, never inside it (docs/ARCHITECTURE.md's facade/plugin boundary).
frust-widgets = { workspace = true }
frust-reactive = { workspace = true }
# Re-exported flat as the facade's design-token vocabulary (see lib.rs).
frust-theme = { workspace = true }
# Named directly (also transitive) so lib.rs's flat `Color` re-export resolves in the library.
peniko = { workspace = true }
# Named directly for lib.rs's flat reactive re-exports (`Memo`, `signal`, `spawn`/`spawn_local`).
reactive_graph = { workspace = true }
any_spawner = { workspace = true }
# Direct so the flat `set_app_theme`/`clear_app_theme` re-export never depends on which platform
# shell is active (see `frust_shell_common::theme_override`).
frust-shell-common = { workspace = true }
# Named directly so the `authoring::scene` re-export resolves in the library, not just in tests.
frust-scene = { workspace = true }
# frust-engine is the only renderer: there is no render-tier feature to forward.
frust-render = { workspace = true }
# Optional, `gpu` only: the one sanctioned exception to "nothing above RENDER depends on
# `frust-gpu`" (docs/ARCHITECTURE.md's GPU-substrate boundary), so an ordinary app carries none.
frust-gpu = { workspace = true, optional = true }
# Backend-free like every wgpu row outside `frust-gpu`: `gpu` enables `dep:frust-gpu` alongside, and
# `crates/frust-gpu/Cargo.toml`'s per-target tables supply the backend.
wgpu = { workspace = true, optional = true }
# Named directly so the `authoring::text` re-export resolves in the library, not just in tests.
frust-text = { workspace = true }
# Named directly so the flat `frust::kurbo` and `authoring` re-exports resolve in the library.
kurbo = { workspace = true }
# Unconditional so `android_app!` is always re-exported; the crate is inert off-Android.
frust-shell-android = { workspace = true }
# Unconditional so `ios_app!` is always re-exported; the crate is inert off-iOS.
frust-shell-ios = { workspace = true }
anyhow = { workspace = true }

# Off Android/iOS/wasm32 (driven by `android_app!`/`ios_app!`/`web_app!`; the winit graph fails to
# build or is dead weight there). Negated, not a desktop list, so a niche host keeps the generic core.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
frust-shell-desktop = { workspace = true }

# Each gated by the same `cfg` as its `desktop_extensions` arm in lib.rs, so a build resolves only its
# host's native bindings. No feature forwards: none declares one; `frust-shell-desktop/*` reaches them.
[target.'cfg(target_os = "macos")'.dependencies]
frust-shell-macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
frust-shell-windows = { workspace = true }

# Linux only, as narrow as the verification; widening needs this `cfg` plus the matching
# `desktop_extensions` arm in lib.rs.
[target.'cfg(target_os = "linux")'.dependencies]
frust-shell-linux = { workspace = true }

# Browser tier, entered through `web_app!`'s wasm-bindgen start shim (lib.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
frust-shell-web = { workspace = true }
# Re-exported hidden from lib.rs so a generated app needs none of these in its own manifest
# (the same reason as `frust-shell-android`'s `__jni` re-export).
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# `kurbo`, `frust-scene` and `frust-text` are normal dependencies above, so they are not repeated here.
peniko = { workspace = true }
frust-core = { workspace = true }
# Exact workspace pin (docs/DEVELOPMENT.md § Version-Pin Policy); encodes the `image_async` PNG fixture.
image = { workspace = true }

[features]
# No default features and no design-system catalog: catalogs are sibling plugin crates, each
# installed with its own `install()`.
default = []
# Opt-in, never default (opt-in survives additive unification; the CLI is the sole enabler). Each
# shell's forward activates only on that shell's own targets.
perf-trace = [
    "frust-shell-desktop/perf-trace",
    "frust-shell-android/perf-trace",
    "frust-shell-ios/perf-trace",
]
# Opt-in, never default: a release build has no listener or protocol symbols because the feature is
# absent. The CLI enables it for debug/profile (`BuildMode::cargo_features`).
devtools = [
    "frust-shell-desktop/devtools",
    "frust-shell-android/devtools",
    "frust-shell-ios/devtools",
]
# Opt-in, never default: hot-patch seam (frust-hotpatch's jump table around `Component::build`) plus in-app apply over
# devtools (`frust-shell-common/hotpatch`). The desktop and Android shells redraw on the
# next frame after a patch applies; iOS is not wired.
hotpatch = [
    "frust-core/hotpatch",
    "frust-shell-common/hotpatch",
    "frust-shell-desktop/hotpatch",
    "frust-shell-android/hotpatch",
]
# Opt-in `frust::gpu` seam. `frust-shell-common/gpu` is the device slot `with_context` reads; only the
# desktop shell installs into it yet (Android/iOS: accepted gap, see their crate docs).
gpu = [
    "dep:frust-gpu",
    "dep:wgpu",
    "frust-shell-common/gpu",
    "frust-shell-desktop/gpu",
    "frust-shell-android/gpu",
    "frust-shell-ios/gpu",
]
