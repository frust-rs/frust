[package]
name = "frust-shell-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-agnostic shell plumbing shared by the Frust platform shells: app-tree erasure, FFI guards, window metrics and insets."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# Opt-in perf instrumentation: on, the `perf` module's `frust-perf` emission and `FRUST_TRACE*` switches compile in; off, they
# collapse to `false` constants and the strings are cfg'd out. The CLI enables it for debug/profile builds.
perf-trace = []
# Opt-in in-app devtools service (loopback server, `DevtoolsBackend`, UI-thread hop). Off, the module and both `frust-devtools*`
# deps are absent entirely; the gate is the feature, never a `debug_assertions` check (CLI enables for debug/profile builds).
devtools = ["dep:frust-devtools", "dep:frust-devtools-protocol"]
# Opt-in process-wide GPU-device slot (`install_gpu_handle`/`gpu_handle`); type-erased, so it adds no dependency.
gpu = []

[dependencies]
# No jni/ndk/winit and no FFI, so the crate compiles on every target. `frust-scene`/`frust-text` stay deps so the shells and the
# erasure agree on the same versioned types.
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-text = { workspace = true }
# Load-bearing: the `theme_override` slot holds a `frust_theme::Theme` (see its module docs' Layering choice).
frust-theme = { workspace = true }
kurbo = { workspace = true }
# `guard` logs caught panics through the `log` facade only, keeping the crate platform-free.
log = { workspace = true }
# Optional, `devtools`-only. Path deps like `frust-drive`'s protocol edge; `frust-devtools` depends on no framework crate,
# so there is no layering cycle.
frust-devtools = { path = "../frust-devtools", version = "0.6.0", optional = true }
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.6.0", optional = true }

# DEV-ONLY (the shipped crate stays reactive-free, docs/ARCHITECTURE.md Layer Dependencies). `reactive_graph` drives the
# root-owner test; `frust-reactive` drives the tracked-rebuild test of the `rt.with_owner(|| scope.track(|| app.rebuild()))`
# wrap the Android/iOS shells use over `AppTree` (their `app` modules are never host-compiled).
[dev-dependencies]
reactive_graph = { workspace = true }
frust-reactive = { workspace = true }
