[package]
name = "frust-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPU backend for Frust: renders a frust-scene display list into a window surface through the frust-engine strip pipeline on wgpu."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Backend-free: the unconditional `frust-gpu` edge below unions in the target's backend. Adding
# backends here would re-union them across every target (see `crates/frust-gpu/Cargo.toml`).
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
anyhow.workspace = true
log.workspace = true
# The only renderer this crate contains; never optional, no render-tier feature.
frust-engine.workspace = true
# Not optional: `RenderContext`, `SurfaceFactory` and the surface lifecycle live there and are
# re-exported from this crate's root unconditionally.
frust-gpu.workspace = true

[features]
# Opt-in, never default: gates the `FRUST_TRACE` probe lines and, via `frust-gpu/perf-trace`, the
# `TIMESTAMP_QUERY` request the engine's timestamp ring needs. Never gate `frust-gpu`'s uncaptured-error handler on it.
perf-trace = ["frust-engine/perf-trace", "frust-gpu/perf-trace"]

# Gates only the `frust_gpu::DeviceHandle` re-export (no new dependency); forwarded from every
# shell's and the facade's `gpu` feature.
gpu = []

# Unused here (`frust-gpu` owns the emulator probe), kept because removing it re-resolves every
# standalone workspace's lockfile; retire it with the next deliberate lockfile sweep.
[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

[dev-dependencies]
pollster = "0.4"
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
