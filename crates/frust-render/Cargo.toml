[package]
name = "frust-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
anyhow.workspace = true
log.workspace = true
# The frust-owned sparse-strip render engine — optional, only pulled in by the
# `engine-tier` feature below; NOT part of the default GPU path. A
# workspace-internal path dependency, so it carries no version pin of its own.
frust-engine = { workspace = true, optional = true }
# The wgpu device/surface foundation. NOT optional: `RenderContext`,
# `SurfaceFactory`, `DetachedSurface`, the surface-lifecycle state machine, the
# pipeline-cache framing and the shader-effect pipelines all live there now and
# are re-exported from this crate's root unconditionally, which is what keeps
# the shells' own `use frust_render::…` lines unchanged.
frust-gpu.workspace = true

[features]
# DEFAULT: `engine-tier` below — the only shipping renderer. Vello classic is
# GONE (its `vello` dependency, its `RenderTier::Gpu` variant and the
# `FRUST_RENDER_TIER=gpu` escape hatch that reached it were all deleted once
# the engine tier became the default); the experimental `vello_cpu`-backed
# `cpu-tier` fallback (and its `convert` module's `SceneSink` command walk,
# its one remaining consumer) is GONE too, retired once the engine tier
# proved it needs no downlevel capability that fallback existed to cover.
default = ["engine-tier"]
# The frust-owned engine render tier (`frust-engine` over `frust-gpu`).
# DEFAULT, and now MANDATORY: `tier::select_render_tier` probes for and selects
# this tier automatically (`frust-engine` needs no downlevel flag at all — see
# `ENGINE_REQUIRED_DOWNLEVEL_FLAGS`), and since vello classic was deleted it is
# the only renderer this crate contains — `lib.rs` `compile_error!`s on a build
# without it rather than failing deep inside the surface pipeline. Kept as a
# feature because `frust-engine` remains an optional dependency.
engine-tier = ["dep:frust-engine"]
# Opt-in perf-tracing probes: gates the
# `FRUST_TRACE`-driven surface-caps/render-path probe log lines in
# `context.rs`, plus (through the `frust-gpu/perf-trace` row below) the device
# request asking for `wgpu::Features::TIMESTAMP_QUERY` when the adapter offers
# it — what makes the engine tier's GPU-timestamp ring
# (`frust_gpu::diag::TimestampRing`) live rather than permanently inert. NOT
# default — a build without this feature compiles neither the probe bodies
# nor their `"frust-perf ..."` string literals, and never asks for the
# feature. The uncaptured-error handler is deliberately NOT behind this
# feature — it must keep working in a release build with no features
# enabled. `frust-engine` is optional (`engine-tier`), so `?` forwards this
# crate's own `perf-trace` to it only when `engine-tier` has already activated
# it, never activating it on its own. `frust-gpu` is unconditional and is
# forwarded to directly: it owns the device request that asks for
# `TIMESTAMP_QUERY`, so without that row a `perf-trace` build would compile the
# probes and never get the feature that makes them live.
perf-trace = ["frust-engine?/perf-trace", "frust-gpu/perf-trace"]

# Nothing in this crate reads an Android system property any more: the emulator
# probe that did (`is_android_emulator`, which strips the instance's DEBUG flags
# there) moved to `frust-gpu` with the rest of the device bring-up, and
# `frust-gpu` declares this dependency itself. The row is left standing rather
# than deleted because removing it re-resolves the lockfile of every standalone
# workspace that path-depends on this crate (`examples/*`,
# `benchmarks/frust_bench`, `plugins/clean-signals-frust`) as well as the root
# one — churn across shared lockfiles for no behaviour change. Retire it with
# the next deliberate lockfile sweep.
[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

[dev-dependencies]
pollster = "0.4"
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
