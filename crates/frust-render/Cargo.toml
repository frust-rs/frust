[package]
name = "frust-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vello.workspace = true
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
anyhow.workspace = true
log.workspace = true
# Experimental CPU render-tier fallback —
# optional, only pulled in by the `cpu-tier` feature below; NOT part of the
# default GPU path. Exact-pinned per the workspace Version-Pin Policy.
vello_cpu = { workspace = true, optional = true }
# Measurement spike: vello_hybrid 0.2.0 render tier —
# optional, only pulled in by the `hybrid-tier` feature below; NOT part of the
# default GPU path. Exact-pinned per the workspace Version-Pin Policy.
vello_hybrid = { workspace = true, optional = true }
# Companions of the hybrid spike: vello_hybrid leaks these crates' types through
# its public API (paint::ImageId, glifo::Glyph, geometry::RectU16) without
# re-exporting them, so the sink must name them directly. Same pins, same gate.
vello_common = { workspace = true, optional = true }
glifo = { workspace = true, optional = true }

[features]
# Experimental vello_cpu-backed CPU render tier.
# NOT default — the GPU (vello) path is unaffected when this is off.
cpu-tier = ["dep:vello_cpu"]
# Measurement spike: vello_hybrid 0.2.0 render tier.
# NOT default — the GPU (vello) path is unaffected when this is off.
hybrid-tier = ["dep:vello_hybrid", "dep:vello_common", "dep:glifo"]
# Opt-in perf-tracing probes: gates the
# `FRUST_TRACE`-driven surface-caps/render-path probe log lines in
# `context.rs`. NOT default — a build without this feature compiles neither
# the probe bodies nor their `"frust-perf ..."` string literals. The
# `FRUST_NO_DIRECT_SURFACE`/`FRUST_NO_SHADER_EFFECTS` kill switches and the
# uncaptured-error handler are deliberately NOT behind this feature — they
# must keep working in a release build with no features enabled.
perf-trace = []

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

[dev-dependencies]
pollster = "0.4"
vello.workspace = true
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
