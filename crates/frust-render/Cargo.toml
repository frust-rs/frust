[package]
name = "frust-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vello.workspace = true
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
anyhow.workspace = true
log.workspace = true
# Experimental CPU render-tier fallback —
# optional, only pulled in by the `cpu-tier` feature below; NOT part of the
# default GPU path. Exact-pinned per the workspace Version-Pin Policy.
vello_cpu = { workspace = true, optional = true }
# The frust-owned sparse-strip render engine — optional, only pulled in by the
# `engine-tier` feature below; NOT part of the default GPU path. A
# workspace-internal path dependency, so it carries no version pin of its own.
frust-engine = { workspace = true, optional = true }
# Companion of the engine tier: `frust_engine::EngineRenderer::new` takes a
# `frust_gpu::TierCaps` and `frust-engine` re-exports neither that type nor its
# `probe` constructor, so the tier's call site in `renderer.rs` must name
# `frust-gpu` directly.
frust-gpu = { workspace = true, optional = true }

[features]
# DEFAULT: `engine-tier` below. Vello classic (`Gpu`) survives one release
# behind the `FRUST_RENDER_TIER=gpu` override (`tier::select_render_tier`);
# it is never gated behind a Cargo feature of its own (the `vello`
# dependency above is unconditional), only behind that runtime/compile-time
# override.
default = ["engine-tier"]
# Experimental vello_cpu-backed CPU render tier.
# NOT default — the GPU (vello) path is unaffected when this is off.
cpu-tier = ["dep:vello_cpu"]
# The frust-owned engine render tier (`frust-engine` over `frust-gpu`).
# DEFAULT: `tier::select_render_tier` now probes for and selects this tier
# automatically (`frust-engine` needs none of the vello GPU tier's downlevel
# flags — see `ENGINE_REQUIRED_DOWNLEVEL_FLAGS`), so a build that wants to
# omit `frust-engine`/`frust-gpu` symbols
# (`scripts/testing/engine-lean-check.sh`'s ON arm) now needs an explicit
# `--no-default-features` opt-out rather than simply not asking for this
# feature. `FRUST_RENDER_TIER=gpu` remains the vello-classic escape hatch for
# one release; `FRUST_RENDER_TIER=engine` is now equivalent to the default.
engine-tier = ["dep:frust-engine", "dep:frust-gpu"]
# Opt-in perf-tracing probes: gates the
# `FRUST_TRACE`-driven surface-caps/render-path probe log lines in
# `context.rs`, plus this crate's own device request asking for
# `wgpu::Features::TIMESTAMP_QUERY` (also `context.rs`, when the adapter
# offers it) — what makes the engine tier's GPU-timestamp ring
# (`frust_gpu::diag::TimestampRing`) live rather than permanently inert. NOT
# default — a build without this feature compiles neither the probe bodies
# nor their `"frust-perf ..."` string literals, and never asks for the
# feature. The `FRUST_NO_DIRECT_SURFACE`/`FRUST_NO_SHADER_EFFECTS` kill
# switches and the uncaptured-error handler are deliberately NOT behind this
# feature — they must keep working in a release build with no features
# enabled. `frust-engine`/`frust-gpu` are both optional (`engine-tier`) —
# `?` forwards this crate's own `perf-trace` to theirs only when
# `engine-tier` has already activated them, never activating either on its
# own, so an ordinary (non-`engine-tier`) `perf-trace` build (every app's
# Debug/Profile build — see `docs/DEVELOPMENT.md`) stays exactly as lean as
# before.
perf-trace = ["frust-engine?/perf-trace"]

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties.workspace = true

[dev-dependencies]
pollster = "0.4"
vello.workspace = true
wgpu.workspace = true
peniko.workspace = true
kurbo.workspace = true
frust-scene.workspace = true
