[package]
name = "frust-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sparse-strip GPU render pipeline for Frust: compiles a scene display list into strips and records the draw passes on wgpu."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# `benches/scenes.rs` is a module of `benches/main.rs`; autodiscovery would make it a libtest bench
# target that rejects criterion's flags (e.g. `--quick`).
autobenches = false

[dependencies]
frust-gpu.workspace = true
frust-scene.workspace = true
vello_common.workspace = true
glifo.workspace = true
wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
kurbo.workspace = true
peniko.workspace = true
log.workspace = true
thiserror.workspace = true

# CoreText outlines for `hvgl`-only faces (`src/text/hvgl.rs`), which `glifo`'s `skrifa` cannot read.
# Direct `version` rows with minimal features: Cargo refuses `default-features = false` on a
# workspace-inherited objc2* row (same pins as plugins/native-widgets, PLUGINS_DEVELOPMENT.md).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath"] }
# `CTFontDescriptor` gates `CTFontOrientation` (the bounding-box read); `objc2-core-graphics` gates
# `CTFontCreatePathForGlyph`.
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
    "objc2-core-graphics",
] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# Shapes the S1/S6-like bench scenes once (benches/scenes.rs); bench-only, not a runtime dependency.
frust-text.workspace = true

[features]
default = []
perf-trace = ["frust-gpu/perf-trace"]
full-scheduler = []

# `bench = false` on the lib and every test: otherwise `cargo bench -- --quick` hits a libtest
# harness that rejects criterion's flags before reaching the criterion bench.
[lib]
bench = false

[[test]]
name = "compile_rects_paths"
path = "tests/compile_rects_paths.rs"
bench = false

[[test]]
name = "encode_contract"
path = "tests/encode_contract.rs"
bench = false

[[test]]
name = "gpu_layouts"
path = "tests/gpu_layouts.rs"
bench = false

[[test]]
name = "paint_encoding"
path = "tests/paint_encoding.rs"
bench = false

[[test]]
name = "proptest_strips"
path = "tests/proptest_strips.rs"
bench = false

[[test]]
name = "structure"
path = "tests/structure.rs"
bench = false

[[bench]]
name = "main"
harness = false
