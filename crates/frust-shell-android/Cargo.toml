[package]
name = "frust-shell-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android shell for Frust apps: the Rust half of the JNI bridge, with the android_app! macro and the frame pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The Kotlin embedding ships in `platform/`; keep Gradle output out of the package.
exclude = ["platform/android/frust-embedding/build/", "platform/android/frust-embedding/.gradle/"]

[dependencies]
# Unconditional: `android_app!` is defined on every target and the panic guard is host-testable.
log = { workspace = true }
frust-paths = { workspace = true }

# JNI runtime and render/text stack compile only for Android; the host build keeps the macro and pure helpers.
[target.'cfg(target_os = "android")'.dependencies]
# Android-gated: only the FFI runtime and `android_app!` re-exports use it.
frust-shell-common = { workspace = true }
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-render = { workspace = true }
frust-text = { workspace = true }
frust-reactive = { workspace = true }
# Load-bearing: `nativeSetAppearance` pushes the platform brightness as a Theme (docs/ARCHITECTURE.md Theme delivery).
frust-theme = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
jni = { workspace = true }
ndk = { workspace = true }
ndk-sys = { workspace = true }
# Render-thread priority boost (`setpriority`) in the sanctioned-unsafe `jni_glue` zone.
libc = { workspace = true }
# The shell writes the JavaVM/Context via `frust_plugin::android::initialize`; plugins read them back. A shell -> leaf edge:
# `frust-plugin` has no `frust-*` deps of its own.
frust-plugin = { workspace = true }
android_logger = { workspace = true }
accesskit_android = { workspace = true }

# Only the macro-expansion smoke test needs a concrete `View` for `android_app!`.
[target.'cfg(target_os = "android")'.dev-dependencies]
frust-widgets = { workspace = true }

[features]
# Opt-in: re-exports shell-common and render `perf-trace`; the CLI is the sole enabler.
perf-trace = ["frust-shell-common/perf-trace", "frust-render/perf-trace"]
# Opt-in devtools service: re-exports shell-common `devtools`; a no-op off-Android (the edge is in the gated block).
devtools = ["frust-shell-common/devtools"]
# Facade `gpu` forwards here. The `jni_glue` render-thread install site is not wired to it yet (accepted gap, see lib.rs docs).
gpu = ["frust-shell-common/gpu", "frust-render/gpu"]
# Opt-in hot patch: forwards frust-core/hotpatch (the `Component::build` jump table) and shell-common's in-app apply arms
# (implies `devtools`), and registers a patch listener that raises the signals-dirty gate input. Absent, frust-hotpatch is
# not in the Android graph. The edges sit in the Android-gated block, so the host build stays macro-and-helpers only.
hotpatch = ["devtools", "frust-core/hotpatch", "frust-shell-common/hotpatch"]

[package.metadata.docs.rs]
default-target = "aarch64-linux-android"
targets = ["aarch64-linux-android"]
