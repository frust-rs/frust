[package]
name = "frust-shell-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Unconditional: the `android_app!` macro is defined on every target (it only
# *expands* to real code where its call site is `#[cfg(target_os = "android")]`),
# and the panic-guard helper is host-testable, so `log` builds everywhere.
log = { workspace = true }
# Platform-agnostic atomic write and directory resolution.
frust-paths = { workspace = true }

# The JNI runtime and the whole render/text stack are only ever compiled for an
# Android target; on the host this crate is (almost) empty but the macro and the
# pure helpers still compile so `cargo test --workspace` stays green.
[target.'cfg(target_os = "android")'.dependencies]
# Platform-agnostic shell plumbing (AppTree erasure + guard/sanitize_scale/
# logical_size). Android-gated because nothing off-Android references it: the
# `android_app!` re-exports and the FFI runtime that consume it are all
# `#[cfg(target_os = "android")]`.
frust-shell-common = { workspace = true }
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-render = { workspace = true }
frust-text = { workspace = true }
frust-reactive = { workspace = true }
# Load-bearing: `nativeSetAppearance` boxes the platform light/dark preference
# into a Theme and pushes it through both delivery paths — see
# docs/ARCHITECTURE.md's Android frame pipeline / Theme delivery.
frust-theme = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
jni = { workspace = true }
ndk = { workspace = true }
ndk-sys = { workspace = true }
# Render-thread priority self-boost: the split's dedicated
# render thread calls `setpriority(PRIO_PROCESS, gettid(), THREAD_PRIORITY_DISPLAY)`
# at the top of its loop so a busy UI thread can't starve GPU submit. Confined to
# the sanctioned-unsafe `jni_glue` zone; target-gated like the JNI/NDK deps above.
libc = { workspace = true }
# Plugin platform bridge: the shell
# *writes* the captured `(JavaVM, application Context)` at `nativeInitPlatform`
# via `frust_plugin::android::initialize`, which owns the `ndk-context` install
# and arms the pre-init flag; plugins *read* them back through `frust-plugin`.
# The shell now depends on `frust-plugin` (a real `frust-shell-android →
# frust-plugin` edge — `frust-plugin` stays a leaf: no `frust-*` deps of its
# own). `ndk-context` is no longer a direct dep here — every `ndk-context` call
# lives in `frust-plugin` now. Target-gated like the JNI deps above.
frust-plugin = { workspace = true }
android_logger = { workspace = true }
# Android accesskit adapter — target-gated
# like the JNI deps above; nothing off-Android references it.
accesskit_android = { workspace = true }

# Only the macro-expansion smoke test (`jni_glue::macro_expansion`) needs a
# concrete `View` to feed `android_app!`; the runtime itself stays widget-agnostic
# (apps bring their own view types through the macro's generics).
[target.'cfg(target_os = "android")'.dev-dependencies]
frust-widgets = { workspace = true }

[features]
# Opt-in perf-trace instrumentation: re-exports frust-shell-common/perf-trace
# and frust-render/perf-trace. Empty by default (opt-in survives cargo's additive
# unification; the CLI is the sole enabler).
perf-trace = ["frust-shell-common/perf-trace", "frust-render/perf-trace"]
# Opt-in in-app devtools service: re-exports frust-shell-common/devtools and
# compiles this shell's service start + per-frame UI-thread drain in. Empty by
# default, exactly like `perf-trace` above; like it, the frust-shell-common edge
# this targets only exists in the Android-gated dependency block, so this is a
# no-op off-Android.
devtools = ["frust-shell-common/devtools"]
# Forwards into frust-theme's own `glyph-fonts` (opt-out chain) — see
# `frust-shell-common`'s Cargo.toml for the shape rationale. The frust-theme
# edge this targets only exists in the Android-gated dependency block above;
# like `perf-trace`'s forwarding above, this is a no-op off-Android.
glyph-fonts = ["frust-theme/glyph-fonts"]

