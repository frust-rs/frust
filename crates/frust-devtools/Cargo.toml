[package]
name = "frust-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-app debug service for Frust apps: a loopback, token-authenticated NDJSON JSON-RPC server backed by a shell-supplied trait."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Wire contract only (tooling-isolation rule, docs/ARCHITECTURE.md).
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.5.2" }
# Features: rt (internal runtime), net (TCP), io-util (NDJSON), sync, time, macros.
# NOT: rt-multi-thread, fs, process, signal.
tokio = { workspace = true, features = [
    "rt",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
log = { workspace = true }
