# Puts a bare `cargo build`/`cargo run` output under `build/rust` (the frust
# default build layout). `CARGO_TARGET_DIR` or `--target-dir` override it; frust
# tools read the real path from `cargo metadata`, so `build/rust` may stay empty.
[build]
target-dir = "build/rust"

# Android link flags for every Android target, picked up by `cargo ndk` and
# Gradle's `cargoNdkBuild` without RUSTFLAGS injection: packed dynamic
# relocations (API 23+) and identical-code folding. `--icf=all` is safe because
# Frust never compares function-pointer or vtable identity. `android+relr` is
# not used: it needs API 28+, below the template's minSdk 26.
#
# Only the `[target.*]` tables mirror the repo root's `.cargo/config.toml`
# (compared by `crates/frust-cli/tests/profile_sync.rs`); this file is the copy
# a scaffold ships once it leaves the checkout. A caller's `RUSTFLAGS` replaces
# these flags entirely.

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=android", "-C", "link-arg=-Wl,--icf=all"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=android", "-C", "link-arg=-Wl,--icf=all"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=android", "-C", "link-arg=-Wl,--icf=all"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,--pack-dyn-relocs=android", "-C", "link-arg=-Wl,--icf=all"]
