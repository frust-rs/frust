[package]
name = "frust-drive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared drive logic behind the Frust tools: project scaffolding, environment doctor, device discovery and run/build pipelines."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# Exposes `FakeProcessRunner` to downstream test crates; off in release.
test-util = []

[dependencies]
# Devtools wire-protocol leaf (tooling-isolation charter, docs/ARCHITECTURE.md).
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.6.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
minijinja.workspace = true
# Templates embedded via include_dir (feature must NOT be dropped).
include_dir.workspace = true
# Format-preserving Cargo.toml editing for `plugin::add_plugin` (document edit).
toml_edit.workspace = true
# Ctrl-C → exit-0 and password cleanup; termination for SIGTERM/SIGHUP.
ctrlc = { workspace = true, features = ["termination"] }
# macOS .icns authoring; pngio only (no JPEG-2000 codec needed).
icns = { version = "0.4", default-features = false, features = ["pngio"] }
# ICO via image crate (no separate ico crate); feature additive to workspace pin.
image = { workspace = true, features = ["ico"] }
object.workspace = true
ar.workspace = true
gimli.workspace = true
rustc-demangle.workspace = true
# SHA-256 of a patch handed off by file on a loopback hot-patch session.
sha2.workspace = true

[dev-dependencies]
frust-drive = { path = ".", features = ["test-util"] }

[[test]]
name = "templates_packaged"
required-features = ["test-util"]
