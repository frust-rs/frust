[package]
name = "frust-drive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared drive logic behind the Frust tools: project scaffolding, environment doctor, device discovery and run/build pipelines."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# Exposes `process::FakeProcessRunner` (and its scripted-response builders) to
# downstream test crates (e.g. `frust-cli`'s command-handler tests). Off by
# default so the fake never compiles into a release build; frust-drive's own
# unit tests reach it via `#[cfg(any(test, feature = "test-util"))]`.
test-util = []

[dependencies]
# The devtools wire-protocol leaf (`docs/ARCHITECTURE.md`'s tooling-isolation
# charter: `frust-drive` may depend on this crate — the one sanctioned
# crossing between the in-app debug service and the tooling side — and
# nothing else framework-adjacent). Path dep, like every other in-workspace
# crate this crate consumes.
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.5.2" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
minijinja.workspace = true
include_dir.workspace = true
# Format-preserving Cargo.toml editing for `plugin::add_plugin` — a document
# edit (not a deserialize-mutate-reserialize round trip) so a project's
# hand-added comments/keys survive an idempotent plugin dependency insert.
# Shared with `frust-tui`'s recent-projects store (workspace pin 0.25).
toml_edit.workspace = true
# `frust run`'s Android/desktop log-streaming path needs a clean Ctrl-C →
# exit-0 hook (default SIGINT disposition exits 130; a streamed run should
# exit 0 instead), and `crate::interrupt` needs to delete the release-signing
# file's plaintext passwords before the process dies. `termination` routes
# SIGTERM and SIGHUP to that same handler — a CI runner sends SIGTERM and a
# closed terminal sends SIGHUP, and either one used to leave those passwords
# on disk. The feature is additive across the workspace, so `frust-cli`'s
# `--watch` handler group-kills its child on those two signals as well
# (previously it orphaned the preview binary).
ctrlc = { workspace = true, features = ["termination"] }
# `icons` module: macOS `.icns` authoring (`cargo-bundle`'s own dependency for
# the same job). `default-features = false` drops the crate's default `jp2io`
# (a JPEG-2000 codec, `hayro-jpeg2000`, this module never needs — `icns`
# always PNG-encodes on write regardless, per its own docs) — `pngio` is the
# only feature this module's PNG-only pipeline actually exercises.
icns = { version = "0.4", default-features = false, features = ["pngio"] }
# `image`'s built-in ICO encoder/decoder (`icons::generate_ico`) rather than a
# second, standalone `ico` crate — `image::codecs::ico::{IcoEncoder, IcoFrame}`
# already PNG-encodes each entry and `IcoEncoder::encode_images` covers
# multi-size authoring directly, so no extra crate enters the dependency
# graph. This is an ADDITIVE feature on top of the workspace's existing exact
# `image` pin (RENDER unit — see docs/RENDER_DEVELOPMENT.md's `image` row);
# Cargo's resolver-2 feature unification is per build graph, not
# workspace-wide, so `frust-widgets`' own `image` build (png+jpeg only) is
# unaffected by this crate enabling `ico` too.
image = { workspace = true, features = ["ico"] }

[dev-dependencies]
# Self-referencing path dependency, `test-util` on: `tests/templates_packaged.rs`
# links against the plain library build `cargo test` produces (no `cfg(test)`,
# no non-default feature) unless this crate's own `Cargo.toml` opts its own
# `tests/` directory in — this line is that opt-in, so
# `scaffold::embedded_template_paths`/`collect_embedded_paths` (gated
# `#[cfg(any(test, feature = "test-util"))]`) link into the integration-test
# binary the same way `frust-cli`'s own `frust-drive` dev-dependency does.
frust-drive = { path = ".", features = ["test-util"] }

[[test]]
name = "templates_packaged"
# The self dev-dependency above is a path-only dependency, stripped from the
# published manifest — so in the packaged tarball `test-util` is off and this
# target is skipped at `cargo test` time instead of failing to compile.
required-features = ["test-util"]
