[package]
name = "frust-shell-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux desktop shell for Frust: Wayland app_id, X11 WM_CLASS and window icon on top of frust-shell-desktop."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# `frust-shell-desktop` compiles on every non-mobile host; the menu is widget-drawn, so no target gate.
frust-shell-desktop = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
# Deliberately thin: no GTK, no `[target]` table; app_id/WM_CLASS/icon go through winit's own API.

# docs.rs builds x86_64 Linux by default; a target-specific crate would document as empty.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
