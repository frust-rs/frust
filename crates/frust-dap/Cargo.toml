[package]
name = "frust-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Debug Adapter Protocol server for Frust, embedded in its host and sharing the host's app sessions."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Embedded DAP library (not a process); tooling-isolation charter (docs/ARCHITECTURE.md).
[lib]
name = "frust_dap"
path = "src/lib.rs"

[dependencies]
frust-drive = { path = "../frust-drive", version = "0.6.0" }
# SessionBackend for same-world session supervision.
frust-mcp = { path = "../frust-mcp", version = "0.6.0" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# CancellationToken for embedder shutdown.
tokio-util = { workspace = true }
# Features: rt (spawn/JoinSet), io-util, net, sync, macros, time.
tokio = { workspace = true, features = [
    "rt",
    "io-util",
    "net",
    "sync",
    "macros",
    "time",
] }

[dev-dependencies]
frust-drive = { path = "../frust-drive", version = "0.6.0", features = ["test-util"] }
