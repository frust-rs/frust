[package]
name = "frust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Frust's declarative View API, retained Widget tree, box-constraint layout and rebuild/layout/paint pass."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
tree_arena = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
frust-scene = { workspace = true }
accesskit = { workspace = true }
reactive_graph = { workspace = true }

[features]
# Compiles `PaintCtx::for_test` so an app can paint a clock-dependent widget at a chosen time;
# `set_frame_time` stays `pub(crate)` (only `RenderRoot::paint` advances the clock). Off by default.
test-support = []
