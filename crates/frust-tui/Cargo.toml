[package]
name = "frust-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Mouse-first terminal workbench for scaffolding, running and debugging Frust apps, built on ratatui."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Workbench library only; tooling-isolation charter (docs/ARCHITECTURE.md).
[lib]
name = "frust_tui"
path = "src/lib.rs"

[dependencies]
frust-drive = { path = "../frust-drive", version = "0.6.0" }
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.6.0" }
# Embedded MCP server over shared session backend (tooling-only, docs/ARCHITECTURE.md).
frust-mcp = { path = "../frust-mcp", version = "0.6.0" }
# Embedded DAP server over same `TuiSessionBackend` (tooling-only, docs/ARCHITECTURE.md).
frust-dap = { path = "../frust-dap", version = "0.6.0" }
anyhow.workspace = true
thiserror.workspace = true
ratatui.workspace = true
# Log rendering; pin in root (Version-Pin Policy).
ansi-to-tui.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
# Projects store; pin in root (Version-Pin Policy).
toml_edit.workspace = true
# Multiple features: rt-multi-thread (runtime), net (MCP), others for async loop.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
] }
# MCP cancellation; pin in root (Version-Pin Policy).
tokio-util.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# COEXISTENCE CONSTRAINT: macOS crashes if instances live concurrently on same thread;
# this is a separate process (terminal workbench), so no hazard with plugins/shell.
arboard = { workspace = true }
# Filesystem watcher for --watch; pin in root (Version-Pin Policy).
notify.workspace = true

[dev-dependencies]
insta.workspace = true
frust-drive = { path = "../frust-drive", version = "0.6.0", features = ["test-util"] }
