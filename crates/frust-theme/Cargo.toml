[package]
name = "frust-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design-token crate for Frust: the Theme aggregate, token tables, and the builder and extension seams a design system composes."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Only kurbo/peniko-shaped types appear in this crate's public API (docs/ARCHITECTURE.md).
peniko = { workspace = true }
frust-text = { workspace = true }
# For `Theme::from_paint_ctx`/`from_layout_ctx`. No cycle: `frust-core` never depends on
# `frust-theme` (core stays theme-agnostic, docs/ARCHITECTURE.md).
frust-core = { workspace = true }

# No features: design systems compose their own tables over `ThemeBuilder`/`ThemeExtensions` from
# their own crates (docs/WIDGETS_ARCHITECTURE.md's External Design-System Contract).
