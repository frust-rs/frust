[package]
name = "frust-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Color role values (ColorScheme). Scene-layer-purity-adjacent: only
# kurbo/peniko-shaped types appear in this crate's public API, mirroring
# frust-scene/frust-text (see docs/ARCHITECTURE.md).
peniko = { workspace = true }
# TypeScale fields are frust-text::TextStyle values (family/weight/size/
# letter-spacing/line-height) — the M3 type-scale surface.
frust-text = { workspace = true }
# The delivery helpers `Theme::from_paint_ctx`/`from_layout_ctx` name
# `frust_core::PaintCtx`/`LayoutCtx` to wrap their type-erased
# `theme_as::<Theme>()` accessor into one
# obvious line for widgets. `frust-core` never depends on `frust-theme`
# (core stays theme-agnostic — see docs/ARCHITECTURE.md), so this reverse edge
# introduces no cycle.
frust-core = { workspace = true }

[features]
default = ["glyph-fonts"]
# Embeds Space Mono + IBM Plex Mono TTF bytes (glyph::fonts::font_data())
# via include_bytes! — no filesystem/network access at runtime.
# `--no-default-features` compiles the crate without them (fonts module
# absent, every other token table unaffected).
glyph-fonts = []
