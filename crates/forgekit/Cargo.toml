[package]
name = "forgekit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forgekit-core = { workspace = true }
forgekit-widgets = { workspace = true }
forgekit-reactive = { workspace = true }
# Named directly (not just through forgekit-reactive) for the facade's flat
# re-export surface (`Memo`, `signal`, `spawn`/`spawn_local`) — see
# `forgekit::run`/the reactive re-exports in `lib.rs`.
reactive_graph = { workspace = true }
any_spawner = { workspace = true }
# Depended on unconditionally so the re-exported `android_app!` macro is always
# available; the crate compiles to (almost) nothing off-Android.
forgekit-shell-android = { workspace = true }
# Likewise unconditional so the re-exported `ios_app!` macro is always available;
# the crate compiles to (almost) nothing off-iOS.
forgekit-shell-ios = { workspace = true }
anyhow = { workspace = true }

# The desktop preview shell pulls in winit → android-activity, which does not
# compile for an Android target (and is dead weight there anyway); the Android
# app is driven by `android_app!`/JNI instead. Gate it off Android so
# `cargo check --target *-linux-android -p forgekit` builds the whole graph.
[target.'cfg(not(target_os = "android"))'.dependencies]
forgekit-shell-desktop = { workspace = true }
