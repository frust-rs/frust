[package]
name = "forgekit-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Color role values (ColorScheme). Scene-layer-purity-adjacent: only
# kurbo/peniko-shaped types appear in this crate's public API, mirroring
# forgekit-scene/forgekit-text (see docs/ARCHITECTURE.md).
peniko = { workspace = true }
# TypeScale fields are forgekit-text::TextStyle values (family/weight/size/
# letter-spacing/line-height) — the M3 type-scale surface.
forgekit-text = { workspace = true }
# The delivery helpers `Theme::from_paint_ctx`/`from_layout_ctx` (task 05, the
# theme-delivery surface task 03 deferred) name `forgekit_core::PaintCtx`/
# `LayoutCtx` to wrap their type-erased `theme_as::<Theme>()` accessor into one
# obvious line for widgets. `forgekit-core` never depends on `forgekit-theme`
# (core stays theme-agnostic — see docs/ARCHITECTURE.md), so this reverse edge
# introduces no cycle.
forgekit-core = { workspace = true }
