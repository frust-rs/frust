[package]
name = "frust-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server that lets AI agents launch, drive and diagnose Frust app sessions over loopback Streamable HTTP."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# MCP library only; tooling-isolation charter (docs/ARCHITECTURE.md).
[lib]
name = "frust_mcp"
path = "src/lib.rs"

[dependencies]
# default-features = false; server + transport-streamable-http-server + macros.
rmcp = { workspace = true }
# HTTP layer for rmcp's StreamableHttpService.
axum = { workspace = true }
# Session engine: process spawning, run pipelines, device discovery (blocking).
frust-drive = { path = "../frust-drive", version = "0.5.2" }
# Devtools wire-protocol leaf (tooling-isolation charter, docs/ARCHITECTURE.md).
frust-devtools-protocol = { path = "../frust-devtools-protocol", version = "0.5.2" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# PNG decode for screenshot tool payload check.
base64 = { workspace = true }
# Graceful shutdown via CancellationToken.
tokio-util = { workspace = true }
# Multiple features: rt-multi-thread (runtime), net (TcpListener), signal (ctrl_c).
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
frust-drive = { path = "../frust-drive", version = "0.5.2", features = ["test-util"] }
