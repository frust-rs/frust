[package]
name = "frust-shell-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "iOS shell for Frust apps: the Rust half of the C-ABI bridge, with the ios_app! macro and the frame pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The Swift embedding ships in `platform/`; keep SwiftPM output out of the package.
exclude = ["platform/ios/FrustEmbedding/.build/"]

[dependencies]
# Unconditional: `ios_app!` is defined on every target (its exports are iOS-gated) and the stderr logger uses `log`.
log = { workspace = true }

# Unconditional: host-testable `ffi_support::should_recreate_surface` matches on the plain `Copy` `SurfacePhase`.
frust-render = { workspace = true }

# Unconditional: host-testable `build_tree_update` uses the `accesskit` core data crate; the iOS adapter stays gated below.
accesskit = { workspace = true }

# The C-ABI runtime and render/text stack compile only for iOS; the host build keeps the macro and pure helpers.
[target.'cfg(target_os = "ios")'.dependencies]
# iOS-gated: only the `ios_app!` re-exports and the FFI runtime use it.
frust-shell-common = { workspace = true }
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-text = { workspace = true }
frust-reactive = { workspace = true }
# Load-bearing: `frust_set_appearance` pushes the platform brightness as a Theme (docs/ARCHITECTURE.md Theme delivery).
frust-theme = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
# The render thread acquires the drawable off the main thread, which has no autorelease pool; each frame's GPU work is wrapped
# in `objc2::rc::autoreleasepool` or `CAMetalDrawable`s exhaust the layer's drawable pool (hard stall).
objc2 = { workspace = true }
# Render-thread QoS boost (`pthread_set_qos_class_self_np`) in the sanctioned-unsafe `ffi_glue` zone.
libc = { workspace = true }
# Never compiled on this host (no macOS, see docs/DEVELOPMENT.md).
accesskit_ios = { workspace = true }

# Only the macro-expansion smoke test needs a concrete `View` for `ios_app!`.
[target.'cfg(target_os = "ios")'.dev-dependencies]
frust-widgets = { workspace = true }

[features]
# Opt-in: re-exports shell-common and render `perf-trace`; the CLI is the sole enabler.
perf-trace = ["frust-shell-common/perf-trace", "frust-render/perf-trace"]
# Opt-in devtools service: re-exports shell-common `devtools`; a no-op off-iOS (the edge is in the gated block).
devtools = ["frust-shell-common/devtools"]
# Facade `gpu` forwards here. The `ffi_glue`/`app` render-thread install site is not wired to it yet (accepted gap, see lib.rs docs).
gpu = ["frust-shell-common/gpu", "frust-render/gpu"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-ios"
targets = ["aarch64-apple-ios"]
