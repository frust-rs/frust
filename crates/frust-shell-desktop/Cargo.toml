[package]
name = "frust-shell-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-render = { workspace = true }
frust-text = { workspace = true }
frust-reactive = { workspace = true }
# Shared platform-dir resolution + atomic write (frust-paths substrate) —
# cache.rs delegates cache-dir/app-stem/atomic-write to this leaf crate
# instead of hand-rolling its own copy (see cache.rs's module doc).
frust-paths = { workspace = true }
# Load-bearing: the shell owns the active Theme, boxes it into RenderRoot's
# type-erased slot, and re-pushes it on WindowEvent::ThemeChanged — see
# docs/ARCHITECTURE.md's Theme delivery.
frust-theme = { workspace = true }
# Load-bearing: the app-facing theme override watcher
# (`ThemeOverrideWatcher`/`effective_brightness_for_platform_change`) this
# shell polls once per frame — see `frust_shell_common::theme_override`'s
# module docs.
frust-shell-common = { workspace = true }
winit = { workspace = true }
# Desktop accesskit adapter — winit
# event-loop integration for the semantics tree; compiles unconditionally
# like `winit` above (this crate is only ever included in the dependency
# graph for non-Android builds, via `frust`'s
# `cfg(not(target_os = "android"))` gate — see docs/ARCHITECTURE.md).
accesskit_winit = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
# Perf instrumentation: the desktop shell installs its own stderr
# `log::Log` sink (see `logger.rs`) so `frust-shell-common::perf`'s
# `log::info!` startup-span/frame-stats lines are actually visible — mirrors
# `frust-shell-ios`'s own `StderrLogger` (zero new transitive deps, `log`
# is already pulled in via `frust-shell-common`).
log = { workspace = true }

# DEV-ONLY: the shipped crate reaches the reactive substrate exclusively through
# `frust-reactive` (see docs/ARCHITECTURE.md's Layer Dependencies) — this entry
# is a dev-dependency ONLY and never enters a consumer's dependency graph. It
# exists for the event-dispatch owner-wrap regression test, which needs
# `reactive_graph`'s `Get`/`Set` signal traits (`frust-reactive` re-exports
# `RwSignal` but not the traits) to prove the wrap installs an `Owner` and NOT a
# `TrackedScope`. Same shape and rationale as `frust-shell-common`'s dev-only
# reactive entries.
[dev-dependencies]
reactive_graph = { workspace = true }

[features]
# Opt-in perf-trace instrumentation: re-exports frust-shell-common/perf-trace
# and frust-render/perf-trace. Empty by default (opt-in survives cargo's additive
# unification; the CLI is the sole enabler).
perf-trace = ["frust-shell-common/perf-trace", "frust-render/perf-trace"]
# Forwards into frust-theme's own `glyph-fonts` (opt-out chain) — see
# `frust-shell-common`'s Cargo.toml for the shape rationale.
glyph-fonts = ["frust-theme/glyph-fonts"]
