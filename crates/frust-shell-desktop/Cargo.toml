[package]
name = "frust-shell-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop shell for Frust: winit window and event loop, input, rendering and the extension seam used by the per-OS desktop shells."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
frust-core = { workspace = true }
frust-scene = { workspace = true }
frust-render = { workspace = true }
frust-text = { workspace = true }
frust-reactive = { workspace = true }
# Shared cache-dir resolution and atomic write; `cache.rs` delegates to it.
frust-paths = { workspace = true }
# Load-bearing: the shell owns the active Theme and re-pushes it on ThemeChanged (docs/ARCHITECTURE.md Theme delivery).
frust-theme = { workspace = true }
# Load-bearing: `ThemeOverrideWatcher`, polled once per frame (see `frust_shell_common::theme_override`).
frust-shell-common = { workspace = true }
winit = { workspace = true }
# Compiles unconditionally; this crate is in the graph only for non-Android builds, via `frust`'s
# `cfg(not(target_os = "android"))` gate (docs/ARCHITECTURE.md).
accesskit_winit = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
anyhow = { workspace = true }
# The shell installs its own stderr `log::Log` sink (`logger.rs`) so `frust-shell-common::perf` lines are visible.
log = { workspace = true }

# `arboard`: ONE process-lifetime instance on the `frust-clipboard` worker thread (`ClipboardWorker`, `src/app_handler.rs`); a per-call
# instance loses X11/Wayland content. `default-features = false` drops `image-data` (Version-Pin Policy); `wayland-data-control` is NOT
# enabled, matching `plugins/clipboard` (deferred gap: Wayland without XWayland).
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
# COEXISTENCE: this worker-thread instance and `plugins/clipboard`'s per-call one can be live on different threads, observed to
# crash (macOS NSPasteboard; `plugins/clipboard/src/desktop.rs`). A clipboard widget plus `frust-clipboard`'s API on desktop is unsupported.
arboard = { workspace = true }

# DEV-ONLY (docs/ARCHITECTURE.md Layer Dependencies): `reactive_graph`'s Get/Set traits, which `frust-reactive` does not
# re-export, for the owner-wrap regression test proving the wrap installs an Owner, not a TrackedScope.
[dev-dependencies]
reactive_graph = { workspace = true }

[features]
# Opt-in: re-exports frust-shell-common/perf-trace and frust-render/perf-trace; the CLI is the sole enabler.
perf-trace = ["frust-shell-common/perf-trace", "frust-render/perf-trace"]
# Opt-in in-app devtools service: re-exports frust-shell-common/devtools; the CLI enables it for debug/profile builds only.
devtools = ["frust-shell-common/devtools"]
# Facade `gpu` forwards here: `frust-render/gpu` re-exports `DeviceHandle`; `frust-shell-common/gpu` holds the slot
# `render.rs` installs the live device into.
gpu = ["frust-shell-common/gpu", "frust-render/gpu"]
