[app]
name = "frustbench"
org = "it.f0x"
description = "Frust benchmark app (scenario suite)"

# Informational (not parsed): to change the scheme, re-run `frust create --overwrite` or edit platform files.
[deeplink]
scheme = "frustbench"

# [flavors]
# dev = { app-id-suffix = ".dev" }
# prod = {}

# Android release signing reads `android/key.properties` (Gradle; must stay gitignored). Keys:
#   storePassword=<keystore password>
#   keyPassword=<key password>
#   keyAlias=<key alias>
#   storeFile=<path to .jks, relative to the android/ dir>
# Generate an upload keystore with:
#   keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA \
#     -storetype JKS -keysize 2048 -validity 10000 -alias upload
# Without it release builds fall back to debug signing; `frust build` makes that a hard error.
# [signing]
# keystore = "android/key.properties"

# Overrides the derived iOS bundle identifier (default `org.camelCase(name)`).
# [ios]
# identifier = "it.f0x.frustbench"