org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Path to this frust checkout's Android embedding module (`settings.gradle.kts`
# includes it as `:frust-embedding`). One line to edit when moving the project
# to another machine — the same property `frust_path` in Cargo.toml already has.
# Becomes a published Maven coordinate post-crates.io. Relative because this
# benchmark lives INSIDE the frust checkout it builds against (resolved by
# `file(...)` in the settings script, i.e. against `benchmarks/frust_bench/android/`).
frust.embedding.dir=../../../platform/android/frust-embedding
