# Standalone workspace root (outside the root workspace's member globs, so no `exclude` entry):
# the generated Android/iOS projects get a project-local `target/` and the `[profile.*]` blocks apply.
[workspace]

[package]
name = "frustbench"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` for Android's `System.loadLibrary` (JNI bridge), `staticlib` for the iOS Xcode target
# (C-ABI bridge), `rlib` for the desktop `main.rs` preview binary.
[lib]
name = "frustbench"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Path deps into the owning Frust checkout (the temporary `frust_path` mechanism).
# The facade package is named `frust-ui` (lib name `frust`): https://github.com/lloydmeta/frunk/issues/258
frust = { package = "frust-ui", path = "../../crates/frust" }

# Only for the Material 3 dark baseline `BenchApp::init` forces app-wide.
frust-material = { path = "../../plugins/material" }

# The scenario-marker API (`mark_scenario_start`/`_end`): the facade does not re-export `perf`,
# and the crate is platform-agnostic, so it is safe unconditionally.
frust-shell-common = { path = "../../crates/frust-shell-common" }

frust-shared-preferences = { path = "../../plugins/shared-preferences" }

# Optional behind the default-ON `db` feature: its bundled SQLite serves only the `d1`/`d2`
# scenarios (`benchmarks/PROTOCOL.md` §9); size cost: docs/RENDER_DEVELOPMENT.md.
frust-database = { path = "../../plugins/database", optional = true }

# Present only for the `lean` feature's ceiling, which must stay release-only: `frust-perf` rides
# `log::info!`, and an always-on ceiling would also silence profile-mode perf output.
log = "0.4"

# Test harness only, NOT an escape hatch: `tests/driver.rs` drives the shell-owned `RenderRoot`
# (not in `frust::authoring`), so it names these crates directly; production code names none.
[dev-dependencies]
frust-core = { path = "../../crates/frust-core" }
frust-text = { path = "../../crates/frust-text" }
kurbo = "0.13.1"
peniko = "0.6.1"
frust-reactive = { path = "../../crates/frust-reactive" }
frust-scene = { path = "../../crates/frust-scene" }
reactive_graph = "0.2"

[features]
# On by default so `frust run`/`frust build`/`cargo test`/the harness keep all ten scenarios.
default = ["db"]

# Off = the S1–S8 frame-class app-size arm. `frust build` cannot pass `--no-default-features`, so
# from this dir: `cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --no-default-features --features lean`,
# then `./android/gradlew -p android assembleRelease -x cargoNdkBuild` packages an APK from it.
db = ["dep:frust-database"]

# Release-only log ceiling, passed by the CLI for `--release` (see the `log` dependency). Mirrors
# `crates/frust-drive/templates/app/Cargo.toml.tmpl`'s block verbatim.
lean = ["log/release_max_level_warn"]

# Hand-synced with the root `Cargo.toml` (docs/DEVELOPMENT.md § Version-Pin Policy);
# `crates/frust-cli/tests/profile_sync.rs` is the tripwire.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# BEGIN release cold-set opt-level overrides (generated: keep hand-synced)
# Release `opt-level = "z"` for crates cold on the per-frame path. Hand-synced with the root
# `Cargo.toml` (rationale and kept-at-3 list there); profile_sync.rs is the tripwire.

[profile.release.package.naga]
opt-level = "z"

[profile.release.package.codespan-reporting]
opt-level = "z"

[profile.release.package.ash]
opt-level = "z"

[profile.release.package.gpu-allocator]
opt-level = "z"

[profile.release.package.serde_json]
opt-level = "z"

[profile.release.package.roxmltree]
opt-level = "z"

[profile.release.package.fontique]
opt-level = "z"

[profile.release.package.mio]
opt-level = "z"

[profile.release.package.image]
opt-level = "z"

[profile.release.package.png]
opt-level = "z"
# END release cold-set opt-level overrides

# `--profile` mode: the harness builds every bench run with it, since `FRUST_TRACE`/
# `FRUST_TRACE_RAW`'s log lines and symbols must survive.
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# At dev `opt-level = 0` the shader-compile stack is slow enough that iOS SIGKILLs a debug
# `frust run` at launch. Hand-synced with the root `Cargo.toml` (rationale there).
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# `"*"` excludes workspace members, and the named overrides above still win. Hand-synced
# with the root `Cargo.toml` (rationale there).
[profile.dev.package."*"]
opt-level = 1
