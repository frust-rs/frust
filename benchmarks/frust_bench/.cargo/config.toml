# The scaffold template's Android link `rustflags` are deliberately not duplicated: the repo root's
# `.cargo/config.toml` already applies to any build run from inside this checkout.
[build]
# Mirrors the `frust create` template (`build_dirs::BuildLayout::rust_dir()`); applies only when
# cargo's cwd is inside this directory, and `CARGO_TARGET_DIR`/`--target-dir` override it.
target-dir = "build/rust"
