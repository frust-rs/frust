# `frust-gallery`: the shared widget/page CASE REGISTRY both the static
# snapshot generator (`crates/frust-testing`'s widget-snapshots bin) and the
# future browser gallery app (`examples/web-gallery`) read — a root-workspace
# member (covered by the root `Cargo.toml`'s `examples/*` glob, and
# deliberately not added to that manifest's `exclude` list) rather than a
# standalone workspace like `examples/huddle`/`playground`: it is a library
# with no per-project Android/iOS build output that would need its own
# `target/` dir, and it carries no out-of-tree git+rev dependency — none of
# the three reasons the standalone examples give for excluding themselves
# apply here. Riding the root workspace also means `cargo test
# --workspace`/`cargo clippy --workspace --all-targets -- -D warnings` covers
# it automatically, with no separate per-example gate to remember.
#
# Library-only shape (no `main.rs`/`android`/`ios`/`cdylib`): every `Case`
# records a pure `View` construction (`build: fn() ->
# frust_core::AnyView<()>`), never a rendered frame, and nothing below
# declares a `frust-render`/`frust-gpu`/`wgpu` dependency directly. That is a
# statement about THIS manifest only: the five design-system plugins are each
# built on the `frust` facade, and the facade carries `frust-render` ->
# `frust-gpu` -> `wgpu`, so the renderer graph is a transitive dependency of
# this crate (`cargo tree -p frust-gallery -e normal -i wgpu`). Compiling the
# crate for `wasm32` — what the browser gallery will need — therefore depends
# on that graph being made wasm-clean by the web-shell work, and is not
# established today.
[package]
name = "frust-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
frust-core = { workspace = true }
frust-widgets = { workspace = true }
frust-theme = { workspace = true }
frust-text = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
frust-material = { path = "../../plugins/material" }
frust-cupertino = { path = "../../plugins/cupertino" }
frust-glyph = { path = "../../plugins/glyph" }
frust-shadcn = { path = "../../plugins/shadcn" }
frust-beui = { path = "../../plugins/beui" }
