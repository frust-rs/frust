# Standalone package: excluded from the root workspace (see root Cargo.toml's
# `[workspace] exclude` and docs/DEVELOPMENT.md's Version-Pin Policy) so the
# generated debug APK pipeline (task 01) can be gated on its own, and this
# example's own [workspace] root gets its own Cargo.lock (the same
# `examples/inbox` pattern) rather than joining the root workspace's.
[workspace]

[package]
name = "team_demo"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` is the shared library Android's `System.loadLibrary` loads (the JNI
# bridge); `staticlib` is the archive the iOS Xcode target links (the C-ABI
# `forgekit_*` bridge, spec §10.2); `rlib` keeps the crate usable as a normal Rust
# library for the desktop `main.rs` preview binary (spec §12.9).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# NOTE: temporary path dependency pointing at the ForgeKit repo checkout
# that generated this project (spec §12.3: "forgekit_path" mechanism is
# explicitly temporary). Once ForgeKit crates are published, `forgekit
# create` will emit a version dependency here instead.
forgekit = { path = "../../crates/forgekit" }

# clean-signals (the async/use-case/controller/retry substrate) and its ForgeKit
# bridge, BOTH by relative path to the sibling `clean-signals-rs` checkout — a
# hard requirement, not a convenience. If `clean-signals` came in by `git`+`rev`
# while `clean-signals-forgekit` resolved `clean-signals` by path, Cargo would
# build TWO distinct crate identities for `clean-signals`, and the controller's
# `AsyncState`/`ControllerCore`/`Failure` types would NOT unify with the glue
# crate's `use_controller`/`async_view`/`use_failure_listener` bounds
# (type-identity rule — see docs/DEVELOPMENT.md's Version-Pin Policy and
# workflow/plans/features/team-demo-android/research/RESEARCH.md §3). Requires the
# sibling checkout at `../../../clean-signals-rs` (i.e. next to `../forgekit`) on
# its `develop` branch. Swap both to a git+rev spec together, never one at a time,
# once clean-signals gains a remote.
clean-signals = { path = "../../../clean-signals-rs/crates/clean-signals" }
clean-signals-forgekit = { path = "../../../clean-signals-rs/crates/clean-signals-forgekit" }

# Dev-only: the headless team-screen tests drive ForgeKit's `RenderRoot` directly
# (the desktop shell's own rebuild/layout/paint seam) and pump the reactive
# runtime's UI-thread local task queue frame by frame — no GPU, no window. The
# harness (`tests/support/mod.rs`) is lifted from clean-signals-forgekit's own
# integration-test support module; these deps mirror that crate's dev-deps so the
# geometry/color/signal/runtime types unify. `tokio` backs the ported domain/data
# `#[tokio::test]` unit modules (their `clean_signals::time::sleep`s need a tokio
# time driver); the crate's own production code never spawns a tokio runtime.
[dev-dependencies]
forgekit-core = { path = "../../crates/forgekit-core" }
forgekit-reactive = { path = "../../crates/forgekit-reactive" }
forgekit-scene = { path = "../../crates/forgekit-scene" }
forgekit-text = { path = "../../crates/forgekit-text" }
reactive_graph = "0.2"
kurbo = "0.13.1"
peniko = "0.6.1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution (spec §12.2). `lto = "fat"` + `codegen-units = 1`
# (phase 7 task 11, measured 2026-07-18 against `examples/catalog`'s release
# arm64-v8a `.so` via `scripts/size-report.sh` — see `workflow/plans/
# features/forgekit-phase-7-performance/research/BASELINE.md`; this
# package's own arm64 `.so` could not be measured directly in the worktree
# that ran this task, since the sibling `clean-signals-rs` checkout
# `examples/team-demo` requires wasn't present — see BASELINE.md's
# `scripts/size-report.sh` first-run note for the structural reason and the
# `examples/catalog` stand-in this task's measurement reused): fat LTO +
# cgu=1 alone (opt-level 3, the default — no override needed) shrank the
# prior baseline (lto="thin", no cgu override) from 8.46MB to 7.52MB
# unstripped, an 11.1% win taken unconditionally. `opt-level` "s"/"z" were
# also measured, but only *with* a shader/render-stack (vello/wgpu*/naga)
# carve-out back to `opt-level = 3` — the config that would actually ship,
# since sacrificing encode-path CPU perf isn't acceptable — and under that
# carve-out "s" measured 7.36MB (-2.1% vs the 7.52MB opt-3 config) and "z"
# measured 7.28MB (-3.2%): neither clears the task's ">5% meaningfully wins"
# bar once the carve-out that protects render-path perf is in place, so
# `opt-level` stays at its default (3) and no carve-out is needed. This
# block, its `[profile.profile]` counterpart, and the
# `[profile.dev.package."*"]` wildcard below are hand-synced across the root
# `Cargo.toml`, `templates/app/Cargo.toml.tmpl`, and `examples/catalog/
# Cargo.toml` (docs/DEVELOPMENT.md's Version-Pin Policy hand-sync rule).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `--profile` mode: release performance with symbols + tracing kept for
# on-device performance measurement (spec §12.2). Artifacts land in
# `target/<triple>/profile/` (custom-profile name, verified legal).
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# Debug dep opt widening (phase 7 task 11): non-workspace-member dependencies
# build at `opt-level = 1` in debug (Cargo's `"*"` package selector excludes
# workspace members and the profile's own package — verified against Cargo's
# profile-override docs); this app's own code stays at the fast default dev
# opt-level. Added here for consistency with the root/template/catalog
# manifests, though this package has no shader-stack `[profile.dev.package.*]`
# override list to keep in sync (unlike those three).
[profile.dev.package."*"]
opt-level = 1