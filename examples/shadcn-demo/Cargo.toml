# `shadcn-demo`: the shadcn/ui design-system plugin's desktop gallery — a
# root-workspace member (covered by the root `Cargo.toml`'s `examples/*`
# glob, and deliberately not added to that manifest's `exclude` list) rather
# than a standalone workspace like `examples/huddle`/`playground`: it is
# desktop-only, scaffolds no per-project Android/iOS build output that would
# need its own `target/` dir, and carries no out-of-tree git+rev dependency —
# none of the three reasons the standalone examples give for excluding
# themselves apply here. Riding the root workspace also means `cargo test
# --workspace`/`cargo clippy --workspace --all-targets -- -D warnings` covers
# it automatically, with no separate per-example gate to remember.
#
# Single-crate, desktop-only shape (no `lib.rs`/`android`/`ios`/`cdylib`),
# mirroring `examples/design-system-sample/sample-app` — the closest existing
# precedent for a plain design-system-proving app, even though that example
# itself is a standalone workspace for its own (out-of-tree-realism) reasons.
[package]
name = "shadcn-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
frust = { workspace = true }
frust-shadcn = { path = "../../plugins/shadcn" }
