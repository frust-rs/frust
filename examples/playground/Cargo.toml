# Standalone workspace (in the root's `[workspace] exclude`): the platform projects build from its own
# `build/rust` and Cargo.lock, and the `[profile.*]` blocks below only take effect in a workspace root.
[workspace]

[package]
name = "playground"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib`: Android JNI library; `staticlib`: iOS Xcode link target; `rlib`:
# the desktop `main.rs` preview binary.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Path dep on this checkout (`frust-ui`, imported as `frust`: https://github.com/lloydmeta/frunk/issues/258).
# The only authoring line: custom widgets use `frust::authoring`, never `frust-core`/`kurbo`/`peniko` directly.
frust = { package = "frust-ui", path = "../../crates/frust" }

# Material only (the home-page `app_bar`/`navigation_bar`); this app uses no Cupertino/Glyph widget.
frust-material = { path = "../../plugins/material" }

# Exact pin: a parser change would shift what the Terminal page rasterizes from the same fixture bytes
# (`fixtures/terminal/README.md`). Pure Rust (no PTY, no tokio), so it builds for Android and iOS.
vt100 = "=0.16.2"

# Present so the release-only `lean` feature can cap the log level. Never make
# the cap unconditional: `profile` builds must keep `frust-perf` output.
log = "0.4"

# Plugins under device test, one `src/pages/` section each, hand-added as path deps on this checkout.
frust-camera = { path = "../../plugins/camera" }

# Default features required: the `frust-api` hooks and the ICU4X `formatting` that `locales/*/main.ftl` uses.
frust-i18n = { path = "../../plugins/i18n" }

# Default features required: the `frust-api` builders (`use_video_player`, `video_view`).
frust-video-player = { path = "../../plugins/video-player" }

frust-url-launcher = { path = "../../plugins/url-launcher" }

frust-auth-session = { path = "../../plugins/auth-session" }

# PKCE and callback builders behind the Auth page's desktop `LoopbackSession`.
frust-oauth-native = { path = "../../plugins/oauth-native" }

# Default `engine-sqlite` backend, not the opt-in `engine-turso` bridge.
frust-database = { path = "../../plugins/database" }

# Headless `tests/smoke.rs` harness only: `RenderRoot` is deliberately not in `frust::authoring`
# (shell-owned), so it names these crates directly; production code names none of them.
[dev-dependencies]
frust-core = { path = "../../crates/frust-core" }
kurbo = "0.13.1"
frust-text = { path = "../../crates/frust-text" }
frust-reactive = { path = "../../crates/frust-reactive" }
frust-scene = { path = "../../crates/frust-scene" }
reactive_graph = "0.2"
peniko = "0.6.1"

[features]
# Release-only log cap; the CLI passes `--features lean` for `--release`.
lean = ["log/release_max_level_warn"]

# Store-distribution release profile. Kept in sync with Frust's root
# `Cargo.toml` and `examples/huddle/Cargo.toml`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# BEGIN release cold-set opt-level overrides (generated: keep hand-synced)
# Shrinks crates cold on the per-frame path; byte-synced with Frust's root
# `Cargo.toml` (tripwire: `crates/frust-cli/tests/profile_sync.rs`).

[profile.release.package.naga]
opt-level = "z"

[profile.release.package.codespan-reporting]
opt-level = "z"

[profile.release.package.ash]
opt-level = "z"

[profile.release.package.gpu-allocator]
opt-level = "z"

[profile.release.package.serde_json]
opt-level = "z"

[profile.release.package.roxmltree]
opt-level = "z"

[profile.release.package.fontique]
opt-level = "z"

[profile.release.package.mio]
opt-level = "z"

[profile.release.package.image]
opt-level = "z"

[profile.release.package.png]
opt-level = "z"
# END release cold-set opt-level overrides

# `--profile`: release performance with symbols kept, for on-device measurement.
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# Shader-compile crates at `opt-level = 2`: unoptimized wgpu/naga translation is slow enough that
# iOS kills a debug launch. Same values as Frust's root, which also lists the vello/glifo/simd crates.
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dependencies at `opt-level = 1` (the named overrides above win).
# Kept in sync with Frust's root `Cargo.toml` and `examples/huddle/Cargo.toml`.
[profile.dev.package."*"]
opt-level = 1
