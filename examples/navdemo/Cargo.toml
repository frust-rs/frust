[package]
name = "navdemo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
forgekit = { workspace = true }

# Dev-only: the headless smoke test drives the framework's `RenderRoot`
# directly (rebuild only — no layout/paint, so no `TextContext` is needed)
# to prove the route table resolves and the retained app state survives a
# navigator push/pop round trip. `forgekit-reactive` seeds the process-wide
# `ReactiveRuntime` the way `forgekit::run` does, since `NavDemoApp::init`
# creates an `RwSignal` (see `docs/ARCHITECTURE.md`'s Component state
# boundary — signal creation needs an ambient runtime).
[dev-dependencies]
forgekit-core = { workspace = true }
forgekit-reactive = { workspace = true }
