# Standalone wasm32-only workspace (own `[workspace]`, `Cargo.lock`, `target/`; in the root
# `exclude` list): a browser app has no business in the native workspace's lockfile or target dir.
[workspace]

[package]
name = "web-gallery"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The facade package is named `frust-ui` (lib name `frust`): https://github.com/lloydmeta/frunk/issues/258
frust = { package = "frust-ui", path = "../../crates/frust" }
frust-gallery = { path = "../gallery" }
# Named so `src/main.rs`'s `register_design_system_fonts` can reach each `font_data()`; they add
# no crate (`frust-gallery` already depends on them). Byte cost: README.md's `wasm32` section.
frust-glyph = { path = "../../plugins/glyph" }
frust-shadcn = { path = "../../plugins/shadcn" }
frust-beui = { path = "../../plugins/beui" }
# `frust-material` and `frust-cupertino` are deliberately absent: Material exposes no public
# `font_data`, and Cupertino bundles no font files, so neither has faces to register.

# --- wasm32-only rows -------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exact pin = the host `wasm-bindgen-cli` (a schema contract, not semver); `web-sys`/`js-sys`
# 0.3.105 and `wasm-bindgen-futures` 0.4.78 are forced by it. Lockstep with
# `examples/web-spike/Cargo.toml`, which derives it (docs/DEVELOPMENT.md § Version-Pin Policy).
wasm-bindgen = "=0.2.128"
# Exactly the DOM surfaces `src/main.rs` reads; the shell owns the canvas and console logging.
web-sys = { version = "0.3.105", features = ["Window", "Location", "UrlSearchParams"] }
js-sys = "0.3.105"
wasm-bindgen-futures = "0.4.78"
# Direct edge so `src/main.rs` can raise the log ceiling from `?log=` before `run_app`
# (`web_app!` installs a fixed `Warn`); the same crate the facade resolves, not a second identity.
frust-shell-web = { path = "../../crates/frust-shell-web" }

# --- release profile --------------------------------------------------------
# Standalone, so the root `[profile.release]` never applies: a hand-synced copy of it, checked
# by `crates/frust-cli/tests/profile_sync.rs`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# NO `[profile.release.package.*]` cold-set overrides, deliberately: that set was measured on ARM64
# Android and wasm has no equivalent measurement. profile_sync.rs asserts the absence.
