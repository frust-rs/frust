# Standalone package: excluded from the root workspace (see root Cargo.toml's
# `[workspace] exclude` and docs/DEVELOPMENT.md's Version-Pin Policy) so the
# `forgekit run`/`build` device pipeline works against it — the generated iOS
# Xcode build phase copies `target/<triple>/<profile>/libcatalog.a` relative to
# this directory, which requires this package's own `target/` (the
# `examples/team-demo` pattern) rather than the root workspace's.
[workspace]

[package]
name = "catalog"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` is the shared library Android's `System.loadLibrary` loads (the JNI
# bridge); `staticlib` is the archive the iOS Xcode target links (the C-ABI
# `forgekit_*` bridge, spec §10.2); `rlib` keeps the crate usable as a normal Rust
# library for the desktop `main.rs` preview binary (spec §12.9).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
forgekit = { path = "../../crates/forgekit" }

# Dev-only: the headless smoke test drives the framework's `RenderRoot`
# directly (rebuild only — no layout/paint, so no `TextContext` is needed) to
# prove a tab switch, a Modals-tab push/pop round trip (with its PopResult
# landing in app state), and a live Material/Cupertino theme swap all survive
# a rebuild with no panic. `forgekit-reactive` seeds the process-wide
# `ReactiveRuntime` the way `forgekit::run` does, since `CatalogApp::init`
# creates several `RwSignal`s (see `docs/ARCHITECTURE.md`'s Component state
# boundary — signal creation needs an ambient runtime). This mirrors
# `examples/navdemo`'s identical dev-dependency shape (`docs/CODE_STANDARDS.md`'s
# State & Reactivity Conventions carves out this exception). Versions pin the
# same concrete releases `examples/team-demo` does (Version-Pin Policy).
[dev-dependencies]
forgekit-core = { path = "../../crates/forgekit-core" }
forgekit-reactive = { path = "../../crates/forgekit-reactive" }
kurbo = "0.13.1"

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution (spec §12.2).
[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"

# `--profile` mode: release performance with symbols + tracing kept for
# on-device performance measurement (spec §12.2). Artifacts land in
# `target/<triple>/profile/` (custom-profile name, verified legal).
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# `[profile.dev]` per-package overrides for the render/shader-compile stack
# (6e Finding 5 / 6e-fix-1 task 03): vello/wgpu/naga's shader-pipeline
# translation runs at `opt-level = 0` by default, which is slow enough on a
# physical iOS device that the OS SIGKILLs a debug `forgekit run` before the
# synchronous, main-thread launch-time shader compile finishes — this
# package is the 6e repro vehicle. This app's own code stays at the default
# dev opt-level (fast incremental rebuilds) — only these dependencies are
# bumped. `docs/spec.md` §12.9 documents `opt-level = 1` for deps generally;
# `opt-level = 2` is used here for the shader-compile-heavy crates
# specifically (see forgekit's own root `Cargo.toml` for the full
# rationale — the same override, kept in sync).
[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2
