[package]
name = "hotpatch-spike"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hotpatch-spike"
path = "src/main.rs"

[dependencies]
hotpatch-spike-app = { path = "../app" }

# Desktop only. Exact pin: must equal the `dx` (dioxus-cli) driving the spike, 0.7.10, whose wire
# format `frust-hotpatch`'s `JumpTable` matches. Patches are applied by frust-hotpatch, not subsecond.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
dioxus-devtools = "=0.7.10"
frust-hotpatch = { path = "../../../crates/frust-hotpatch" }
serde_json = "1"
log = "0.4"
