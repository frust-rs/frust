[package]
name = "hotpatch-spike"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hotpatch-spike"
path = "src/main.rs"

[dependencies]
hotpatch-spike-app = { path = "../app" }

# Desktop only. Exact pin: must equal the `dx` (dioxus-cli) driving the spike, 0.7.10, and the
# `subsecond` row frust-core's `hotpatch` feature resolves.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
dioxus-devtools = "=0.7.10"
