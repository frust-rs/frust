[package]
name = "hotpatch-spike-app"
version = "0.1.0"
edition = "2024"
publish = false

# Not the template's `["cdylib", "staticlib", "rlib"]`: dx 0.7.10 cannot thin-patch that set (rustc args are
# captured under the FIRST crate type, `cdylib` -> `.bin`; a multi-type lib's rlib carries no `-C extra-filename`
# hash for dx's `lib<crate>-*.rlib` lookup). See README.md finding 2. Desktop-only spike, so rlib loses nothing.
[lib]
name = "hotpatch_spike_app"
crate-type = ["rlib"]

[dependencies]
# Published as `frust-ui`, imported as `frust`. `hotpatch` routes every child `Component::build`
# through subsecond's jump table and logs the `frust-hotpatch:` probe lines on desktop.
frust = { package = "frust-ui", path = "../../../crates/frust", features = ["hotpatch"] }
log = "0.4"
