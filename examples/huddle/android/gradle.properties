org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Path to this frust checkout's Android embedding module. One line to edit when
# moving the project to another machine (the same property `frust_path` in
# Cargo.toml already has). Becomes a published Maven coordinate post-crates.io.
# Relative to this file's directory (examples/huddle/android/) — huddle is an
# in-repo consumer, so this stays machine-portable.
frust.embedding.dir=../../../platform/android/frust-embedding
