# Standalone workspace (in the root's `[workspace] exclude`): its own Cargo.lock and `build/rust` let its
# platform pipelines gate on their own, and the `[profile.*]` blocks below only apply in a workspace root.
[workspace]

[package]
name = "huddle"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib`: Android JNI library; `staticlib`: iOS Xcode link target; `rlib`:
# the desktop `main.rs` preview binary.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Escape hatch: app-local `View`/`Widget` pairs (`src/ui/`, the Home `Shimmer`) author via `frust::authoring`
# (+ `frust::kurbo`/`frust::peniko`) only. `frust-ui` rename: https://github.com/lloydmeta/frunk/issues/258
frust = { package = "frust-ui", path = "../../crates/frust" }

# All three design systems: the settings/appearance flow switches between them live.
frust-material = { path = "../../plugins/material" }
frust-cupertino = { path = "../../plugins/cupertino" }
frust-glyph = { path = "../../plugins/glyph" }

# Lockstep: same requirement as `plugins/clean-signals-frust` and `Cargo.toml.clean-signals.tmpl`, or Cargo
# builds two `clean-signals` identities that don't unify (`docs/DEVELOPMENT.md` § Version-Pin Policy).
# Never enable its `effects` feature: the frame path is a custom subscriber, not `RenderEffect`.
clean-signals = "0.1"
clean-signals-frust = { path = "../../plugins/clean-signals-frust" }

# Present so the release-only `lean` feature can cap the log level. Never make
# the cap unconditional: `profile` builds must keep `frust-perf` output.
log = "0.4"

# Headless `tests/*.rs` harness only: `RenderRoot` is deliberately not in `frust::authoring`, so it names
# these crates directly; specs mirror `clean-signals-frust`'s dev-deps so the types unify.
[dev-dependencies]
frust-core = { path = "../../crates/frust-core" }
frust-reactive = { path = "../../crates/frust-reactive" }
frust-scene = { path = "../../crates/frust-scene" }
frust-text = { path = "../../crates/frust-text" }
kurbo = "0.13.1"
peniko = "0.6.1"
reactive_graph = "0.2"
# `#[tokio::test]` controller tests (its time driver backs `clean_signals::time::sleep`); production code
# never spawns a tokio runtime.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[features]
# Release-only log cap; the CLI passes `--features lean` for `--release`.
lean = ["log/release_max_level_warn"]

# Store-distribution release profile. Kept in sync with Frust's root
# `Cargo.toml` and `crates/frust-drive/templates/app/Cargo.toml.tmpl`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# BEGIN release cold-set opt-level overrides (generated: keep hand-synced)
# Shrinks crates cold on the per-frame path; byte-synced with Frust's root
# `Cargo.toml` (tripwire: `crates/frust-cli/tests/profile_sync.rs`).

[profile.release.package.naga]
opt-level = "z"

[profile.release.package.codespan-reporting]
opt-level = "z"

[profile.release.package.ash]
opt-level = "z"

[profile.release.package.gpu-allocator]
opt-level = "z"

[profile.release.package.serde_json]
opt-level = "z"

[profile.release.package.roxmltree]
opt-level = "z"

[profile.release.package.fontique]
opt-level = "z"

[profile.release.package.mio]
opt-level = "z"

[profile.release.package.image]
opt-level = "z"

[profile.release.package.png]
opt-level = "z"
# END release cold-set opt-level overrides

# `--profile`: release performance with symbols kept, for on-device measurement.
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# Shader-compile crates at `opt-level = 2`: unoptimized wgpu/naga translation is
# slow enough that iOS kills a debug launch. Kept in sync with Frust's root.
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.vello_common]
opt-level = 2

[profile.dev.package.glifo]
opt-level = 2

[profile.dev.package.fearless_simd]
opt-level = 2

# Debug dependencies at `opt-level = 1` (the named overrides above win).
# Kept in sync with Frust's root `Cargo.toml` and `crates/frust-drive/templates/app/Cargo.toml.tmpl`.
[profile.dev.package."*"]
opt-level = 1
