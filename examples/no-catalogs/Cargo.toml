[package]
name = "no-catalogs"
version = "0.1.0"
edition = "2024"
publish = false

# The catalog-free build's compile guard (see src/main.rs's top-of-file doc
# comment for the full picture, including a confirmed feature-unification
# limitation on `cargo build --workspace`/`cargo test --workspace`). A
# root-workspace member on purpose, unlike the standalone examples
# (huddle/shadertoy/glyph-catalog/playground) the root `Cargo.toml`'s
# `[workspace] exclude` list carries.
#
# `default-features = false` disables every default-on catalog
# (`glyph`/`material`/`cupertino`/`glyph-fonts` — see `crates/frust/Cargo.toml`
# and root `Cargo.toml`'s `frust-widgets`/`frust-theme` edge comments for the
# opt-out chain this exercises end to end) — but see src/main.rs: this only
# actually holds for a package-scoped command (`cargo build -p no-catalogs`/
# `cargo check -p no-catalogs`), not for `--workspace`.
#
# NOT `{ workspace = true, default-features = false }`: Cargo hard-errors on
# that ("`default-features = false` cannot override workspace's
# `default-features`") because `[workspace.dependencies] frust` (root
# Cargo.toml) leaves `default-features` unspecified — the same restriction
# the `frust-widgets`/`frust-theme` edges there already work around by
# setting `default-features = false` AT the workspace-dependency entry
# itself. Doing that for `frust` too is out of this task's scope (root
# `Cargo.toml`'s `[workspace] members` is the only sanctioned edit there),
# so this edge opts out of inheritance instead: a plain path dependency with
# its own `default-features = false`, verified below to actually drop the
# catalogs (see docs/DEVELOPMENT.md's Version-Pin Policy — this is the same
# "declare it directly, don't fight inheritance" shape non-inherited members
# already use elsewhere).
[dependencies]
frust = { path = "../../crates/frust", default-features = false }
