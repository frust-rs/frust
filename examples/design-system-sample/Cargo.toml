# Standalone workspace (in the root `exclude` list): proves a design system builds from outside the
# frust workspace, with its own lockfile and `target/`, against the facade alone.
[workspace]
resolver = "3"
# Two crates on purpose: the design system must be separate from its consumer, or nothing proves an
# external author could write it.
members = ["sample-design", "sample-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# `default-features = false` must live on this entry, not the member edges: Cargo ignores it on an
# inherited dependency (README.md's catalogs-off contract).
# The facade package is named `frust-ui` (lib name `frust`): https://github.com/lloydmeta/frunk/issues/258
frust = { package = "frust-ui", path = "../../crates/frust", default-features = false }
