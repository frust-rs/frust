[package]
name = "sample-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `default-features = false` on `frust` comes from the workspace entry (Cargo ignores it written on
# an inherited edge); `sample-design` is this app's only design system.
frust = { workspace = true }
sample-design = { path = "../sample-design" }
