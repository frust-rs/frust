# Root-workspace member: desktop-only, no Android/iOS/git+rev, covered by workspace gates.
# Single-crate (no lib.rs/android/ios/cdylib), desktop-only (referenced in main.rs:2, nav.rs:9).
[package]
name = "beui-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
frust = { workspace = true }
frust-beui = { path = "../../plugins/beui" }

[features]
# Off by default; enables frust-beui/gpu-effects (accessed via frust/gpu facade).
gpu-effects = ["frust-beui/gpu-effects"]
