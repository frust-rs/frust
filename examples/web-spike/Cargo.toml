# Standalone throwaway spike, not a shipping example (own `[workspace]` and `Cargo.lock`; in the
# root `exclude` list), so its wasm32-only probe never enters the native workspace graph.
[workspace]

# Probes whether the render-engine graph (scene/text/gpu/engine/render) compiles and renders
# for `wasm32-unknown-unknown`; the required flags/cfgs and findings live in RESULTS.md.
[package]
name = "web-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Engine rows are path deps only: `wgpu`'s wasm32 arm arrives solely through `frust-gpu`'s
# target-gated table, so the graph keeps one `wgpu` identity (RESULTS.md's flags table).
frust-scene = { path = "../../crates/frust-scene" }
frust-text = { path = "../../crates/frust-text" }
frust-gpu = { path = "../../crates/frust-gpu" }
frust-engine = { path = "../../crates/frust-engine" }
frust-render = { path = "../../crates/frust-render" }
# Named directly by `src/main.rs`; exactly the root `[workspace.dependencies]` pins.
kurbo = "0.13.1"
peniko = "0.6.1"

# --- browser-probe rows (wasm32 only) ---------------------------------------
# A native `cargo check` resolves none of these. Each version is a root workspace pin or what
# this spike's own `Cargo.lock` resolved (docs/DEVELOPMENT.md § Version-Pin Policy).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Equals the root `winit` row: the web arm must not fork winit away from the shell tier.
winit = "0.30.13"
# Feature-less on purpose: only the `wgpu::Backends` type is needed (forced-WebGL2 arm); backend
# features still come solely from `frust-gpu`, keeping one `wgpu` identity. Version = root pin.
wgpu = { version = "30.0.1", default-features = false }
# Exact pin = the host `wasm-bindgen-cli`: the CLI's schema version must equal the crate's or
# post-processing fails (not semver). `=` unifies the graph, wgpu's edge included, on one
# identity. Lockstep with `examples/web-gallery/Cargo.toml`'s identical row.
wasm-bindgen = "=0.2.128"
# Forced by the pin above: `wasm-bindgen-futures` 0.4.78 and `js-sys`/`web-sys` 0.3.105 each
# require `wasm-bindgen = "=0.2.128"` exactly; 0.3.104 is not co-satisfiable with it.
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
# Exactly the features `src/main.rs` names; `Performance` is the only clock (`Instant` panics here).
web-sys = { version = "0.3.105", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Performance",
    "UrlSearchParams",
    "Window",
] }
# Diagnostics, not decoration: `frust-render`/`frust-gpu`/`wgpu` report failures through `log`,
# and the panic hook turns a wasm `unreachable` trap back into the panic message.
log = "0.4.34"
console_log = "1.0.0"
console_error_panic_hook = "0.1.7"

# --- reactive-wasm proof rows (wasm32 only) ---------------------------------
# Drives the `signal=timer` proof mode with a real `ReactiveRuntime`; buildable for wasm32 via
# `crates/frust-reactive/Cargo.toml`'s target-gated `tokio` arm.
frust-reactive = { path = "../../crates/frust-reactive" }
# For `Get`/`Set` (not re-exported by `frust-reactive`); the root row's `"0.2"` range, so it
# unifies onto one `reactive_graph` identity.
reactive_graph = "0.2"

# --- release profile --------------------------------------------------------
# Standalone, so the root `[profile.release]` never applies: a hand-synced copy, so RESULTS.md's
# size and first-frame numbers reflect what a real Frust app ships.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# --- naga GLSL-ES lowering inspector (native dev-only) ----------------------
# `examples/lower_strip.rs` lowers `strip.wgsl` to GLSL ES for RESULTS.md § 17; a dev-dependency,
# so the shipped wasm artifact is unaffected.
[dev-dependencies]
# Exact pin = the naga `wgpu` 30.0.1 already resolves in `Cargo.lock` (moves with `wgpu`); it
# adds no crate, only the `glsl-out` feature.
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }

[[example]]
name = "lower_strip"
path = "examples/lower_strip.rs"
