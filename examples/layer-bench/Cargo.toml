# Standalone package: excluded from the root workspace (see root Cargo.toml's
# `[workspace] exclude`) so the generated Android/iOS projects resolve a
# project-local `target/` dir and the `[profile.*]` blocks below take effect
# (they only apply in a workspace root) — the same shape as
# `examples/shadertoy`/`examples/glyph-catalog`.
[workspace]

[package]
name = "layerbench"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` is the shared library Android's `System.loadLibrary` loads (the JNI
# bridge); `staticlib` is the archive the iOS Xcode target links (the C-ABI
# `frust_*` bridge); `rlib` keeps the crate usable as a normal Rust
# library for the desktop `main.rs` preview binary.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# NOTE: temporary path dependency pointing at the Frust repo checkout
# that generated this project (the `frust_path` mechanism is
# explicitly temporary). Once Frust crates are published, `frust
# create` will emit a version dependency here instead. `default-features =
# false` drops the ~1MB Glyph bundled fonts — this throwaway bench shapes a
# fixed handful of glyph runs by hand and never selects the Glyph design
# language, so the fonts would be dead weight.
frust = { path = "../../crates/frust", default-features = false }

# `frust` is the ONLY framework line this bench ships. The `BenchView`
# `View`/`Widget` pair reaches everything it needs through `frust::authoring`
# (trait vocabulary + geometry), `frust::authoring::text` (shaping its own
# labels), `frust::authoring::scene` (`ShaderProgram`, the `PaintScene`/
# `Command` vocabulary) and the `frust::peniko` long-tail valve — nothing
# production pins a framework internal like `kurbo`/`peniko` any more.
#
# Note this crate is also the canary proving `frust::authoring` is NOT
# feature-gated: it resolves under `default-features = false` above.

# `log` facade dependency, present only so the release-only `lean` feature
# below can raise the compiled-in log ceiling (release-lean build mode).
# `frust-perf` instrumentation rides `log::info!`, so the ceiling MUST be a
# release-only opt-in and never an always-on `features = [...]` line:
# `release_max_level_*` keys off `debug_assertions`, which the
# `[profile.profile]` inherits-release profile has OFF, so an unconditional
# ceiling would also silence PROFILE-mode perf output — exactly the mode that
# must keep it. The `frust` CLI enables `--features lean` for `--release`
# builds only (riding the same features plumbing that turns on
# `frust/perf-trace` for debug/profile), so release strips stray info/debug
# log lines while keeping warn/error crash diagnostics, and profile keeps its
# `frust-perf` output.
log = "0.4"

[dev-dependencies]
# Test-harness-only, NOT an escape hatch: the headless T0 scene tests
# (`tests/scene.rs`) drive Frust's `RenderRoot` directly — the desktop shell's
# own rebuild/layout/paint seam, no GPU, no window, the same harness shape as
# `examples/shadertoy/tests/showcase.rs`. `RenderRoot` is deliberately not in
# `frust::authoring` (it is shell-owned, not something an app constructs), so
# the harness still names these crates the long way; migrating headless test
# harnesses onto the facade is a separate design question (see this feature's
# TASKS.md § Deferred). Production code names none of them.
frust-core = { path = "../../crates/frust-core" }
frust-scene = { path = "../../crates/frust-scene" }
frust-text = { path = "../../crates/frust-text" }
kurbo = "0.13.1"
peniko = "0.6.1"
frust-reactive = { path = "../../crates/frust-reactive" }
reactive_graph = "0.2"

[features]
# Release-lean log ceiling — see the `log` dependency above for why this is a
# release-only opt-in rather than an unconditional manifest feature. The CLI
# passes `--features lean` for `--release` builds; debug/profile builds omit
# it (and enable `frust/perf-trace` instead).
lean = ["log/release_max_level_warn"]

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution. Hand-synced with Frust's own root
# `Cargo.toml` and the other standalone examples.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `--profile` mode: release performance with symbols + tracing kept for
# on-device performance measurement — the mode this whole spike
# runs under (`frust build apk --profile`). Artifacts land in
# `target/<triple>/profile/`.
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# `[profile.dev]` per-package overrides for the render/shader-compile stack:
# vello/wgpu/naga's shader-pipeline translation runs at `opt-level = 0` by
# default, slow enough on a physical iOS device that the OS SIGKILLs a debug
# `frust run` before the launch-time shader compile finishes. This app's own
# code stays at the default dev opt-level (fast incremental rebuilds) — only
# these dependencies are bumped. Hand-synced with Frust's own root `Cargo.toml`.
[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dep opt widening: non-workspace-member dependencies build at
# `opt-level = 1` in debug (Cargo's `"*"` selector excludes workspace members
# and the profile's own package); the named shader-stack overrides above
# (opt-level 2) still win since a named override beats `"*"`.
[profile.dev.package."*"]
opt-level = 1
