[dependencies]
forgekit = { workspace = true }

# Dev-only: the headless interaction test drives the framework's `RenderRoot`
# directly with synthetic `InputEvent`s (the desktop shell's own event seam),
# shaping text through a real `TextContext` and recording paint output — no GPU,
# no window, no OS-level UI automation. Proves the counter's event wiring
# deterministically as a permanent regression gate.
[dev-dependencies]
forgekit-core = { workspace = true }
forgekit-scene = { workspace = true }
forgekit-text = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
