# Continuous integration for pull requests and main.
#
# The toolchain is whatever rust-toolchain.toml pins (1.98.1 + rustfmt + clippy);
# rustup installs it on first use. `ci-ok` is the single aggregate check that
# .github/rulesets/main.json requires, so a job added here only gates merges once
# it is listed in `ci-ok`'s `needs`. No secrets are used and nothing runs on
# `pull_request_target`.
#
# A change that touches only Markdown files or docs/ does not run this workflow:
# docs.yml runs the commit-hygiene guard for it and reports the same `ci-ok`
# check, so a documentation pull request merges without a build. The two path
# lists must stay identical.

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A debug build of every workspace test binary with full debug info does not
  # fit a hosted runner's disk: the linker died with SIGBUS while writing its
  # output. Nothing here runs a debugger, so CI builds without debug info and
  # without incremental state. Panic locations and symbol names are unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Linux build packages
        run: |
          pkgs=(
            # C toolchain helper: build scripts locate system libraries through pkg-config
            pkg-config
            # Text: yeslogic-fontconfig-sys (system font discovery) needs a pkg-config sysroot (docs/DEVELOPMENT.md, Test section)
            libfontconfig1-dev libfreetype-dev
            # Wayland: wayland-sys (via winit and wgpu-hal) probes wayland-client through pkg-config
            libwayland-dev libxkbcommon-dev
            # X11: the desktop shells' windowing and clipboard (x11-dl, x11rb)
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev
          )
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # A runner that runs out of disk stops responding instead of failing; the
    # default limit is six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Linux build packages
        # One install step, a comment per package group. GPU-dependent tests are
        # #[ignore] and stay ignored, so no GPU driver packages are installed.
        run: |
          pkgs=(
            # C toolchain helper: build scripts locate system libraries through pkg-config
            pkg-config
            # Text: yeslogic-fontconfig-sys (system font discovery) needs a pkg-config sysroot (docs/DEVELOPMENT.md, Test section)
            libfontconfig1-dev libfreetype-dev
            # Text: the frust-text fontconfig backend's host tests resolve a CJK cluster through the system font set
            fonts-droid-fallback
            # Wayland: wayland-sys (via winit and wgpu-hal) probes wayland-client through pkg-config
            libwayland-dev libxkbcommon-dev
            # X11: the desktop shells' windowing and clipboard (x11-dl, x11rb)
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev
          )
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Disk before the build
        run: df -h /
      # --no-fail-fast: run every test binary and report every failure, not
      # only the first binary that fails.
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Disk after the build
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  standalone:
    name: standalone (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: examples/huddle
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings
          - dir: examples/shadertoy
            # No documented test gate; a full-target check proves the graph builds.
            gate: cargo check --locked --all-targets
          - dir: examples/glyph-catalog
            gate: cargo build --locked && cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
          - dir: examples/playground
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
          - dir: examples/design-system-sample
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
          - dir: examples/material3-demo
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
          - dir: examples/native-widgets-demo
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
          - dir: examples/web-gallery
            wasm: true
            gate: cargo check --locked --target wasm32-unknown-unknown
          - dir: examples/web-spike
            wasm: true
            gate: cargo check --locked && cargo check --locked --target wasm32-unknown-unknown
          - dir: plugins/clean-signals-frust
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings
          - dir: benchmarks/frust_bench
            # A benchmark app built for Android/iOS (cdylib + staticlib); on Linux
            # only a compile check is meaningful, so it gets `cargo check`.
            gate: cargo check --locked --all-targets
          - dir: testing/hotpatch-canary
            # The hot-patch canary's fixture; the canary itself runs in its own job.
            gate: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Add the wasm32 target
        if: ${{ matrix.wasm }}
        run: rustup target add wasm32-unknown-unknown
      - name: Install Linux build packages
        run: |
          pkgs=(
            # C toolchain helper: build scripts locate system libraries through pkg-config
            pkg-config
            # Text: yeslogic-fontconfig-sys (system font discovery) needs a pkg-config sysroot (docs/DEVELOPMENT.md, Test section)
            libfontconfig1-dev libfreetype-dev
            # Wayland: wayland-sys (via winit and wgpu-hal) probes wayland-client through pkg-config
            libwayland-dev libxkbcommon-dev
            # X11: the desktop shells' windowing and clipboard (x11-dl, x11rb)
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev
          )
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.dir }}
      - name: Gate
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.gate }}

  web-smoke:
    # The browser tier (frust-rs/frust#127): the wasm32 clock tripwire, then a
    # headless-Chrome boot of the web gallery in strict mode (the render surface
    # must come online). No system packages: the wasm32 graph links nothing native.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli 0.2.128
        # The workspace pin (docs/DEVELOPMENT.md, Version-Pin Policy). Installed from
        # the release tarball and verified by sha256; never `cargo install` a
        # floating version. The digest is from the release's
        # wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz.sha256sum asset,
        # fetched from https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/.
        env:
          WASM_BINDGEN_SHA256: b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasm-bindgen"
          mkdir -p "$dir/bin"
          curl -fsSL -o "$dir/wasm-bindgen.tar.gz" \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $dir/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$dir/wasm-bindgen.tar.gz" -C "$dir"
          install -m 0755 "$dir/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen" "$dir/bin/wasm-bindgen"
          ver="$("$dir/bin/wasm-bindgen" --version | awk '{print $2}')"
          [ "$ver" = "0.2.128" ] || { echo "::error::wasm-bindgen is $ver, expected 0.2.128"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The root workspace (wasm-time-check's clippy) and the gallery's own
          # standalone workspace (web-smoke's build) keep separate target dirs.
          workspaces: |
            .
            examples/web-gallery
      - name: Clock tripwire (wasm32 graph)
        run: scripts/ci/wasm-time-check.sh
      - name: Boot smoke (headless Chrome, strict)
        env:
          CHROME: google-chrome
          FRUST_WEB_SMOKE_REQUIRE_SURFACE: "1"
        run: scripts/ci/web-smoke.sh --out "$RUNNER_TEMP/web-smoke"
      - name: Upload the smoke logs and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: warn
          retention-days: 7

  hotpatch-feature-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Linux build packages
        run: |
          pkgs=(
            # C toolchain helper: build scripts locate system libraries through pkg-config
            pkg-config
            # Text: yeslogic-fontconfig-sys (system font discovery) needs a pkg-config sysroot (docs/DEVELOPMENT.md, Test section)
            libfontconfig1-dev libfreetype-dev
            # Wayland: wayland-sys (via winit and wgpu-hal) probes wayland-client through pkg-config
            libwayland-dev libxkbcommon-dev
            # X11: the desktop shells' windowing and clipboard (x11-dl, x11rb)
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev
          )
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bash scripts/ci/hotpatch-feature-gate.sh

  hotpatch-canary:
    # The desktop patch builder end to end on the pinned toolchain: capture, fat
    # build, edit, thin build, L3, in-process apply, and a D2 edit that must be
    # refused (scripts/ci/hotpatch-canary.sh). One leg per builder platform. The
    # headless fixture needs no GUI packages.
    name: hotpatch-canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: testing/hotpatch-canary
      - name: Canary
        # L3 reads DWARF types: full debug info for this step only.
        env:
          CARGO_PROFILE_DEV_DEBUG: 2
        run: bash scripts/ci/hotpatch-canary.sh

  hotpatch-windows:
    # The Windows (MSVC) hot-patch builder mechanics, whose PDB fixtures need a
    # Windows host: PE/PDB symbol cache, jump table, stub and PDB layout gate
    # (`hotpatch::pe`, `hotpatch::pdb_layout`), the fixed-base fat and thin links
    # (`hotpatch::fat_link`, `hotpatch::thin_link`) and the real session over them
    # (`hotpatch::session::windows`). The filter names modules rather than all of
    # `hotpatch::` because five known Windows-host failures live outside them
    # (act_000001a12096ed6445DWzpgI). The devtools service runs with its
    # `hotpatch` feature: Windows applies hot patches and answers the same gate as
    # every other host. The job fails when any of the five module filters matched
    # no test or the devtools crate ran none. The runner's minutes are the owner's
    # call: drop this job from `ci-ok`'s needs, or give it a path filter, to stop
    # it gating every pull request.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Hot-patch builder tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p frust-drive --lib -- hotpatch::pe hotpatch::pdb_layout hotpatch::fat_link hotpatch::thin_link hotpatch::session::windows 2>&1 | tee "$RUNNER_TEMP/frust-drive-tests.log"
      - name: Devtools service tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p frust-devtools --features hotpatch 2>&1 | tee "$RUNNER_TEMP/frust-devtools-tests.log"
      - name: Each module filter ran tests
        shell: bash
        run: |
          drive="$RUNNER_TEMP/frust-drive-tests.log"
          for module in hotpatch::pe hotpatch::pdb_layout hotpatch::fat_link hotpatch::thin_link hotpatch::session::windows; do
            count=$(grep -c "^test ${module}::" "$drive" || true)
            echo "$module: $count tests"
            if [ "$count" -eq 0 ]; then
              echo "::error::the frust-drive filter $module matched no test"
              exit 1
            fi
          done
          passed=$(awk '/test result:/ { for (i = 2; i <= NF; i++) if ($i == "passed;") sum += $(i - 1) } END { print sum + 0 }' "$RUNNER_TEMP/frust-devtools-tests.log")
          echo "frust-devtools: $passed passed"
          if [ "$passed" -eq 0 ]; then
            echo "::error::frust-devtools ran no tests"
            exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit-hygiene guard self-test
        run: scripts/ci/commit-hygiene.sh --self-test
      - name: Check this pull request's commits
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/commit-hygiene.sh origin/${{ github.base_ref }}..HEAD
      - name: Licence texts are in sync
        run: scripts/sync-licenses.sh --check
      - name: Codemod unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -I -m unittest discover -s scripts/codemod -p 'test_*.py'
      - name: Erasure tripwire
        run: scripts/ci/erasure-check.sh

  ci-ok:
    # The one required status check (.github/rulesets/main.json).
    if: always()
    needs: [fmt, clippy, test, standalone, web-smoke, hotpatch-feature-gate, hotpatch-canary, hotpatch-windows, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
