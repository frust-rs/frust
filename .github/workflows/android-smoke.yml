# Android smoke test workflow — end-to-end emulator check
#
# This workflow proves that a fresh Frust scaffold and the playground example
# can build, install, and run on an Android 14 (API 34) emulator target, and
# that key invariants hold: system-bar insets are non-zero (real geometry, not
# legacy zeroed), and the database smoke query round-trips cleanly.
#
# The workflow is MANUAL + NIGHTLY by design: an x86_64 Android emulator with
# the NDK + SDK toolchain takes 20-25 minutes of wall-clock runner time per
# run. The build itself compiles for three ABIs (arm64-v8a, armeabi-v7a, x86_64)
# and publishes diagnostics to build/android-smoke/ on failure. In a private
# repository, that is a budgeted cost, not a free-tier case. The owner may
# enable, edit, or delete this workflow at any time; it is delivered as a
# template, not a required gate.
#
# This workflow is NOT part of the plan's acceptance criteria and must never be
# assumed in docs or tests.

name: Android Emulator Smoke Test

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: android-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-all
          sudo udevadm trigger --name-match=kvm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Show Rust toolchain
        run: rustup show

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git/db
          key: cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-index-

      - name: Cache Cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/build.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@31f424d05a8bea0229d0feab746260472ef8e34d # v2.9.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/testing/android-smoke.sh --leg all

      - name: Upload android-smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-smoke-diagnostics
          path: build/android-smoke/**
          if-no-files-found: warn
