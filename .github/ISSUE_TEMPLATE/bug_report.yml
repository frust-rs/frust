name: Bug report
description: Something does not work as documented or crashes.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps, or a link to a minimal repository.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Frust version or commit
      placeholder: "0.5.0 or a git commit SHA"
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms affected
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Web
  - type: input
    id: device
    attributes:
      label: Device and GPU
      placeholder: "Pixel 8, Apple M2, NVIDIA RTX 3060, ..."
  - type: textarea
    id: doctor
    attributes:
      label: "`frust doctor` output"
      description: Paste the output of `frust doctor`.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs, panic messages, or backtraces.
      render: shell
